<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Profile - 60 Seconds FM</title>

<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
/* ===== EXACT BASE FROM INDEX ===== */
:root {
  --gold:#d4af37;
  --gold-2:#f4d77a;
  --gold-dark:#8f6b13;
  --text:#f5f5f5;
  --muted:#a8a8a8;
  --desktop-rail-width:86px;
  --desktop-rail-expanded:320px;
  --mobile-bottom-nav-height:86px;
  --mobile-nav-bg:rgba(10,10,10,.94);
}

body{
  margin:0;
  min-height:100vh;
  background:
    linear-gradient(180deg,rgba(7,7,7,.46),rgba(7,7,7,.72)45%,rgba(7,7,7,.84)),
    radial-gradient(circle at top,rgba(212,175,55,.14),transparent 30%),
    url("bg-mobile-final-1080x1920.webp");
  background-size:cover,auto,cover;
  color:var(--text);
  font-family:'Manrope',sans-serif;
  padding:0 18px 44px calc(var(--desktop-rail-width) + 28px);
}

.hidden{display:none!important}

/* ===== SIDEBAR (IDENTIEK) ===== */
.desktop-side-nav{
  position:fixed;
  top:50%;
  left:18px;
  transform:translateY(-50%);
  width:var(--desktop-rail-width);
  height:80vh;
  z-index:120;
  transition:.3s;
}
.desktop-side-nav:hover{width:var(--desktop-rail-expanded)}

.desktop-nav-link{
  display:flex;
  align-items:center;
  gap:16px;
  padding:16px;
  text-decoration:none;
  color:#fff;
  border-radius:16px;
}

.desktop-nav-link.active{
  background:rgba(212,175,55,.15);
}

/* ===== HEADER ===== */
.header-wrap{
  position:sticky;
  top:0;
  z-index:80;
  backdrop-filter:blur(8px);
}
.header-bar{
  display:grid;
  grid-template-columns:60px 1fr 60px;
  align-items:center;
  padding:10px;
}
.header-logo{
  width:200px;
}

/* ===== MOBILE NAV ===== */
.mobile-bottom-nav-wrap{
  display:none;
}

@media(max-width:760px){
  body{padding:0 14px calc(var(--mobile-bottom-nav-height)+18px);}
  .desktop-side-nav{display:none;}

  .mobile-bottom-nav-wrap{
    display:block;
    position:fixed;
    bottom:0;
    width:100%;
    height:var(--mobile-bottom-nav-height);
    background:var(--mobile-nav-bg);
  }

  .mobile-bottom-nav{
    display:flex;
    justify-content:space-around;
    height:100%;
    align-items:center;
  }
}

/* ===== PAGE ===== */
.page-wrap{
  max-width:700px;
  margin:40px auto;
}

input,textarea,select{
  width:100%;
  padding:14px;
  border-radius:12px;
  border:none;
  background:#111;
  color:#fff;
}

button{
  padding:14px 20px;
  border-radius:999px;
  border:none;
  background:linear-gradient(#fff5c9,#d4af37);
  cursor:pointer;
}

</style>
</head>

<body>

<!-- ===== SIDEBAR ===== -->
<aside class="desktop-side-nav">
  <a class="desktop-nav-link" href="index.html">Radio</a>
  <a id="desktopProfileLink" class="desktop-nav-link active hidden" href="#">Profile</a>
  <a id="desktopNotificationsLink" class="desktop-nav-link hidden" href="notifications.html">Notifications</a>
  <a id="desktopTrackLink" class="desktop-nav-link hidden" href="submit-track.html">Track</a>
  <a id="desktopLoginLink" class="desktop-nav-link" href="login.html">Login</a>
  <button id="desktopLogoutBtn" class="desktop-nav-link hidden">Logout</button>
</aside>

<!-- ===== MOBILE NAV ===== -->
<div class="mobile-bottom-nav-wrap">
  <nav class="mobile-bottom-nav">
    <a href="index.html">Radio</a>
    <a id="mobileProfileLink" class="hidden" href="#">Profile</a>
    <a id="mobileNotificationsLink" class="hidden" href="notifications.html">Notifications</a>
    <a id="mobileTrackLink" class="hidden" href="submit-track.html">Track</a>
    <a id="mobileLoginLink" href="login.html">Login</a>
  </nav>
</div>

<!-- ===== HEADER ===== -->
<div class="header-wrap">
<header class="header-bar">
  <div></div>

  <div style="text-align:center">
    <img src="logo.png" class="header-logo">
  </div>

  <div style="text-align:right">
    <a id="showLoginBtn" href="login.html">👤</a>
    <button id="headerAvatarBtn" class="hidden">A</button>
  </div>
</header>
</div>

<!-- ===== PAGE ===== -->
<div class="page-wrap">

<h1>Edit Profile</h1>

<div id="loginRequired">Login required</div>

<div id="form" class="hidden">

<input id="artistName" placeholder="Artist name">
<textarea id="bio" placeholder="Bio"></textarea>

<select id="nationality"></select>

<input type="date" id="dateOfBirth">
<input id="socialLink" placeholder="Social link">
<input type="file" id="photoFile">

<button id="saveProfileBtn">Save Profile</button>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const supabaseClient = window.supabase.createClient(
 "https://rgoutegbcpjytplqcwze.supabase.co",
 "sb_publishable_255qyDKS77nMU0pbedfa_A_3hdgtEHh"
);

/* ===== ELEMENTS ===== */
const desktopProfileLink = document.getElementById("desktopProfileLink");
const mobileProfileLink = document.getElementById("mobileProfileLink");
const desktopLoginLink = document.getElementById("desktopLoginLink");
const mobileLoginLink = document.getElementById("mobileLoginLink");
const desktopLogoutBtn = document.getElementById("desktopLogoutBtn");

const form = document.getElementById("form");
const loginRequired = document.getElementById("loginRequired");

/* ===== AUTH UI (MATCH INDEX) ===== */
async function refreshUI(){
 const {data} = await supabaseClient.auth.getSession();
 const user = data?.session?.user;

 if(user){
   desktopLoginLink.classList.add("hidden");
   mobileLoginLink.classList.add("hidden");
   desktopLogoutBtn.classList.remove("hidden");

   desktopProfileLink.classList.remove("hidden");
   mobileProfileLink.classList.remove("hidden");

   form.classList.remove("hidden");
   loginRequired.classList.add("hidden");

   const profileHref = `artist.html?user_id=${user.id}`;
   desktopProfileLink.href = profileHref;
   mobileProfileLink.href = profileHref;

 }else{
   form.classList.add("hidden");
   loginRequired.classList.remove("hidden");
 }
}

/* ===== LOGOUT ===== */
desktopLogoutBtn.onclick = async ()=>{
 await supabaseClient.auth.signOut();
 location.reload();
};

/* ===== INIT ===== */
refreshUI();
</script>

</body>
</html>
