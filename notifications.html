<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notifications — 60 Seconds FM</title>

  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/notifications.css">
</head>
<body>
  <script src="assets/js/nav-component.js"></script>

      <div class="header-center">
        <a href="index.html" class="header-logo-link" aria-label="60 Seconds FM home">
          <img src="logo.png" alt="60 Seconds FM" class="header-logo" />
        </a>
      </div>

      <div class="header-right">
        <a id="showLoginBtn" class="header-icon-btn" href="login.html" aria-label="Login">
          <span class="person-icon" aria-hidden="true"></span>
        </a>

        <button id="headerAvatarBtn" class="header-avatar-btn hidden" type="button" aria-label="Open account menu">
          <img id="headerAvatarImage" class="hidden" src="" alt="Profile photo" />
          <div id="headerAvatarFallback" class="header-avatar-fallback hidden">A</div>
        </button>

        <div id="accountMenu" class="account-menu hidden">
          <div class="account-menu-actions">
            <a id="accountProfileLink" class="metal-btn account-menu-link hidden" href="javascript:void(0)">Profile</a>
            <button id="logout" class="metal-btn" type="button"><span class="icon">⎋</span>Logout</button>
          </div>
        </div>
      </div>
    </header>
  </div>

  <div class="site-shell">
    <main class="page-wrap">
      <h1 class="page-title">Notifications</h1>
      <p class="page-subtitle">Stay updated with your activity</p>

      <div class="empty-card">
        <div class="empty-icon">🔔</div>
        <div class="empty-title">No notifications yet</div>
        <div class="empty-text">
          When something happens, you'll see it here.
        </div>
        <a href="index.html" class="back-link">← Back to Radio</a>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/notifications.js"></script>
  <script src="assets/js/radio-mini-player.js"></script>
</body>
</html>
