<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Notifications — 60 Seconds FM</title>

  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --gold: #d4af37;
      --text: #f5f5f5;
      --muted: #aaaaaa;
      --desktop-rail-width: 86px;
      --mobile-bottom-nav-height: 86px;
      --mobile-nav-bg: rgba(10, 10, 10, 0.94);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(180deg, rgba(7, 7, 7, 0.46), rgba(7, 7, 7, 0.84)),
        url("bg-mobile-final-1080x1920.webp");
      color: var(--text);
      font-family: 'Manrope', sans-serif;
      padding: 0 18px 44px calc(var(--desktop-rail-width) + 28px);
    }

    .hidden { display: none !important; }

    /* HEADER */
    .header-wrap {
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 10px;
      text-align: center;
    }

    .header-logo {
      width: 180px;
    }

    /* SIDEBAR */
    .desktop-side-nav {
      position: fixed;
      top: 50%;
      left: 18px;
      transform: translateY(-50%);
      width: var(--desktop-rail-width);
    }

    .desktop-nav-link {
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 16px;
      text-decoration: none;
      color: white;
    }

    .desktop-nav-link.active {
      color: var(--gold);
    }

    /* MAIN */
    .page-wrap {
      max-width: 720px;
      margin: 120px auto 0;
      text-align: center;
    }

    .page-title {
      font-size: 40px;
      margin-bottom: 12px;
    }

    .page-subtitle {
      color: var(--muted);
      margin-bottom: 40px;
    }

    .empty-card {
      padding: 50px 30px;
      border-radius: 28px;
      background: rgba(20,20,20,0.8);
      border: 1px solid rgba(212,175,55,0.15);
    }

    .back-link {
      color: var(--gold);
      text-decoration: none;
    }

    /* MOBILE NAV */
    @media (max-width: 760px) {
      body {
        padding: 0 14px calc(var(--mobile-bottom-nav-height) + 18px);
      }

      .desktop-side-nav {
        display: none;
      }

      .mobile-bottom-nav-wrap {
        position: fixed;
        bottom: 0;
        width: 100%;
        height: var(--mobile-bottom-nav-height);
        background: var(--mobile-nav-bg);
        display: flex;
      }

      .mobile-nav-link {
        flex: 1;
        text-align: center;
        font-size: 10px;
        color: white;
        text-decoration: none;
      }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <div class="header-wrap">
    <a href="index.html">
      <img src="logo.png" class="header-logo">
    </a>
  </div>

  <!-- SIDEBAR -->
  <aside class="desktop-side-nav">
    <a class="desktop-nav-link" href="index.html">Radio</a>
    <a id="profileLinkNav" class="desktop-nav-link hidden" href="edit-profile.html">Profile</a>
    <a class="desktop-nav-link active" href="notifications.html">Notifications</a>
    <a id="trackLinkNav" class="desktop-nav-link hidden" href="submit-track.html">Track</a>
    <a id="loginLinkNav" class="desktop-nav-link" href="login.html">Login</a>
    <a id="logoutBtnNav" class="desktop-nav-link hidden" href="#">Logout</a>
  </aside>

  <!-- CONTENT -->
  <main class="page-wrap">
    <h1 class="page-title">Notifications</h1>
    <p class="page-subtitle">Stay updated with your activity</p>

    <div class="empty-card">
      <div style="font-size:40px;">🔔</div>
      <h2>No notifications yet</h2>
      <p>When something happens, you'll see it here.</p>
      <a href="index.html" class="back-link">← Back to Radio</a>
    </div>
  </main>

  <!-- MOBILE NAV -->
  <div class="mobile-bottom-nav-wrap">
    <a class="mobile-nav-link" href="index.html">Radio</a>
    <a id="mobileProfileLink" class="mobile-nav-link hidden" href="edit-profile.html">Profile</a>
    <a class="mobile-nav-link" href="notifications.html">Notif</a>
    <a id="mobileTrackLink" class="mobile-nav-link hidden" href="submit-track.html">Track</a>
  </div>

  <!-- SUPABASE -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const supabaseClient = window.supabase.createClient(
      "https://rgoutegbcpjytplqcwze.supabase.co",
      "sb_publishable_255qyDKS77nMU0pbedfa_A_3hdgtEHh"
    );

    const profileLinkNav = document.getElementById("profileLinkNav");
    const trackLinkNav = document.getElementById("trackLinkNav");
    const loginLinkNav = document.getElementById("loginLinkNav");
    const logoutBtnNav = document.getElementById("logoutBtnNav");

    const mobileProfileLink = document.getElementById("mobileProfileLink");
    const mobileTrackLink = document.getElementById("mobileTrackLink");

    async function init() {
      const { data } = await supabaseClient.auth.getSession();
      const user = data?.session?.user;

      if (!user) {
        loginLinkNav.classList.remove("hidden");
        logoutBtnNav.classList.add("hidden");
        return;
      }

      loginLinkNav.classList.add("hidden");
      logoutBtnNav.classList.remove("hidden");

      profileLinkNav.classList.remove("hidden");
      mobileProfileLink.classList.remove("hidden");

      const { data: profile } = await supabaseClient
        .from("profiles")
        .select("*")
        .eq("user_id", user.id)
        .maybeSingle();

      if (profile) {
        trackLinkNav.classList.remove("hidden");
        mobileTrackLink.classList.remove("hidden");
      }
    }

    logoutBtnNav.onclick = async () => {
      await supabaseClient.auth.signOut();
      window.location.href = "index.html";
    };

    init();
  </script>

</body>
</html>
