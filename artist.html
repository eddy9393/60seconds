<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Artist Page - 60 Seconds FM</title>

  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --gold: #d4af37;
      --gold-2: #f4d77a;
      --gold-dark: #8f6b13;
      --text: #f5f5f5;
      --muted: #a8a8a8;
      --panel: rgba(17,17,17,0.92);
      --panel-2: rgba(22,22,22,0.88);
      --border: rgba(255,255,255,0.08);
      --border-gold: rgba(212,175,55,0.18);
      --shadow: 0 30px 80px rgba(0,0,0,0.42);

      --fs-label: 12px;
      --fs-body: 14px;
      --fs-track-title: clamp(28px, 4vw, 42px);
      --fs-artist-name: clamp(26px, 4vw, 40px);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(180deg, rgba(7, 7, 7, 0.48) 0%, rgba(7, 7, 7, 0.72) 45%, rgba(7, 7, 7, 0.82) 100%),
        radial-gradient(circle at top, rgba(212, 175, 55, 0.14), transparent 30%),
        url("bg-mobile-final-1080x1920.webp");
      background-size: cover, auto, cover;
      background-position: center top, center top, center center;
      background-repeat: no-repeat, no-repeat, no-repeat;
      background-attachment: fixed, scroll, fixed;
      color: var(--text);
      font-family: 'Manrope', sans-serif;
      padding: 0 18px 44px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    h1, h2, h3 {
      font-family: 'Space Grotesk', sans-serif;
      margin: 0;
    }

    a {
      color: inherit;
    }

    .hidden {
      display: none !important;
    }

    .site-shell {
      max-width: 1180px;
      margin: 0 auto;
    }

    .header-bar {
      position: sticky;
      top: 0;
      z-index: 40;
      display: grid;
      grid-template-columns: 45px 1fr 45px;
      align-items: center;
      gap: 10px;
      min-height: 74px;
      padding: 8px 6px 4px;
      background: linear-gradient(180deg, rgba(0,0,0,0.74), rgba(0,0,0,0.42) 70%, rgba(0,0,0,0));
      backdrop-filter: blur(6px);
    }

    .header-left,
    .header-center,
    .header-right {
      display: flex;
      align-items: center;
    }

    .header-left {
      justify-content: flex-start;
    }

    .header-center {
      justify-content: center;
    }

    .header-right {
      justify-content: flex-end;
      position: relative;
    }

    .header-logo-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
    }

    .header-logo {
      display: block;
      width: min(288px, 45vw);
      height: auto;
      filter:
        drop-shadow(0 8px 18px rgba(0, 0, 0, 0.35))
        drop-shadow(0 0 20px rgba(212, 175, 55, 0.08));
    }

    .header-icon-btn {
      width: 42px;
      height: 42px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.14);
      background:
        linear-gradient(180deg, rgba(255,255,255,0.12), rgba(255,255,255,0.04)),
        linear-gradient(180deg, rgba(10,10,10,0.86), rgba(10,10,10,0.92));
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.08),
        0 10px 22px rgba(0,0,0,0.24);
      backdrop-filter: blur(4px);
      transition: transform 0.14s ease, box-shadow 0.14s ease, filter 0.14s ease;
      padding: 0;
    }

    .header-icon-btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.03);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.10),
        0 14px 24px rgba(0,0,0,0.28);
    }

    .menu-icon {
      position: relative;
      width: 20px;
      height: 16px;
    }

    .menu-icon span {
      position: absolute;
      left: 0;
      width: 20px;
      height: 3px;
      border-radius: 999px;
      background: #f5f5f5;
      box-shadow: 0 1px 8px rgba(0,0,0,0.26);
    }

    .menu-icon span:nth-child(1) { top: 0; }
    .menu-icon span:nth-child(2) { top: 6px; }
    .menu-icon span:nth-child(3) { top: 12px; }

    .person-icon {
      position: relative;
      width: 22px;
      height: 22px;
    }

    .person-icon::before,
    .person-icon::after {
      content: "";
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      border: 2.2px solid #f5f5f5;
      box-sizing: border-box;
    }

    .person-icon::before {
      top: 0;
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }

    .person-icon::after {
      bottom: -1px;
      width: 21px;
      height: 11px;
      border-top-left-radius: 16px;
      border-top-right-radius: 16px;
      border-bottom: 0;
    }

    .header-avatar-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      padding: 0;
      overflow: hidden;
      border: 2px solid rgba(212,175,55,0.55);
      background: #111;
      box-shadow:
        0 10px 22px rgba(0,0,0,0.24),
        0 0 0 3px rgba(212,175,55,0.08);
      cursor: pointer;
    }

    .header-avatar-btn img,
    .header-avatar-btn .header-avatar-fallback {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      display: block;
      object-fit: cover;
    }

    .header-avatar-fallback {
      display: flex !important;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #3a2d0d, #a98325);
      color: #fff;
      font-weight: 700;
      font-size: 15px;
      font-family: 'Space Grotesk', sans-serif;
    }

    .account-menu {
      position: absolute;
      top: 52px;
      right: 0;
      min-width: 170px;
      padding: 8px;
      border-radius: 18px;
      background:
        linear-gradient(180deg, rgba(20,20,20,0.96), rgba(10,10,10,0.98));
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow:
        0 18px 40px rgba(0,0,0,0.38),
        inset 0 1px 0 rgba(255,255,255,0.04);
      backdrop-filter: blur(8px);
    }

    .account-menu button {
      width: 100%;
    }

    .auth-panel-wrap {
      max-width: 720px;
      margin: 0 auto 0;
    }

    .auth-box {
      width: min(720px, 100%);
      text-align: left;
      margin: 0 auto;
      padding: 8px 0 0;
    }

    .auth-box h3 {
      margin: 0 0 10px;
      color: var(--gold);
      font-size: 15px;
      font-weight: 700;
      text-align: center;
      text-shadow: 0 1px 10px rgba(0,0,0,0.28);
      font-family: 'Space Grotesk', sans-serif;
    }

    .auth-inputs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 8px;
    }

    .auth-box input {
      width: 100%;
      padding: 12px 12px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.08);
      background: linear-gradient(180deg, rgba(16,16,16,0.92) 0%, rgba(12,12,12,0.96) 100%);
      color: white;
      font-size: 14px;
      outline: none;
      min-height: 46px;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.04),
        0 6px 16px rgba(0,0,0,0.18);
      backdrop-filter: blur(4px);
      font-family: 'Manrope', sans-serif;
    }

    .auth-box input:focus {
      border-color: rgba(212,175,55,0.38);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.04),
        0 0 0 3px rgba(212,175,55,0.08);
    }

    .auth-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .auth-message {
      min-height: 18px;
      margin-top: 8px;
      font-size: 12px;
      color: #cfcfcf;
      text-align: center;
      text-shadow: 0 1px 8px rgba(0,0,0,0.28);
      font-family: 'Manrope', sans-serif;
    }

    .metal-btn {
      border: 1px solid rgba(255,255,255,0.16);
      background:
        linear-gradient(180deg, #fbfbfb 0%, #d6d6d6 16%, #b6b6b6 35%, #8b8b8b 52%, #d2d2d2 72%, #f4f4f4 100%);
      color: #151515;
      padding: 13px 18px;
      border-radius: 999px;
      cursor: pointer;
      font-weight: 500;
      font-size: 14px;
      text-shadow: 0 1px 0 rgba(255,255,255,0.45);
      box-shadow:
        inset 0 2px 0 rgba(255,255,255,0.72),
        inset 0 -2px 3px rgba(0,0,0,0.18),
        0 10px 22px rgba(0,0,0,0.25);
      transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
      backdrop-filter: blur(2px);
      font-family: 'Manrope', sans-serif;
    }

    .metal-btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.02);
    }

    .metal-btn:disabled {
      opacity: 0.7;
      cursor: default;
      transform: none;
    }

    .metal-btn .icon {
      color: #6a560c;
      margin-right: 7px;
      font-size: 15px;
    }

    .page-section {
      max-width: 820px;
      margin: 10px auto 0;
    }

    .artist-hero {
      position: relative;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.015)),
        radial-gradient(circle at top, rgba(212,175,55,0.12), transparent 55%),
        linear-gradient(180deg, rgba(24,24,24,0.88) 0%, rgba(17,17,17,0.94) 100%);
      border: 1px solid var(--border-gold);
      border-radius: 30px;
      padding: 34px 28px 28px;
      box-shadow:
        var(--shadow),
        0 0 35px rgba(212,175,55,0.10),
        inset 0 1px 0 rgba(255,255,255,0.05);
      backdrop-filter: blur(6px);
      overflow: hidden;
    }

    .artist-kicker {
      font-family: 'Space Grotesk', sans-serif;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-size: var(--fs-label);
      color: var(--muted);
      opacity: 0.82;
      margin-bottom: 18px;
      text-align: center;
    }

    .artist-photo-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 18px;
    }

    .artist-photo,
    .artist-photo-fallback {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid rgba(212,175,55,0.72);
      box-shadow:
        0 18px 34px rgba(0,0,0,0.34),
        0 0 0 8px rgba(212,175,55,0.06);
      background: #111;
    }

    .artist-photo-fallback {
      display: none;
      align-items: center;
      justify-content: center;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 42px;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(180deg, #3a2d0d, #a98325);
    }

    .artist-name {
      font-size: var(--fs-artist-name);
      line-height: 1.05;
      text-align: center;
      margin-bottom: 12px;
      text-shadow: 0 2px 14px rgba(0,0,0,0.3);
    }

    .artist-bio {
      max-width: 620px;
      margin: 0 auto;
      text-align: center;
      color: #ddd;
      font-size: 15px;
      line-height: 1.7;
    }

    .artist-social {
      margin-top: 16px;
      text-align: center;
    }

    .artist-social a {
      color: var(--gold);
      text-decoration: none;
      border-bottom: 1px solid rgba(212,175,55,0.32);
      font-weight: 500;
    }

    .artist-social a:hover {
      opacity: 0.88;
    }

    .meta-pills {
      margin-top: 22px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }

    .meta-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.06);
      color: #f0f0f0;
      font-size: 13px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.03);
      backdrop-filter: blur(3px);
    }

    .meta-pill .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 8px rgba(212,175,55,0.5);
    }

    .tracks-section {
      margin-top: 18px;
      background: linear-gradient(180deg, rgba(22,22,22,0.86) 0%, rgba(16,16,16,0.92) 100%);
      border-radius: 26px;
      padding: 24px;
      border: 1px solid rgba(255,255,255,0.06);
      box-shadow:
        0 12px 30px rgba(0,0,0,0.22),
        inset 0 1px 0 rgba(255,255,255,0.03);
      backdrop-filter: blur(6px);
    }

    .section-label {
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 18px;
      font-family: 'Space Grotesk', sans-serif;
      opacity: 0.78;
      text-align: center;
    }

    .track-list {
      display: grid;
      gap: 14px;
    }

    .track-card {
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      padding: 18px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.015)),
        rgba(255,255,255,0.02);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.03),
        0 12px 24px rgba(0,0,0,0.16);
    }

    .track-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 12px;
    }

    .track-main {
      min-width: 0;
    }

    .track-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(20px, 2.2vw, 28px);
      color: #fff;
      margin-bottom: 6px;
      word-break: break-word;
    }

    .track-sub {
      color: var(--gold);
      font-size: 15px;
      font-weight: 500;
      word-break: break-word;
    }

    .track-badge {
      flex: 0 0 auto;
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 12px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      font-family: 'Space Grotesk', sans-serif;
      color: #231700;
      background:
        linear-gradient(180deg, #fff5c9 0%, #f4d77a 20%, #d4af37 52%, #b98816 75%, #7c5a11 100%);
      border: 1px solid rgba(255, 230, 150, 0.38);
      box-shadow:
        inset 0 2px 0 rgba(255,255,255,0.45),
        inset 0 -2px 4px rgba(90,50,0,0.28),
        0 12px 26px rgba(212,175,55,0.12);
      text-shadow: 0 1px 0 rgba(255,255,255,0.22);
    }

    .track-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }

    .track-meta-item {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.06);
      color: #ddd;
      font-size: 13px;
    }

    .track-meta-item .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 8px rgba(212,175,55,0.45);
    }

    .track-audio-wrap {
      padding: 10px 12px;
      border-radius: 16px;
      background: rgba(0,0,0,0.22);
      border: 1px solid rgba(255,255,255,0.05);
    }

    .preview-player {
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 18px;
      padding: 14px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.015)),
        rgba(0,0,0,0.18);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.03),
        0 10px 20px rgba(0,0,0,0.16);
    }

    .preview-topbar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .preview-play-btn {
      width: 48px;
      height: 48px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.16);
      background:
        linear-gradient(180deg, #fbfbfb 0%, #d6d6d6 16%, #b6b6b6 35%, #8b8b8b 52%, #d2d2d2 72%, #f4f4f4 100%);
      color: #151515;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow:
        inset 0 2px 0 rgba(255,255,255,0.72),
        inset 0 -2px 3px rgba(0,0,0,0.18),
        0 10px 22px rgba(0,0,0,0.25);
      transition: transform 0.14s ease, box-shadow 0.18s ease, filter 0.18s ease;
      flex: 0 0 auto;
      padding: 0;
    }

    .preview-play-btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.02);
      box-shadow:
        inset 0 2px 0 rgba(255,255,255,0.78),
        inset 0 -2px 3px rgba(0,0,0,0.18),
        0 12px 24px rgba(0,0,0,0.28),
        0 0 14px rgba(212,175,55,0.14);
    }

    .preview-play-btn:active {
      transform: scale(0.97);
    }

    .preview-play-btn svg {
      width: 18px;
      height: 18px;
      display: block;
    }

    .preview-play-btn .icon-pause {
      display: none;
    }

    .preview-play-btn.playing .icon-play {
      display: none;
    }

    .preview-play-btn.playing .icon-pause {
      display: block;
    }

    .preview-info {
      min-width: 0;
      flex: 1;
      text-align: left;
    }

    .preview-label {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1.8px;
      color: var(--muted);
      opacity: 0.85;
      margin-bottom: 4px;
    }

    .preview-time-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 8px;
    }

    .preview-progress {
      position: relative;
      height: 10px;
      border-radius: 999px;
      background: rgba(42,42,42,0.9);
      overflow: hidden;
      box-shadow: inset 0 1px 3px rgba(0,0,0,0.35);
      cursor: pointer;
    }

    .preview-progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--gold-dark), var(--gold), var(--gold-2));
      box-shadow: 0 0 12px rgba(212,175,55,0.25);
      transition: width 0.08s linear;
    }

    .preview-progress:hover .preview-progress-fill {
      filter: brightness(1.03);
    }

    .preview-hint {
      margin-top: 10px;
      font-size: 12px;
      color: #a9a9a9;
      text-align: left;
    }

    .preview-audio-hidden {
      display: none;
    }

    .empty-state,
    .page-error {
      max-width: 820px;
      margin: 18px auto 0;
      background: linear-gradient(180deg, rgba(22,22,22,0.86) 0%, rgba(16,16,16,0.92) 100%);
      border-radius: 24px;
      padding: 26px;
      border: 1px solid rgba(255,255,255,0.06);
      box-shadow:
        0 12px 30px rgba(0,0,0,0.22),
        inset 0 1px 0 rgba(255,255,255,0.03);
      text-align: center;
    }

    .empty-state-title,
    .page-error-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 24px;
      margin-bottom: 8px;
    }

    .empty-state-text,
    .page-error-text {
      color: #cfcfcf;
      line-height: 1.6;
      font-size: 15px;
    }

    @media (max-width: 760px) {
      body {
        padding: 0 14px 40px;
        background:
          linear-gradient(180deg, rgba(7, 7, 7, 0.50) 0%, rgba(7, 7, 7, 0.76) 42%, rgba(7, 7, 7, 0.86) 100%),
          radial-gradient(circle at top, rgba(212, 175, 55, 0.12), transparent 26%),
          url("bg-desktop-correct.webp");
        background-size: cover, auto, cover;
        background-position: center top, center top, center center;
        background-repeat: no-repeat, no-repeat, no-repeat;
        background-attachment: scroll, scroll, scroll;
      }

      .header-bar {
        grid-template-columns: 42px 1fr 42px;
        min-height: 68px;
        padding: 6px 2px 2px;
      }

      .header-logo {
        width: min(200px, 40vw);
      }

      .header-icon-btn,
      .header-avatar-btn {
        width: 38px;
        height: 38px;
      }

      .account-menu {
        top: 48px;
        min-width: 150px;
      }

      .auth-box {
        width: min(420px, 100%);
      }

      .auth-inputs {
        grid-template-columns: 1fr;
      }

      .auth-row {
        flex-direction: column;
      }

      .auth-row .metal-btn {
        width: 100%;
      }

      .artist-hero,
      .tracks-section {
        padding: 20px;
      }

      .artist-photo,
      .artist-photo-fallback {
        width: 112px;
        height: 112px;
      }

      .track-top {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
      }

      .preview-topbar {
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>
  <div class="site-shell">
    <header class="header-bar">
      <div class="header-left">
        <button id="menuBtn" class="header-icon-btn" type="button" aria-label="Open menu">
          <span class="menu-icon" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
          </span>
        </button>
      </div>

      <div class="header-center">
        <a href="/" class="header-logo-link" aria-label="60 Seconds FM home">
          <img src="logo.png" alt="60 Seconds FM" class="header-logo" />
        </a>
      </div>

      <div class="header-right">
        <button id="showLoginBtn" class="header-icon-btn" type="button" aria-label="Log in">
          <span class="person-icon" aria-hidden="true"></span>
        </button>

        <button id="headerAvatarBtn" class="header-avatar-btn hidden" type="button" aria-label="Open account menu">
          <img id="headerAvatarImage" class="hidden" src="" alt="Profile photo" />
          <div id="headerAvatarFallback" class="header-avatar-fallback hidden">A</div>
        </button>

        <div id="accountMenu" class="account-menu hidden">
          <button id="logout" class="metal-btn" type="button"><span class="icon">⎋</span>Log out</button>
        </div>
      </div>
    </header>

    <div class="auth-panel-wrap">
      <div id="authBox" class="auth-box hidden">
        <h3>Log in</h3>

        <div class="auth-inputs">
          <input id="email" type="email" placeholder="Email" autocomplete="email" />
          <input id="password" type="password" placeholder="Password" autocomplete="current-password" />
        </div>

        <div class="auth-row">
          <button id="signup" class="metal-btn" type="button"><span class="icon">✦</span>Sign up</button>
          <button id="login" class="metal-btn" type="button"><span class="icon">↳</span>Log in</button>
        </div>
      </div>

      <div id="userBox" class="hidden">
        <a id="profileLink" href="#" title="Open artist page" class="hidden"></a>
      </div>

      <div id="authMessage" class="auth-message"></div>
    </div>

    <main id="artistPage" class="page-section hidden">
      <section class="artist-hero">
        <div class="artist-kicker">Artist Profile</div>

        <div class="artist-photo-wrap">
          <img id="artistPhoto" class="artist-photo hidden" src="" alt="Artist photo" />
          <div id="artistPhotoFallback" class="artist-photo-fallback">A</div>
        </div>

        <h1 id="artistName" class="artist-name">Artist Name</h1>
        <div id="artistBio" class="artist-bio"></div>
        <div id="artistSocial" class="artist-social"></div>

        <div class="meta-pills">
          <div class="meta-pill">
            <span class="dot"></span>
            <span id="approvedCount">0 Approved Tracks</span>
          </div>
        </div>
      </section>

      <section class="tracks-section">
        <div class="section-label">Approved Tracks</div>
        <div id="trackList" class="track-list"></div>
      </section>
    </main>

    <div id="emptyState" class="empty-state hidden">
      <div class="empty-state-title">No approved tracks yet</div>
      <div class="empty-state-text">This artist page is live, but there are no approved tracks available right now.</div>
    </div>

    <div id="pageError" class="page-error hidden">
      <div class="page-error-title">Artist not found</div>
      <div id="pageErrorText" class="page-error-text">We couldn't load this artist page.</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const supabaseClient = window.supabase.createClient(
      "https://rgoutegbcpjytplqcwze.supabase.co",
      "sb_publishable_255qyDKS77nMU0pbedfa_A_3hdgtEHh"
    );

    const showLoginBtn = document.getElementById("showLoginBtn");
    const headerAvatarBtn = document.getElementById("headerAvatarBtn");
    const headerAvatarImage = document.getElementById("headerAvatarImage");
    const headerAvatarFallback = document.getElementById("headerAvatarFallback");
    const accountMenu = document.getElementById("accountMenu");
    const menuBtn = document.getElementById("menuBtn");
    const email = document.getElementById("email");
    const password = document.getElementById("password");
    const signupBtn = document.getElementById("signup");
    const loginBtn = document.getElementById("login");
    const logoutBtn = document.getElementById("logout");
    const authBox = document.getElementById("authBox");
    const userBox = document.getElementById("userBox");
    const authMessageEl = document.getElementById("authMessage");
    const profileLink = document.getElementById("profileLink");

    const artistPageEl = document.getElementById("artistPage");
    const emptyStateEl = document.getElementById("emptyState");
    const pageErrorEl = document.getElementById("pageError");
    const pageErrorTextEl = document.getElementById("pageErrorText");

    const artistPhotoEl = document.getElementById("artistPhoto");
    const artistPhotoFallbackEl = document.getElementById("artistPhotoFallback");
    const artistNameEl = document.getElementById("artistName");
    const artistBioEl = document.getElementById("artistBio");
    const artistSocialEl = document.getElementById("artistSocial");
    const approvedCountEl = document.getElementById("approvedCount");
    const trackListEl = document.getElementById("trackList");

    const PREVIEW_LENGTH_SECONDS = 60;

    function escapeHtml(str) {
      return String(str || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function sanitizeUrl(url) {
      const value = String(url || "").trim();
      if (!value) return "";
      if (/^https?:\/\//i.test(value)) return value;
      return "";
    }

    function setAuthMessage(msg, error = false) {
      if (msg === "Auth session missing!") msg = "";
      authMessageEl.textContent = msg || "";
      authMessageEl.style.color = error ? "#ff8a8a" : "#cfcfcf";
    }

    function clearLoginFields() {
      email.value = "";
      password.value = "";
    }

    function closeMenus() {
      authBox.classList.add("hidden");
      accountMenu.classList.add("hidden");
    }

    function setLoggedOutView() {
      closeMenus();
      userBox.classList.add("hidden");
      showLoginBtn.classList.remove("hidden");
      headerAvatarBtn.classList.add("hidden");
      headerAvatarImage.classList.add("hidden");
      headerAvatarFallback.classList.add("hidden");
      headerAvatarImage.src = "";
    }

    function setLoggedInView() {
      authBox.classList.add("hidden");
      userBox.classList.remove("hidden");
      showLoginBtn.classList.add("hidden");
      headerAvatarBtn.classList.remove("hidden");
    }

    function setHeaderAvatar(photoUrl, artistName) {
      if (photoUrl) {
        headerAvatarImage.src = photoUrl;
        headerAvatarImage.classList.remove("hidden");
        headerAvatarFallback.classList.add("hidden");
      } else {
        headerAvatarImage.classList.add("hidden");
        headerAvatarFallback.classList.remove("hidden");
        headerAvatarFallback.textContent = (artistName || "A").charAt(0).toUpperCase();
      }
    }

    async function loadMyProfile(userId) {
      const { data, error } = await supabaseClient
        .from("profiles")
        .select("artist_name, photo_url, user_id")
        .eq("user_id", userId)
        .maybeSingle();

      if (error || !data) {
        profileLink.href = "#";
        setHeaderAvatar("", "•");
        return;
      }

      setHeaderAvatar(data.photo_url, data.artist_name);
      profileLink.href = `artist.html?user_id=${encodeURIComponent(data.user_id)}`;
    }

    async function refreshAuthUI() {
      try {
        const { data, error } = await supabaseClient.auth.getSession();

        if (error) {
          setLoggedOutView();
          return null;
        }

        const user = data?.session?.user || null;

        if (user) {
          setLoggedInView();
          await loadMyProfile(user.id);
          return user;
        } else {
          setLoggedOutView();
          return null;
        }
      } catch (err) {
        console.error("refreshAuthUI error:", err);
        setLoggedOutView();
        return null;
      }
    }

    async function handleLogin() {
      const emailValue = email.value.trim();
      const passwordValue = password.value.trim();

      if (!emailValue || !passwordValue) {
        setAuthMessage("Please enter email and password.", true);
        return;
      }

      loginBtn.disabled = true;
      signupBtn.disabled = true;
      setAuthMessage("");

      try {
        const { error } = await supabaseClient.auth.signInWithPassword({
          email: emailValue,
          password: passwordValue
        });

        if (error) {
          setAuthMessage(error.message, true);
          return;
        }

        clearLoginFields();
        await refreshAuthUI();
      } catch (err) {
        console.error("handleLogin error:", err);
        setAuthMessage("Login failed. Try again.", true);
      } finally {
        loginBtn.disabled = false;
        signupBtn.disabled = false;
      }
    }

    async function handleSignup() {
      const emailValue = email.value.trim();
      const passwordValue = password.value.trim();

      if (!emailValue || !passwordValue) {
        setAuthMessage("Please enter email and password.", true);
        return;
      }

      loginBtn.disabled = true;
      signupBtn.disabled = true;
      setAuthMessage("");

      try {
        const { error } = await supabaseClient.auth.signUp({
          email: emailValue,
          password: passwordValue
        });

        if (error) {
          setAuthMessage(error.message, true);
          return;
        }

        setAuthMessage("Account created. Check your email.");
        await refreshAuthUI();
      } catch (err) {
        console.error("handleSignup error:", err);
        setAuthMessage("Sign up failed. Try again.", true);
      } finally {
        loginBtn.disabled = false;
        signupBtn.disabled = false;
      }
    }

    async function handleLogout() {
      logoutBtn.disabled = true;
      setAuthMessage("");

      try {
        const { error } = await supabaseClient.auth.signOut();

        if (error) {
          setAuthMessage(error.message, true);
          return;
        }

        clearLoginFields();
        await refreshAuthUI();
      } catch (err) {
        console.error("handleLogout error:", err);
        setAuthMessage("Logout failed. Try again.", true);
      } finally {
        logoutBtn.disabled = false;
      }
    }

    function getUserIdFromUrl() {
      const params = new URLSearchParams(window.location.search);
      return params.get("user_id");
    }

    function showPageError(message) {
      artistPageEl.classList.add("hidden");
      emptyStateEl.classList.add("hidden");
      pageErrorEl.classList.remove("hidden");
      pageErrorTextEl.textContent = message || "We couldn't load this artist page.";
    }

    function showArtistPage() {
      artistPageEl.classList.remove("hidden");
      pageErrorEl.classList.add("hidden");
    }

    function showEmptyState(show) {
      emptyStateEl.classList.toggle("hidden", !show);
    }

    function renderArtistProfile(profile) {
      const artistName = profile?.artist_name || "Unknown Artist";
      const artistBio = profile?.bio || "No bio yet.";
      const socialLink = sanitizeUrl(profile?.social_link || "");
      const photoUrl = profile?.photo_url || "";

      artistNameEl.textContent = artistName;
      artistBioEl.textContent = artistBio;

      if (photoUrl) {
        artistPhotoEl.src = photoUrl;
        artistPhotoEl.classList.remove("hidden");
        artistPhotoFallbackEl.style.display = "none";
      } else {
        artistPhotoEl.classList.add("hidden");
        artistPhotoFallbackEl.style.display = "flex";
        artistPhotoFallbackEl.textContent = artistName.charAt(0).toUpperCase();
      }

      if (socialLink) {
        artistSocialEl.innerHTML = `<a href="${socialLink}" target="_blank" rel="noopener noreferrer">Visit social / streaming link</a>`;
      } else {
        artistSocialEl.innerHTML = "";
      }
    }

    function formatDate(dateString) {
      if (!dateString) return "Recently added";
      const date = new Date(dateString);
      if (Number.isNaN(date.getTime())) return "Recently added";

      return date.toLocaleDateString("en-GB", {
        day: "2-digit",
        month: "short",
        year: "numeric"
      });
    }

    function formatTime(seconds) {
      const safeSeconds = Math.max(0, Math.floor(seconds || 0));
      const mins = Math.floor(safeSeconds / 60);
      const secs = String(safeSeconds % 60).padStart(2, "0");
      return `${mins}:${secs}`;
    }

    function stopAllPreviewPlayers(exceptAudio = null) {
      document.querySelectorAll("audio[data-preview-audio='true']").forEach(audioEl => {
        if (audioEl !== exceptAudio) {
          audioEl.pause();
        }
      });
    }

    function updatePlayerVisualState(audioEl, forcePaused = false) {
      const playerEl = audioEl.closest("[data-preview-player]");
      if (!playerEl) return;

      const playBtn = playerEl.querySelector("[data-preview-play-btn]");
      const fillEl = playerEl.querySelector("[data-preview-fill]");
      const elapsedEl = playerEl.querySelector("[data-preview-elapsed]");

      const current = Math.min(Number(audioEl.currentTime) || 0, PREVIEW_LENGTH_SECONDS);
      const progress = Math.max(0, Math.min((current / PREVIEW_LENGTH_SECONDS) * 100, 100));

      fillEl.style.width = `${progress}%`;
      elapsedEl.textContent = formatTime(current);

      if (forcePaused || audioEl.paused) {
        playBtn.classList.remove("playing");
        playBtn.setAttribute("aria-label", "Play preview");
      } else {
        playBtn.classList.add("playing");
        playBtn.setAttribute("aria-label", "Pause preview");
      }
    }

    function attachPreviewPlayer(cardEl) {
      const audioEl = cardEl.querySelector("[data-preview-audio='true']");
      const playBtn = cardEl.querySelector("[data-preview-play-btn]");
      const progressEl = cardEl.querySelector("[data-preview-progress]");

      audioEl.addEventListener("play", () => {
        stopAllPreviewPlayers(audioEl);
        updatePlayerVisualState(audioEl);
      });

      audioEl.addEventListener("pause", () => {
        updatePlayerVisualState(audioEl, true);
      });

      audioEl.addEventListener("ended", () => {
        audioEl.currentTime = 0;
        updatePlayerVisualState(audioEl, true);
      });

      audioEl.addEventListener("timeupdate", () => {
        if ((Number(audioEl.currentTime) || 0) >= PREVIEW_LENGTH_SECONDS) {
          audioEl.pause();
          audioEl.currentTime = 0;
          updatePlayerVisualState(audioEl, true);
          return;
        }

        updatePlayerVisualState(audioEl);
      });

      audioEl.addEventListener("loadedmetadata", () => {
        audioEl.currentTime = 0;
        updatePlayerVisualState(audioEl, true);
      });

      playBtn.addEventListener("click", async () => {
        try {
          if (audioEl.paused) {
            stopAllPreviewPlayers(audioEl);

            if ((Number(audioEl.currentTime) || 0) >= PREVIEW_LENGTH_SECONDS) {
              audioEl.currentTime = 0;
            }

            await audioEl.play();
            updatePlayerVisualState(audioEl);
          } else {
            audioEl.pause();
            updatePlayerVisualState(audioEl, true);
          }
        } catch (err) {
          console.error("preview play error:", err);
        }
      });

      progressEl.addEventListener("click", (e) => {
        const rect = progressEl.getBoundingClientRect();
        const clickX = e.clientX - rect.left;
        const ratio = rect.width > 0 ? clickX / rect.width : 0;
        const nextTime = Math.max(0, Math.min(PREVIEW_LENGTH_SECONDS * ratio, PREVIEW_LENGTH_SECONDS));
        audioEl.currentTime = nextTime;
        updatePlayerVisualState(audioEl);
      });

      updatePlayerVisualState(audioEl, true);
    }

    function renderTracks(tracks) {
      trackListEl.innerHTML = "";
      approvedCountEl.textContent = `${tracks.length.toLocaleString()} Approved Track${tracks.length === 1 ? "" : "s"}`;

      if (!tracks.length) {
        showEmptyState(true);
        return;
      }

      showEmptyState(false);

      tracks.forEach(track => {
        const card = document.createElement("div");
        card.className = "track-card";

        card.innerHTML = `
          <div class="track-top">
            <div class="track-main">
              <div class="track-title">${escapeHtml(track.title || "Untitled")}</div>
              <div class="track-sub">${escapeHtml(track.artist || "Unknown Artist")}</div>
            </div>
            <div class="track-badge">Approved</div>
          </div>

          <div class="track-meta">
            <div class="track-meta-item">
              <span class="dot"></span>
              <span>60 second preview</span>
            </div>
            <div class="track-meta-item">
              <span class="dot"></span>
              <span>${escapeHtml(formatDate(track.created_at))}</span>
            </div>
          </div>

          <div class="track-audio-wrap">
            <div class="preview-player" data-preview-player>
              <div class="preview-topbar">
                <button class="preview-play-btn" type="button" data-preview-play-btn aria-label="Play preview">
                  <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true">
                    <path fill="#1a1a1a" d="M8 5.5v13l10-6.5z"></path>
                  </svg>
                  <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true">
                    <rect x="7" y="5.5" width="3.5" height="13" rx="1" fill="#1a1a1a"></rect>
                    <rect x="13.5" y="5.5" width="3.5" height="13" rx="1" fill="#1a1a1a"></rect>
                  </svg>
                </button>

                <div class="preview-info">
                  <div class="preview-label">Track Preview</div>
                </div>
              </div>

              <div class="preview-time-row">
                <span data-preview-elapsed>0:00</span>
                <span>1:00</span>
              </div>

              <div class="preview-progress" data-preview-progress>
                <div class="preview-progress-fill" data-preview-fill></div>
              </div>

              <div class="preview-hint">Preview only — full track length is hidden on this page.</div>

              <audio
                class="preview-audio-hidden"
                preload="metadata"
                src="${track.file_url}"
                data-preview-audio="true"
                controlslist="nodownload noplaybackrate noremoteplayback"
                disablepictureinpicture
              ></audio>
            </div>
          </div>
        `;

        trackListEl.appendChild(card);
        attachPreviewPlayer(card);
      });
    }

    async function loadArtistProfile(userId) {
      const { data, error } = await supabaseClient
        .from("profiles")
        .select("artist_name, bio, social_link, photo_url, user_id")
        .eq("user_id", userId)
        .maybeSingle();

      if (error) {
        throw new Error(error.message || "Failed to load artist profile.");
      }

      if (!data) {
        throw new Error("Artist profile not found.");
      }

      return data;
    }

    async function loadApprovedArtistTracks(userId) {
      const { data, error } = await supabaseClient
        .from("tracks")
        .select("id, title, artist, file_url, status, created_at, user_id")
        .eq("user_id", userId)
        .eq("status", "approved")
        .order("created_at", { ascending: false });

      if (error) {
        throw new Error(error.message || "Failed to load artist tracks.");
      }

      return (data || []).filter(track => !!track.file_url);
    }

    showLoginBtn.onclick = () => {
      accountMenu.classList.add("hidden");
      authBox.classList.toggle("hidden");
      setAuthMessage("");
      if (!authBox.classList.contains("hidden")) {
        setTimeout(() => email.focus(), 0);
      }
    };

    headerAvatarBtn.onclick = () => {
      authBox.classList.add("hidden");
      accountMenu.classList.toggle("hidden");
    };

    menuBtn.onclick = () => {
      setAuthMessage("");
      authBox.classList.add("hidden");
      accountMenu.classList.add("hidden");
    };

    document.addEventListener("click", (e) => {
      const insideHeaderRight = e.target.closest(".header-right");
      const insideAuthBox = e.target.closest("#authBox");
      const isLoginButton = e.target.closest("#showLoginBtn");
      const isAvatarButton = e.target.closest("#headerAvatarBtn");

      if (!insideHeaderRight && !insideAuthBox && !isLoginButton && !isAvatarButton) {
        authBox.classList.add("hidden");
        accountMenu.classList.add("hidden");
      }
    });

    loginBtn.onclick = handleLogin;
    signupBtn.onclick = handleSignup;
    logoutBtn.onclick = handleLogout;

    email.addEventListener("keydown", (e) => {
      if (e.key === "Enter") handleLogin();
    });

    password.addEventListener("keydown", (e) => {
      if (e.key === "Enter") handleLogin();
    });

    supabaseClient.auth.onAuthStateChange(() => {
      refreshAuthUI().catch(err => console.error(err));
    });

    async function init() {
      try {
        setLoggedOutView();
        await refreshAuthUI();

        const userId = getUserIdFromUrl();
        if (!userId) {
          showPageError("Missing artist reference in the URL.");
          return;
        }

        const profile = await loadArtistProfile(userId);
        const tracks = await loadApprovedArtistTracks(userId);

        renderArtistProfile(profile);
        renderTracks(tracks);
        showArtistPage();
      } catch (err) {
        console.error("artist page init error:", err);
        showPageError(err.message || "We couldn't load this artist page.");
      }
    }

    init();
  </script>
</body>
</html>
