<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Artist Page - 60 Seconds FM</title>

  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --gold: #d4af37;
      --gold-2: #f4d77a;
      --gold-3: #ffd76a;
      --gold-dark: #8f6b13;
      --text: #f5f5f5;
      --muted: #a8a8a8;
      --danger: #ff8a8a;

      --desktop-rail-width: 86px;
      --desktop-rail-expanded: 320px;
      --mobile-bottom-nav-height: 86px;
      --mobile-nav-bg: rgba(10, 10, 10, 0.94);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(180deg, rgba(7, 7, 7, 0.50) 0%, rgba(7, 7, 7, 0.74) 42%, rgba(7, 7, 7, 0.86) 100%),
        radial-gradient(circle at top, rgba(212, 175, 55, 0.14), transparent 30%),
        url("bg-mobile-final-1080x1920.webp");
      background-size: cover, auto, cover;
      background-position: center top, center top, center center;
      background-repeat: no-repeat, no-repeat, no-repeat;
      background-attachment: fixed, scroll, fixed;
      color: var(--text);
      font-family: 'Manrope', sans-serif;
      padding: 0 18px 44px calc(var(--desktop-rail-width) + 28px);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    h1, h2, h3 {
      font-family: 'Space Grotesk', sans-serif;
      margin: 0;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    img {
      max-width: 100%;
      display: block;
    }

    .hidden {
      display: none !important;
    }

    .site-shell {
      max-width: 1180px;
      margin: 0 auto;
      padding-top: 8px;
    }

    .header-wrap {
      position: sticky;
      top: 0;
      z-index: 80;
      width: 100%;
      background: linear-gradient(180deg, rgba(0,0,0,0.78), rgba(0,0,0,0.42) 70%, rgba(0,0,0,0));
      backdrop-filter: blur(8px);
    }

    .header-bar {
      width: 100%;
      min-height: 74px;
      display: grid;
      grid-template-columns: 60px 1fr 60px;
      align-items: center;
      gap: 10px;
      padding: 8px 16px 4px;
      position: relative;
    }

    .header-left,
    .header-center,
    .header-right {
      display: flex;
      align-items: center;
      min-width: 0;
    }

    .header-left {
      justify-content: flex-start;
    }

    .header-center {
      justify-content: center;
      pointer-events: none;
    }

    .header-center > * {
      pointer-events: auto;
    }

    .header-right {
      justify-content: flex-end;
      position: relative;
    }

    .header-logo-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
    }

    .header-logo {
      display: block;
      width: min(288px, 45vw);
      height: auto;
      filter:
        drop-shadow(0 8px 18px rgba(0, 0, 0, 0.35))
        drop-shadow(0 0 20px rgba(212, 175, 55, 0.08));
    }

    .header-icon-btn {
      width: 42px;
      height: 42px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.14);
      background:
        linear-gradient(180deg, rgba(255,255,255,0.12), rgba(255,255,255,0.04)),
        linear-gradient(180deg, rgba(10,10,10,0.86), rgba(10,10,10,0.92));
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.08),
        0 10px 22px rgba(0,0,0,0.24);
      backdrop-filter: blur(4px);
      transition: transform 0.14s ease, box-shadow 0.14s ease, filter 0.14s ease;
      padding: 0;
      text-decoration: none;
    }

    .header-icon-btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.03);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.10),
        0 14px 24px rgba(0,0,0,0.28);
    }

    .person-icon {
      position: relative;
      width: 22px;
      height: 22px;
    }

    .person-icon::before,
    .person-icon::after {
      content: "";
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      border: 2.2px solid #f5f5f5;
      box-sizing: border-box;
    }

    .person-icon::before {
      top: 0;
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }

    .person-icon::after {
      bottom: -1px;
      width: 21px;
      height: 11px;
      border-top-left-radius: 16px;
      border-top-right-radius: 16px;
      border-bottom: 0;
    }

    .header-avatar-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      padding: 0;
      overflow: hidden;
      border: 2px solid rgba(212,175,55,0.55);
      background: #111;
      box-shadow:
        0 10px 22px rgba(0,0,0,0.24),
        0 0 0 3px rgba(212,175,55,0.08);
      cursor: pointer;
    }

    .header-avatar-btn img,
    .header-avatar-btn .header-avatar-fallback {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      display: block;
      object-fit: cover;
    }

    .header-avatar-fallback {
      display: flex !important;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #3a2d0d, #a98325);
      color: #fff;
      font-weight: 700;
      font-size: 15px;
      font-family: 'Space Grotesk', sans-serif;
    }

    .account-menu {
      position: absolute;
      top: 52px;
      right: 0;
      min-width: 210px;
      padding: 10px;
      border-radius: 18px;
      background:
        linear-gradient(180deg, rgba(20,20,20,0.96), rgba(10,10,10,0.98));
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow:
        0 18px 40px rgba(0,0,0,0.38),
        inset 0 1px 0 rgba(255,255,255,0.04);
      backdrop-filter: blur(8px);
      z-index: 90;
    }

    .account-menu-actions {
      display: grid;
      gap: 8px;
    }

    .account-menu-link,
    .account-menu button {
      width: 100%;
      text-decoration: none;
      text-align: center;
    }

    .desktop-side-nav {
      position: fixed;
      top: 50%;
      left: 18px;
      transform: translateY(-50%);
      width: var(--desktop-rail-width);
      height: min(84vh, 780px);
      z-index: 120;
      display: flex;
      align-items: stretch;
      overflow: visible;
      transition: width 0.34s cubic-bezier(.22,.61,.36,1);
    }

    .desktop-side-nav:hover {
      width: var(--desktop-rail-expanded);
    }

    .desktop-side-nav-panel {
      width: 100%;
      height: 100%;
      transition: width 0.34s cubic-bezier(.22,.61,.36,1);
      display: flex;
      flex-direction: column;
      padding: 18px 0 16px;
      overflow: visible;
      background: transparent;
      border: none;
      box-shadow: none;
      backdrop-filter: none;
    }

    .desktop-side-links,
    .desktop-side-bottom {
      position: relative;
      display: grid;
      gap: 14px;
      align-content: start;
      justify-items: stretch;
    }

    .desktop-side-links {
      flex: 1;
      padding-top: 2px;
    }

    .desktop-side-bottom {
      margin-top: auto;
      padding-top: 24px;
    }

    .desktop-nav-link,
    .desktop-nav-button {
      width: 100%;
      min-height: 60px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 18px;
      padding: 0 18px;
      color: rgba(245,245,245,0.96);
      text-decoration: none;
      background: transparent;
      border: 0;
      cursor: pointer;
      overflow: hidden;
      white-space: nowrap;
      font-family: 'Manrope', sans-serif;
      transition: transform 0.18s ease, opacity 0.18s ease, color 0.18s ease, background 0.18s ease;
      text-align: left;
      position: relative;
      border-radius: 18px;
    }

    .desktop-side-nav:hover .desktop-nav-link,
    .desktop-side-nav:hover .desktop-nav-button {
      width: 100%;
    }

    .desktop-nav-link:hover,
    .desktop-nav-button:hover {
      transform: translateX(2px);
      background:
        linear-gradient(90deg, rgba(212,175,55,0.16), rgba(212,175,55,0.05) 58%, transparent);
    }

    .desktop-nav-link.active,
    .desktop-nav-button.active {
      color: #fff5d2;
      background:
        linear-gradient(90deg, rgba(212,175,55,0.18), rgba(212,175,55,0.06) 58%, transparent);
    }

    .desktop-nav-link.active::after,
    .desktop-nav-button.active::after {
      content: "";
      position: absolute;
      left: 0;
      top: 9px;
      bottom: 9px;
      width: 3px;
      border-radius: 999px;
      background: linear-gradient(180deg, #ffe08d, #d4af37 52%, #8f6b13);
      box-shadow: 0 0 14px rgba(212,175,55,0.30);
    }

    .desktop-nav-icon,
    .mobile-nav-icon {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
    }

    .desktop-nav-icon {
      width: 30px;
      height: 30px;
    }

    .mobile-nav-icon {
      width: 24px;
      height: 24px;
    }

    .nav-icon-mask {
      width: 100%;
      height: 100%;
      display: block;
      background:
        linear-gradient(180deg, #fff3b6 0%, #f4d77a 20%, #d4af37 52%, #b98714 76%, #7d5a10 100%);
      -webkit-mask-image: var(--icon-url);
      mask-image: var(--icon-url);
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
      -webkit-mask-position: center;
      mask-position: center;
      -webkit-mask-size: contain;
      mask-size: contain;
      filter: drop-shadow(0 2px 10px rgba(212,175,55,0.18));
      opacity: 0.98;
      transition: transform 0.18s ease, filter 0.18s ease, opacity 0.18s ease, background 0.18s ease;
      pointer-events: none;
      user-select: none;
    }

    .desktop-nav-link:hover .nav-icon-mask,
    .desktop-nav-button:hover .nav-icon-mask,
    .mobile-nav-link:hover .nav-icon-mask {
      transform: scale(1.04);
      opacity: 1;
      background:
        linear-gradient(180deg, #fff7cf 0%, #ffe08d 18%, #f4d77a 36%, #d4af37 58%, #b98714 80%, #7d5a10 100%);
      filter: drop-shadow(0 2px 11px rgba(212,175,55,0.22));
    }

    .desktop-nav-link.active .nav-icon-mask,
    .desktop-nav-button.active .nav-icon-mask,
    .mobile-nav-link.active .nav-icon-mask {
      background:
        linear-gradient(180deg, #fff9da 0%, #ffe9a7 18%, #f7dd82 36%, #d4af37 58%, #ba8a18 80%, #7d5a10 100%);
      filter:
        drop-shadow(0 2px 12px rgba(212,175,55,0.24))
        drop-shadow(0 0 15px rgba(212,175,55,0.20));
    }

    .desktop-nav-label {
      font-size: 16px;
      font-weight: 500;
      letter-spacing: 0.1px;
      font-family: 'Manrope', sans-serif;
      opacity: 0;
      transform: translateX(-10px);
      transition:
        opacity 0.26s ease,
        transform 0.34s cubic-bezier(.22,.61,.36,1);
      pointer-events: none;
      min-width: 170px;
      max-width: 200px;
      overflow: visible;
      text-overflow: clip;
      text-align: left;
    }

    .desktop-side-nav:hover .desktop-nav-label {
      opacity: 1;
      transform: translateX(0);
    }

    .mobile-bottom-nav-wrap {
      display: none;
    }

    .gold-btn,
    .metal-btn,
    .ghost-btn {
      min-height: 52px;
      border-radius: 999px;
      padding: 0 24px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.14s ease, filter 0.14s ease;
      font-family: 'Manrope', sans-serif;
    }

    .gold-btn:hover,
    .metal-btn:hover,
    .ghost-btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.03);
    }

    .gold-btn {
      color: #231700;
      font-weight: 700;
      font-size: 15px;
      background:
        linear-gradient(180deg, #fff5c9 0%, #f4d77a 20%, #d4af37 52%, #b98816 75%, #7c5a11 100%);
      border: 1px solid rgba(255, 230, 150, 0.38);
      box-shadow:
        inset 0 2px 0 rgba(255,255,255,0.45),
        inset 0 -2px 4px rgba(90,50,0,0.28),
        0 12px 26px rgba(212,175,55,0.22),
        0 0 0 1px rgba(212,175,55,0.08);
    }

    .metal-btn {
      border: 1px solid rgba(255,255,255,0.16);
      background:
        linear-gradient(180deg, #fbfbfb 0%, #d6d6d6 16%, #b6b6b6 35%, #8b8b8b 52%, #d2d2d2 72%, #f4f4f4 100%);
      color: #151515;
      font-weight: 600;
      font-size: 14px;
      text-shadow: 0 1px 0 rgba(255,255,255,0.45);
      box-shadow:
        inset 0 2px 0 rgba(255,255,255,0.72),
        inset 0 -2px 3px rgba(0,0,0,0.18),
        0 10px 22px rgba(0,0,0,0.25);
    }

    .ghost-btn {
      border: 1px solid rgba(255,255,255,0.08);
      background:
        linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.015)),
        rgba(255,255,255,0.02);
      color: #f4f4f4;
      font-weight: 600;
      font-size: 14px;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.04),
        0 10px 24px rgba(0,0,0,0.2);
    }

    .page-wrap {
      max-width: 1120px;
      margin: 18px auto 0;
    }

    .artist-stage {
      display: grid;
      grid-template-columns: 300px minmax(0, 1fr);
      gap: 38px;
      align-items: start;
    }

    .portrait-column {
      position: relative;
      min-height: 320px;
      display: flex;
      align-items: flex-start;
      justify-content: center;
    }

    .portrait-column::before {
      content: "";
      position: absolute;
      width: 260px;
      height: 260px;
      top: 26px;
      border-radius: 34px;
      background:
        radial-gradient(circle at center, rgba(212,175,55,0.18) 0%, rgba(212,175,55,0.10) 34%, rgba(212,175,55,0.03) 66%, transparent 78%);
      filter: blur(24px);
      pointer-events: none;
      z-index: 0;
    }

    .portrait-stage {
      width: 100%;
      max-width: 260px;
      aspect-ratio: 1 / 1;
      position: relative;
      z-index: 1;
    }

    .artist-photo {
      width: 100%;
      height: 100%;
      border-radius: 30px;
      object-fit: cover;
      background: #0d0d0d;
      box-shadow:
        0 34px 70px rgba(0,0,0,0.46),
        0 0 36px rgba(212,175,55,0.10);
    }

    .artist-photo-fallback {
      width: 100%;
      height: 100%;
      border-radius: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 30% 20%, rgba(255,255,255,0.14), transparent 30%),
        linear-gradient(180deg, #2a210d 0%, #a98325 100%);
      color: #fff;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 78px;
      font-weight: 700;
      box-shadow:
        0 34px 70px rgba(0,0,0,0.46),
        0 0 36px rgba(212,175,55,0.10);
    }

    .info-column {
      position: relative;
      padding-top: 10px;
    }

    .section-kicker {
      font-family: 'Space Grotesk', sans-serif;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-size: 12px;
      color: var(--muted);
      opacity: 0.82;
      margin-bottom: 12px;
    }

    .artist-name {
      font-size: clamp(38px, 5vw, 62px);
      line-height: 0.95;
      margin-bottom: 16px;
      text-shadow: 0 2px 18px rgba(0,0,0,0.34);
      word-break: break-word;
    }

    .artist-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 18px;
    }

    .meta-pill {
      display: inline-flex;
      align-items: center;
      min-height: 38px;
      padding: 0 14px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.08);
      background:
        linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.02)),
        rgba(255,255,255,0.02);
      color: #e7e7e7;
      font-size: 13px;
      letter-spacing: 0.2px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.03);
    }

    .meta-pill.member-since-pill,
    .meta-pill.birthday-pill {
      background:
        linear-gradient(180deg, rgba(255,244,203,0.10), rgba(212,175,55,0.08)),
        rgba(255,255,255,0.02);
      color: #f7e6ac;
      border-color: rgba(212,175,55,0.20);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.05),
        0 0 18px rgba(212,175,55,0.06);
    }

    .artist-bio {
      max-width: 740px;
      color: #ddd;
      font-size: 15px;
      line-height: 1.9;
      white-space: pre-wrap;
      word-break: break-word;
      margin-bottom: 22px;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 34px;
    }

    .section-divider {
      width: min(100%, 760px);
      height: 1px;
      background:
        linear-gradient(90deg, transparent 0%, rgba(212,175,55,0.18) 16%, rgba(212,175,55,0.45) 50%, rgba(212,175,55,0.18) 84%, transparent 100%);
      margin: 0 0 28px;
      box-shadow: 0 0 22px rgba(212,175,55,0.08);
    }

    .submission-section {
      margin-top: 8px;
    }

    .submission-header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }

    .submission-title {
      font-size: clamp(24px, 3vw, 34px);
      line-height: 1.05;
    }

    .status-box,
    .empty-box {
      padding: 18px 20px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.06);
      background:
        linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.015)),
        rgba(255,255,255,0.02);
      color: #ddd;
      line-height: 1.7;
      margin-bottom: 14px;
    }

    .status-box.error {
      color: var(--danger);
    }

    .tracks-grid {
      display: grid;
      gap: 18px;
    }

    .track-card {
      padding: 22px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.045), rgba(255,255,255,0.012)),
        linear-gradient(180deg, rgba(22,22,22,0.82) 0%, rgba(13,13,13,0.92) 100%);
      border: 1px solid rgba(212,175,55,0.14);
      border-radius: 28px;
      box-shadow:
        0 24px 50px rgba(0,0,0,0.30),
        inset 0 1px 0 rgba(255,255,255,0.04);
    }

    .track-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 16px;
    }

    .track-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 23px;
      line-height: 1.1;
      margin-bottom: 6px;
      word-break: break-word;
    }

    .track-subtitle {
      color: #cfcfcf;
      font-size: 14px;
    }

    .track-status {
      display: inline-flex;
      align-items: center;
      min-height: 34px;
      padding: 0 12px;
      border-radius: 999px;
      border: 1px solid rgba(212,175,55,0.18);
      background: rgba(212,175,55,0.08);
      color: #f5df97;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1.1px;
      white-space: nowrap;
    }

    .track-player {
      display: grid;
      gap: 14px;
    }

    .player-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .player-btn {
      width: 52px;
      height: 52px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.12);
      background:
        linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.03)),
        linear-gradient(180deg, rgba(15,15,15,0.95), rgba(10,10,10,0.98));
      color: #f5f5f5;
      font-size: 18px;
      cursor: pointer;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.08),
        0 10px 22px rgba(0,0,0,0.24);
      flex: 0 0 auto;
      transition: transform 0.14s ease, filter 0.14s ease, box-shadow 0.14s ease;
    }

    .player-btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.03);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.10),
        0 14px 24px rgba(0,0,0,0.28);
    }

    .player-time {
      min-width: 52px;
      color: #d6d6d6;
      font-size: 13px;
      font-variant-numeric: tabular-nums;
      text-align: right;
    }

    .progress-wrap {
      position: relative;
      flex: 1;
      height: 12px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      overflow: hidden;
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.25);
    }

    .progress-bar {
      position: absolute;
      inset: 0 auto 0 0;
      width: 0%;
      border-radius: inherit;
      background:

  <script>
    const supabaseClient = window.supabase.createClient(

    const showLoginBtn = document.getElementById("showLoginBtn");

    let currentProfileData = null;
    let currentTrackData = null;
    let viewedArtistUserId = null;

    let currentAudio = null;
    let currentAudioButton = null;
    let currentProgressBar = null;

    let currentPreviewInterval = null;

    function getArtistUserIdFromUrl() {
      const params = new URLSearchParams(window.location.search);
      return params.get("user_id");
    }

    function setArtistStatus(message = "", isError = false) {
      if (!message) {
        artistStatus.classList.add("hidden");
        artistStatus.textContent = "";
        artistStatus.classList.remove("error");
        return;
      }

      artistStatus.classList.remove("hidden");
      artistStatus.textContent = message;
      artistStatus.classList.toggle("error", isError);
    }

    function closeHeaderPanels() {
      accountMenu.classList.add("hidden");
    }

    function setHeaderAvatar(photoUrl, artistName) {
      if (photoUrl) {
        headerAvatarImage.src = photoUrl;
        headerAvatarImage.classList.remove("hidden");
        headerAvatarFallback.classList.add("hidden");
      } else {
        headerAvatarImage.classList.add("hidden");
        headerAvatarFallback.classList.remove("hidden");
        headerAvatarFallback.textContent = (artistName || "A").charAt(0).toUpperCase();
      }
    }

    function getProfileHref(profile) {
      if (!profile) return "join.html";
      if (profile?.user_id) {
        return `artist.html?user_id=${encodeURIComponent(profile.user_id)}`;
      }
      return "join.html";
    }

    function applyMenuState(user, profile, track) {
      const isLoggedIn = Boolean(user);
      const hasProfile = Boolean(profile);
      const hasTrack = Boolean(track);

      desktopLoginLink.classList.toggle("hidden", isLoggedIn);
      mobileLoginLink.classList.toggle("hidden", isLoggedIn);
      desktopLogoutBtn.classList.toggle("hidden", !isLoggedIn);

      desktopProfileLink.classList.toggle("hidden", !isLoggedIn);
      mobileProfileLink.classList.toggle("hidden", !isLoggedIn);

      desktopNotificationsLink.classList.toggle("hidden", !isLoggedIn);
      mobileNotificationsLink.classList.toggle("hidden", !isLoggedIn);

      desktopTrackLink.classList.toggle("hidden", !isLoggedIn || !hasProfile);
      mobileTrackLink.classList.toggle("hidden", !isLoggedIn || !hasProfile);

      const profileHref = getProfileHref(profile);

      desktopProfileLink.href = profileHref;
      mobileProfileLink.href = profileHref;
      accountProfileLink.href = profileHref;

      accountProfileLink.classList.toggle("hidden", !isLoggedIn);

      desktopTrackLink.setAttribute("data-track-mode", hasTrack ? "edit" : "submit");
      mobileTrackLink.setAttribute("data-track-mode", hasTrack ? "edit" : "submit");
    }

    function setLoggedOutHeader() {
      closeHeaderPanels();
      showLoginBtn.classList.remove("hidden");
      headerAvatarBtn.classList.add("hidden");
      headerAvatarImage.classList.add("hidden");
      headerAvatarFallback.classList.add("hidden");
      headerAvatarImage.src = "";
      accountProfileLink.classList.add("hidden");
      accountProfileLink.href = "javascript:void(0)";
      currentUserId = null;
      currentProfileData = null;
      currentTrackData = null;
      applyMenuState(null, null, null);
    }

    function setLoggedInHeader() {
      showLoginBtn.classList.add("hidden");
      headerAvatarBtn.classList.remove("hidden");
    }

    async function handleLogout() {
      logoutBtn.disabled = true;
      desktopLogoutBtn.disabled = true;

      try {
        const { error } = await supabaseClient.auth.signOut();
        if (error) {
          setArtistStatus("Logout failed: " + error.message, true);
          return;
        }
        await refreshWholePage();
      } catch (err) {
        console.error(err);
        setArtistStatus("Logout failed. Try again.", true);
      } finally {
        logoutBtn.disabled = false;
        desktopLogoutBtn.disabled = false;
      }
    }

    async function loadCurrentUserState() {
      const { data, error } = await supabaseClient.auth.getSession();
      const user = error ? null : data?.session?.user || null;

      if (!user) {
        setLoggedOutHeader();
        return;
      }

      currentUserId = user.id;

      const profilePromise = supabaseClient
        .from("profiles")
        .select("user_id, artist_name, photo_url, bio, nationality, social_link, created_at, birthday")
        .eq("user_id", user.id)
        .maybeSingle();

      const trackPromise = supabaseClient
        .from("tracks")
        .select("id, user_id, title, status, created_at, preview_start_seconds, preview_duration_seconds")
        .eq("user_id", user.id)
        .order("created_at", { ascending: false })
        .limit(1)
        .maybeSingle();

      const [{ data: profileData }, { data: trackData }] = await Promise.all([profilePromise, trackPromise]);

      currentProfileData = profileData || null;
      currentTrackData = trackData || null;

      setLoggedInHeader();
      setHeaderAvatar(currentProfileData?.photo_url || "", currentProfileData?.artist_name || "A");
      applyMenuState(user, currentProfileData, currentTrackData);
    }

    function formatDate(dateString) {
      if (!dateString) return "";
      const date = new Date(dateString);
      if (Number.isNaN(date.getTime())) return "";
      return date.toLocaleDateString("en-GB", {
        day: "2-digit",
        month: "short",
        year: "numeric",
        timeZone: "UTC"
      });
    }

    function getMemberSinceDisplay(rawValue) {
      if (!rawValue) return "—";

      const parsed = new Date(rawValue);

      if (!Number.isNaN(parsed.getTime())) {
        const month = parsed.toLocaleDateString("en-GB", {
          month: "short",
          timeZone: "UTC"
        });

        const year = parsed.toLocaleDateString("en-GB", {
          year: "numeric",
          timeZone: "UTC"
        });

        return `${month} ${year}`;
      }

      const raw = String(rawValue).trim();

      if (raw.length >= 7) {
        const year = raw.slice(0, 4);
        const monthNum = raw.slice(5, 7);

        const monthMap = {
          "01": "Jan",
          "02": "Feb",
          "03": "Mar",
          "04": "Apr",
          "05": "May",
          "06": "Jun",
          "07": "Jul",
          "08": "Aug",
          "09": "Sep",
          "10": "Oct",
          "11": "Nov",
          "12": "Dec"
        };

        if (monthMap[monthNum] && /^\d{4}$/.test(year)) {
          return `${monthMap[monthNum]} ${year}`;
        }
      }

      return "—";
    }

    function getBirthdayDisplay(rawValue) {
      if (!rawValue) return "";

      const parsed = new Date(rawValue);

      if (!Number.isNaN(parsed.getTime())) {
        return parsed.toLocaleDateString("en-GB", {
          day: "numeric",
          month: "long",
          timeZone: "UTC"
        });
      }

      const raw = String(rawValue).trim();
      const match = raw.match(/^(\d{4})-(\d{2})-(\d{2})/);

      if (match) {
        const [, , monthNum, dayNum] = match;
        const monthMap = {
          "01": "January",
          "02": "February",
          "03": "March",
          "04": "April",
          "05": "May",
          "06": "June",
          "07": "July",
          "08": "August",
          "09": "September",
          "10": "October",
          "11": "November",
          "12": "December"
        };

        if (monthMap[monthNum]) {
          return `${Number(dayNum)} ${monthMap[monthNum]}`;
        }
      }

      return raw;
    }

    function formatTime(seconds) {
      const safe = Math.max(0, Math.floor(Number(seconds) || 0));
      const mins = Math.floor(safe / 60);
      const secs = safe % 60;
      return `${mins}:${secs.toString().padStart(2, "0")}`;
    }

    function stopCurrentAudio() {
      if (currentPreviewInterval) {
        clearInterval(currentPreviewInterval);
        currentPreviewInterval = null;
      }

      if (currentAudio) {
        currentAudio.pause();
      }

      if (currentAudioButton) {
        currentAudioButton.textContent = "▶";
      }

      if (currentProgressBar) {
        currentProgressBar.style.width = "0%";
      }

      if (currentTimeLabel) {
        currentTimeLabel.textContent = "0:00";
      }

      currentAudio = null;
      currentAudioButton = null;
      currentProgressBar = null;
      currentTimeLabel = null;
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function renderArtistProfile(profile, isOwnPage, hasOwnTrack) {
      const displayName = profile?.artist_name || "Unknown Artist";
      artistNameEl.textContent = displayName;
      submissionTitle.textContent = `${displayName}'s submission`;

      if (profile?.photo_url) {
        artistPhoto.src = profile.photo_url;
        artistPhoto.classList.remove("hidden");
        artistPhotoFallback.classList.add("hidden");
      } else {
        artistPhoto.classList.add("hidden");
        artistPhotoFallback.classList.remove("hidden");
        artistPhotoFallback.textContent = displayName.charAt(0).toUpperCase();
      }

      artistMeta.innerHTML = "";
      artistMeta.classList.remove("hidden");

      if (profile?.nationality) {
        const nationalityPill = document.createElement("div");
        nationalityPill.className = "meta-pill";
        nationalityPill.textContent = profile.nationality;
        artistMeta.appendChild(nationalityPill);
      }

      const memberSincePill = document.createElement("div");
      memberSincePill.className = "meta-pill member-since-pill";
      memberSincePill.textContent = `Member since ${getMemberSinceDisplay(profile?.created_at)}`;
      artistMeta.appendChild(memberSincePill);

      const birthdayDisplay = getBirthdayDisplay(profile?.birthday);
      if (birthdayDisplay) {
        const birthdayPill = document.createElement("div");
        birthdayPill.className = "meta-pill birthday-pill";
        birthdayPill.textContent = `Birthday ${birthdayDisplay}`;
        artistMeta.appendChild(birthdayPill);
      }

      if (artistMeta.children.length === 0) {
        artistMeta.classList.add("hidden");
      }

      if (profile?.bio) {
        artistBio.textContent = profile.bio;
        artistBio.classList.remove("hidden");
      } else {
        artistBio.classList.add("hidden");
        artistBio.textContent = "";
      }

      if (profile?.social_link) {
        socialLinkBtn.href = profile.social_link;
        socialLinkBtn.classList.remove("hidden");
      } else {
        socialLinkBtn.classList.add("hidden");
        socialLinkBtn.href = "#";
      }

      editProfileBtn.classList.toggle("hidden", !isOwnPage || !currentProfileData);

      if (isOwnPage && currentProfileData) {
        submitTrackBtn.classList.remove("hidden");
        submitTrackBtn.textContent = hasOwnTrack ? "Edit Your Track" : "Submit Your Track";
        submitTrackBtn.href = "submit-track.html";
      } else {
        submitTrackBtn.classList.add("hidden");
      }
    }

    function buildTrackCard(track) {
      const card = document.createElement("article");
      card.className = "track-card";

      const createdAtLabel = formatDate(track.created_at);
      const previewStart = Math.max(0, Number(track.preview_start_seconds || 0));
      const previewDuration = Math.max(1, Math.min(60, Number(track.preview_duration_seconds || 60)));
      const genrePills = [];

      if (track.genre_primary) genrePills.push(track.genre_primary);
      if (track.genre_secondary) genrePills.push(track.genre_secondary);

      const feelingTags = Array.isArray(track.feeling_tags) ? track.feeling_tags : [];

      card.innerHTML = `
        <div class="track-top">
          <div>
            <div class="track-title">${escapeHtml(track.title || "Untitled Track")}</div>
            <div class="track-subtitle">${escapeHtml(track.artist || "Artist")}</div>
          </div>
          <div class="track-status">Approved</div>
        </div>

        <div class="track-player">
          <div class="player-row">
            <button class="player-btn" type="button" aria-label="Play preview">▶</button>
            <div class="progress-wrap">
              <div class="progress-bar"></div>
            </div>
            <div class="player-time">0:00</div>
          </div>

          <div class="track-meta-row">
            <div class="mini-pill">Preview: ${formatTime(previewStart)} - ${formatTime(previewStart + previewDuration)}</div>
            ${createdAtLabel ? `<div class="mini-pill">Submitted: ${escapeHtml(createdAtLabel)}</div>` : ""}
            ${genrePills.map(genre => `<div class="mini-pill">Genre: ${escapeHtml(genre)}</div>`).join("")}
            ${feelingTags.map(tag => `<div class="mini-pill">#${escapeHtml(tag)}</div>`).join("")}
          </div>
        </div>
      `;

      const playBtn = card.querySelector(".player-btn");
      const progressBar = card.querySelector(".progress-bar");
      const timeLabel = card.querySelector(".player-time");

      const audio = new Audio(track.file_url);
      audio.preload = "metadata";

      playBtn.addEventListener("click", async () => {
        try {
          if (currentAudio && currentAudio !== audio) {
            stopCurrentAudio();
          }

          if (!audio.paused && currentAudio === audio) {
            stopCurrentAudio();
            return;
          }

          stopCurrentAudio();

          currentAudio = audio;
          currentAudioButton = playBtn;
          currentProgressBar = progressBar;
          currentTimeLabel = timeLabel;

          audio.currentTime = previewStart;
          await audio.play();
          playBtn.textContent = "❚❚";

          currentPreviewInterval = setInterval(() => {
            const elapsed = Math.max(0, audio.currentTime - previewStart);
            const percent = Math.min((elapsed / previewDuration) * 100, 100);

            progressBar.style.width = `${percent}%`;
            timeLabel.textContent = formatTime(elapsed);

            if (audio.currentTime >= previewStart + previewDuration) {
              stopCurrentAudio();
            }
          }, 120);
        } catch (err) {
          console.error(err);
          setArtistStatus("Preview could not be played.", true);
          stopCurrentAudio();
        }
      });

      audio.addEventListener("ended", () => {
        if (currentAudio === audio) {
          stopCurrentAudio();
        }
      });

      return card;
    }

    async function loadViewedArtistPage() {
      viewedArtistUserId = getArtistUserIdFromUrl();

      if (!viewedArtistUserId) {
        artistNameEl.textContent = "Artist not found";
        submissionTitle.textContent = "Artist submission";
        noTracksBox.classList.add("hidden");
        tracksWrap.classList.add("hidden");
        setArtistStatus("No artist user_id was provided in the URL.", true);
        return;
      }

      setArtistStatus("");
      tracksWrap.classList.add("hidden");
      noTracksBox.classList.add("hidden");
      tracksWrap.innerHTML = "";

      const { data: profile, error: profileError } = await supabaseClient
        .from("profiles")
        .select("user_id, artist_name, photo_url, bio, social_link, nationality, created_at, birthday")
        .eq("user_id", viewedArtistUserId)
        .maybeSingle();

      if (profileError) {
        artistNameEl.textContent = "Artist not found";
        submissionTitle.textContent = "Artist submission";
        setArtistStatus("Could not load artist profile: " + profileError.message, true);
        return;
      }

      if (!profile) {
        artistNameEl.textContent = "Artist not found";
        submissionTitle.textContent = "Artist submission";
        setArtistStatus("This artist profile does not exist.", true);
        return;
      }

      const isOwnPage = Boolean(currentUserId && currentUserId === viewedArtistUserId);
      const hasOwnTrack = Boolean(currentTrackData);
      renderArtistProfile(profile, isOwnPage, hasOwnTrack);

      const { data: approvedTracks, error: tracksError } = await supabaseClient
        .from("tracks")
        .select("id, title, artist, file_url, created_at, status, user_id, preview_start_seconds, preview_duration_seconds, genre_primary, genre_secondary, feeling_tags")
        .eq("user_id", viewedArtistUserId)
        .eq("status", "approved")
        .order("created_at", { ascending: false });

      if (tracksError) {
        setArtistStatus("Could not load approved track: " + tracksError.message, true);
        return;
      }

      if (!approvedTracks || approvedTracks.length === 0) {
        noTracksBox.classList.remove("hidden");
        tracksWrap.classList.add("hidden");
        return;
      }

      tracksWrap.innerHTML = "";
      approvedTracks.forEach(track => {
        tracksWrap.appendChild(buildTrackCard(track));
      });

      tracksWrap.classList.remove("hidden");
      noTracksBox.classList.add("hidden");
    }

    async function refreshWholePage() {
      await loadCurrentUserState();
      await loadViewedArtistPage();
    }

    showLoginBtn.onclick = () => {
      closeHeaderPanels();
    };

    headerAvatarBtn.onclick = () => {
      accountMenu.classList.toggle("hidden");
    };

    accountProfileLink.onclick = () => {
      accountMenu.classList.add("hidden");
    };

    accountNotificationsLink.onclick = () => {
      accountMenu.classList.add("hidden");
    };

    logoutBtn.onclick = handleLogout;
    desktopLogoutBtn.onclick = handleLogout;

    document.addEventListener("click", (e) => {
      const insideHeaderRight = e.target.closest(".header-right");
      const isAvatarButton = e.target.closest("#headerAvatarBtn");

      if (!insideHeaderRight && !isAvatarButton) {
        accountMenu.classList.add("hidden");
      }
    });

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        accountMenu.classList.add("hidden");
      }
    });

    supabaseClient.auth.onAuthStateChange(() => {
      refreshWholePage().catch(err => {
        console.error(err);
        setArtistStatus("The page could not be refreshed correctly.", true);
      });
    });

    async function initPage() {
      setArtistStatus("");
      await refreshWholePage();
    }

    initPage().catch(err => {
      console.error("initPage error:", err);
      setArtistStatus("The page could not be loaded correctly.", true);
    });
  </script>
</body>
</html>
