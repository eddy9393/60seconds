<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Artist Page - 60 Seconds FM</title>

  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/artist.css">
</head>
<body>
  <aside class="desktop-side-nav" aria-label="Desktop navigation">
    <div class="desktop-side-nav-panel">
      <nav class="desktop-side-links">
        <a class="desktop-nav-link" href="index.html" aria-label="Radio">
          <span class="desktop-nav-icon" aria-hidden="true">
            <span class="nav-icon-mask" style="--icon-url: url('/icons/radio.png');"></span>
          </span>
          <span class="desktop-nav-label">Radio</span>
        </a>

        <a id="desktopProfileLink" class="desktop-nav-link active hidden" href="join.html" aria-label="Profile">
          <span class="desktop-nav-icon" aria-hidden="true">
            <span class="nav-icon-mask" style="--icon-url: url('/icons/profile.png');"></span>
          </span>
          <span class="desktop-nav-label">Profile</span>
        </a>

        <a id="desktopNotificationsLink" class="desktop-nav-link hidden" href="notifications.html" aria-label="Notifications">
          <span class="desktop-nav-icon" aria-hidden="true">
            <span class="nav-icon-mask" style="--icon-url: url('/icons/notifications.png');"></span>
          </span>
          <span class="desktop-nav-label">Notifications</span>
        </a>

        <a id="desktopTuneLink" class="desktop-nav-link hidden" href="submit-tune.html" aria-label="Tune">
          <span class="desktop-nav-icon" aria-hidden="true">
            <span class="nav-icon-mask" style="--icon-url: url('/icons/tune.png');"></span>
          </span>
          <span class="desktop-nav-label">Tune</span>
        </a>
      </nav>

      <div class="desktop-side-bottom">
        <a id="desktopLoginLink" class="desktop-nav-link" href="login.html" aria-label="Login">
          <span class="desktop-nav-icon" aria-hidden="true">
            <span class="nav-icon-mask" style="--icon-url: url('/icons/login.png');"></span>
          </span>
          <span class="desktop-nav-label">Login</span>
        </a>

        <button id="desktopLogoutBtn" class="desktop-nav-button hidden" type="button" aria-label="Logout">
          <span class="desktop-nav-icon" aria-hidden="true">
            <span class="nav-icon-mask" style="--icon-url: url('/icons/logout.png');"></span>
          </span>
          <span class="desktop-nav-label">Logout</span>
        </button>
      </div>
    </div>
  </aside>

  <div class="mobile-bottom-nav-wrap">
    <nav class="mobile-bottom-nav" aria-label="Mobile navigation">
      <a class="mobile-nav-link" href="index.html" aria-label="Radio">
        <span class="mobile-nav-icon" aria-hidden="true">
          <span class="nav-icon-mask" style="--icon-url: url('/icons/radio.png');"></span>
        </span>
        <span class="mobile-nav-label">Radio</span>
      </a>

      <a id="mobileProfileLink" class="mobile-nav-link active hidden" href="join.html" aria-label="Profile">
        <span class="mobile-nav-icon" aria-hidden="true">
          <span class="nav-icon-mask" style="--icon-url: url('/icons/profile.png');"></span>
        </span>
        <span class="mobile-nav-label">Profile</span>
      </a>

      <a id="mobileNotificationsLink" class="mobile-nav-link hidden" href="notifications.html" aria-label="Notifications">
        <span class="mobile-nav-icon" aria-hidden="true">
          <span class="nav-icon-mask" style="--icon-url: url('/icons/notifications.png');"></span>
        </span>
        <span class="mobile-nav-label">Notifications</span>
      </a>

      <a id="mobileTuneLink" class="mobile-nav-link hidden" href="submit-tune.html" aria-label="Tune">
        <span class="mobile-nav-icon" aria-hidden="true">
          <span class="nav-icon-mask" style="--icon-url: url('/icons/tune.png');"></span>
        </span>
        <span class="mobile-nav-label">Tune</span>
      </a>

      <a id="mobileLoginLink" class="mobile-nav-link" href="login.html" aria-label="Login">
        <span class="mobile-nav-icon" aria-hidden="true">
          <span class="nav-icon-mask" style="--icon-url: url('/icons/login.png');"></span>
        </span>
        <span class="mobile-nav-label">Login</span>
      </a>
    </nav>
  </div>

  <div class="header-wrap">
    <header class="header-bar">
      <div class="header-left">
        <div id="currencyBadge" class="currency-badge hidden" aria-label="Seconds balance">
          <img src="coin.png" alt="" class="currency-badge-icon" />
          <span id="currencyValue" class="currency-badge-value">0</span>
        </div>
      </div>

      <div class="header-center">
        <a href="index.html" class="header-logo-link" aria-label="60 Seconds FM home">
          <img src="logo.png" alt="60 Seconds FM" class="header-logo" />
        </a>
      </div>

      <div class="header-right">
        <a id="showLoginBtn" class="header-icon-btn" href="login.html" aria-label="Login">
          <span class="person-icon" aria-hidden="true"></span>
        </a>

        <button id="headerAvatarBtn" class="header-avatar-btn hidden" type="button" aria-label="Open account menu">
          <img id="headerAvatarImage" class="hidden" src="" alt="Profile photo" />
          <div id="headerAvatarFallback" class="header-avatar-fallback hidden">A</div>
        </button>

        <div id="accountMenu" class="account-menu hidden">
          <div class="account-menu-actions">
            <a id="accountProfileLink" class="metal-btn account-menu-link hidden" href="javascript:void(0)">Profile</a>
            <button id="logout" class="metal-btn" type="button">Logout</button>
          </div>
        </div>
      </div>
    </header>
  </div>

  <div class="site-shell">
    <main class="page-wrap">
      <section class="artist-stage">
        <div class="portrait-column">
          <div class="portrait-stage">
            <img id="artistPhoto" class="artist-photo hidden" src="" alt="Artist photo" />
            <div id="artistPhotoFallback" class="artist-photo-fallback">A</div>
          </div>
        </div>

        <div class="info-column">
          <div class="section-kicker">Artist Page</div>
          <h1 id="artistName" class="artist-name">Loading artist...</h1>

          <div id="artistMeta" class="artist-meta hidden"></div>

          <div id="artistBio" class="artist-bio hidden"></div>

          <div class="hero-actions">
            <a id="socialLinkBtn" class="ghost-btn hidden" href="#" target="_blank" rel="noopener noreferrer">Visit Social / Streaming</a>
            <a id="editProfileBtn" class="metal-btn hidden" href="edit-profile.html">Edit Profile</a>
            <a id="submitTuneBtn" class="gold-btn hidden" href="submit-tune.html">Submit Your Tune</a>
          </div>

          <div class="section-divider"></div>

          <section class="submission-section">
            <div class="submission-header">
              <h2 id="submissionTitle" class="submission-title">Tune</h2>
            </div>

            <div id="artistStatus" class="status-box hidden"></div>

            <div id="tunesWrap" class="tunes-grid hidden"></div>

            <div id="noTunesBox" class="empty-box hidden">
              This artist has no approved tune available yet.
            </div>
          </section>
        </div>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/artist.js"></script>
  <script src="assets/js/radio-mini-player.js"></script>
</body>
</html>
