<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Artist Page - 60 Seconds FM</title>

  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --gold: #d4af37;
      --gold-2: #f4d77a;
      --gold-dark: #8f6b13;
      --text: #f5f5f5;
      --muted: #a8a8a8;
      --panel: rgba(18,18,18,0.9);
      --panel-2: rgba(24,24,24,0.92);
      --border: rgba(255,255,255,0.08);
      --border-gold: rgba(212,175,55,0.18);
      --danger: #ff8a8a;
      --success: #cfcfcf;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(180deg, rgba(7, 7, 7, 0.48) 0%, rgba(7, 7, 7, 0.72) 45%, rgba(7, 7, 7, 0.82) 100%),
        radial-gradient(circle at top, rgba(212, 175, 55, 0.14), transparent 30%),
        url("bg-mobile-final-1080x1920.webp");
      background-size: cover, auto, cover;
      background-position: center top, center top, center center;
      background-repeat: no-repeat, no-repeat, no-repeat;
      background-attachment: fixed, scroll, fixed;
      color: var(--text);
      font-family: 'Manrope', sans-serif;
      padding: 0 18px 44px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body.menu-open {
      overflow: hidden;
    }

    h1, h2, h3 {
      font-family: 'Space Grotesk', sans-serif;
      margin: 0;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    .hidden {
      display: none !important;
    }

    .site-shell {
      max-width: 1180px;
      margin: 0 auto;
      padding-top: 8px;
    }

    .header-wrap {
      position: sticky;
      top: 0;
      z-index: 80;
      width: 100%;
      background: linear-gradient(180deg, rgba(0,0,0,0.74), rgba(0,0,0,0.42) 70%, rgba(0,0,0,0));
      backdrop-filter: blur(6px);
    }

    .header-bar {
      width: 100%;
      min-height: 74px;
      display: grid;
      grid-template-columns: 60px 1fr 60px;
      align-items: center;
      gap: 10px;
      padding: 8px 16px 4px;
      position: relative;
    }

    .header-left,
    .header-center,
    .header-right {
      display: flex;
      align-items: center;
      min-width: 0;
    }

    .header-left {
      justify-content: flex-start;
    }

    .header-center {
      justify-content: center;
      pointer-events: none;
    }

    .header-center > * {
      pointer-events: auto;
    }

    .header-right {
      justify-content: flex-end;
      position: relative;
    }

    .header-logo-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .header-logo {
      display: block;
      width: min(288px, 45vw);
      height: auto;
      filter:
        drop-shadow(0 8px 18px rgba(0, 0, 0, 0.35))
        drop-shadow(0 0 20px rgba(212, 175, 55, 0.08));
    }

    .header-icon-btn {
      width: 42px;
      height: 42px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.14);
      background:
        linear-gradient(180deg, rgba(255,255,255,0.12), rgba(255,255,255,0.04)),
        linear-gradient(180deg, rgba(10,10,10,0.86), rgba(10,10,10,0.92));
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.08),
        0 10px 22px rgba(0,0,0,0.24);
      backdrop-filter: blur(4px);
      transition: transform 0.14s ease, box-shadow 0.14s ease, filter 0.14s ease;
      padding: 0;
    }

    .header-icon-btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.03);
    }

    .menu-icon {
      position: relative;
      width: 20px;
      height: 16px;
    }

    .menu-icon span {
      position: absolute;
      left: 0;
      width: 20px;
      height: 3px;
      border-radius: 999px;
      background: #f5f5f5;
      transition: transform 0.18s ease, opacity 0.18s ease, top 0.18s ease;
    }

    .menu-icon span:nth-child(1) { top: 0; }
    .menu-icon span:nth-child(2) { top: 6px; }
    .menu-icon span:nth-child(3) { top: 12px; }

    .header-icon-btn.active .menu-icon span:nth-child(1) {
      top: 6px;
      transform: rotate(45deg);
    }

    .header-icon-btn.active .menu-icon span:nth-child(2) {
      opacity: 0;
    }

    .header-icon-btn.active .menu-icon span:nth-child(3) {
      top: 6px;
      transform: rotate(-45deg);
    }

    .person-icon {
      position: relative;
      width: 22px;
      height: 22px;
    }

    .person-icon::before,
    .person-icon::after {
      content: "";
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      border: 2.2px solid #f5f5f5;
      box-sizing: border-box;
    }

    .person-icon::before {
      top: 0;
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }

    .person-icon::after {
      bottom: -1px;
      width: 21px;
      height: 11px;
      border-top-left-radius: 16px;
      border-top-right-radius: 16px;
      border-bottom: 0;
    }

    .header-avatar-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      padding: 0;
      overflow: hidden;
      border: 2px solid rgba(212,175,55,0.55);
      background: #111;
      box-shadow:
        0 10px 22px rgba(0,0,0,0.24),
        0 0 0 3px rgba(212,175,55,0.08);
      cursor: pointer;
    }

    .header-avatar-btn img,
    .header-avatar-btn .header-avatar-fallback {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      display: block;
      object-fit: cover;
    }

    .header-avatar-fallback {
      display: flex !important;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #3a2d0d, #a98325);
      color: #fff;
      font-weight: 700;
      font-size: 15px;
      font-family: 'Space Grotesk', sans-serif;
    }

    .account-menu {
      position: absolute;
      top: 52px;
      right: 0;
      min-width: 170px;
      padding: 8px;
      border-radius: 18px;
      background:
        linear-gradient(180deg, rgba(20,20,20,0.96), rgba(10,10,10,0.98));
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow:
        0 18px 40px rgba(0,0,0,0.38),
        inset 0 1px 0 rgba(255,255,255,0.04);
      backdrop-filter: blur(8px);
    }

    .account-menu button {
      width: 100%;
    }

    .auth-box.compact-auth {
      position: absolute;
      top: 52px;
      right: 0;
      width: 250px;
      text-align: left;
      margin: 0;
      padding: 10px;
      border-radius: 18px;
      background:
        linear-gradient(180deg, rgba(20,20,20,0.96), rgba(10,10,10,0.98));
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow:
        0 18px 40px rgba(0,0,0,0.38),
        inset 0 1px 0 rgba(255,255,255,0.04);
      backdrop-filter: blur(8px);
      z-index: 90;
    }

    .compact-auth h3 {
      margin: 0 0 10px;
      color: var(--gold);
      font-size: 13px;
      font-weight: 700;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .compact-auth .auth-inputs {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      margin-bottom: 8px;
    }

    .compact-auth input,
    .menu-auth-inputs input {
      width: 100%;
      min-height: 40px;
      padding: 10px 11px;
      font-size: 13px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.08);
      background: linear-gradient(180deg, rgba(16,16,16,0.92) 0%, rgba(12,12,12,0.96) 100%);
      color: white;
      outline: none;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.04),
        0 6px 16px rgba(0,0,0,0.18);
      font-family: 'Manrope', sans-serif;
    }

    .compact-auth input:focus,
    .menu-auth-inputs input:focus {
      border-color: rgba(212,175,55,0.38);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.04),
        0 0 0 3px rgba(212,175,55,0.08);
    }

    .compact-auth .auth-row,
    .menu-auth-actions {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
    }

    .compact-auth .metal-btn,
    .menu-auth-actions .metal-btn {
      width: 100%;
      padding: 11px 14px;
      font-size: 13px;
    }

    .compact-auth .auth-message,
    .menu-auth-message {
      min-height: 16px;
      margin-top: 8px;
      font-size: 11px;
      color: #cfcfcf;
      text-align: center;
    }

    .side-menu-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(2px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s ease;
      z-index: 55;
    }

    .side-menu-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .side-menu {
      position: fixed;
      top: 0;
      left: 0;
      width: min(360px, 86vw);
      height: 100vh;
      padding: 22px 18px 24px;
      background:
        linear-gradient(180deg, rgba(20,20,20,0.98), rgba(10,10,10,0.98));
      border-right: 1px solid rgba(255,255,255,0.08);
      box-shadow:
        20px 0 50px rgba(0,0,0,0.45),
        inset 0 1px 0 rgba(255,255,255,0.04);
      backdrop-filter: blur(12px);
      transform: translateX(-104%);
      transition: transform 0.24s ease;
      z-index: 60;
      text-align: left;
      overflow-y: auto;
    }

    .side-menu.open {
      transform: translateX(0);
    }

    .side-menu-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 18px;
    }

    .side-menu-brand {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .side-menu-kicker {
      font-family: 'Space Grotesk', sans-serif;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-size: 11px;
      color: var(--muted);
      opacity: 0.8;
    }

    .side-menu-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 22px;
      color: #fff;
    }

    .side-menu-close {
      width: 42px;
      height: 42px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.14);
      background:
        linear-gradient(180deg, rgba(255,255,255,0.12), rgba(255,255,255,0.04)),
        linear-gradient(180deg, rgba(10,10,10,0.86), rgba(10,10,10,0.92));
      color: #fff;
      cursor: pointer;
      font-size: 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .side-menu-links {
      display: grid;
      gap: 10px;
    }

    .menu-link,
    .menu-action-btn {
      width: 100%;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 54px;
      padding: 0 16px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.06);
      background:
        linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.015)),
        rgba(255,255,255,0.02);
      color: #f4f4f4;
      font-size: 15px;
      font-weight: 500;
      font-family: 'Manrope', sans-serif;
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }

    .menu-link:hover,
    .menu-action-btn:hover {
      transform: translateX(2px);
      border-color: rgba(212,175,55,0.22);
    }

    .menu-link-icon {
      width: 30px;
      height: 30px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background:
        linear-gradient(180deg, #fff5c9 0%, #f4d77a 20%, #d4af37 52%, #b98816 75%, #7c5a11 100%);
      flex: 0 0 auto;
      color: #111;
      box-shadow:
        inset 0 2px 0 rgba(255,255,255,0.45),
        inset 0 -2px 4px rgba(90,50,0,0.28),
        0 8px 18px rgba(212,175,55,0.14);
    }

    .menu-link-icon svg {
      width: 16px;
      height: 16px;
      display: block;
    }

    .side-menu-divider {
      height: 1px;
      margin: 8px 0 6px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
    }

    .menu-auth-panel {
      margin-top: 8px;
      padding: 12px;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,0.08);
      background:
        linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.015)),
        rgba(255,255,255,0.02);
    }

    .menu-auth-title {
      margin: 0 0 10px;
      color: var(--gold);
      font-size: 12px;
      font-weight: 700;
      text-align: center;
      font-family: 'Space Grotesk', sans-serif;
      text-transform: uppercase;
      letter-spacing: 1.6px;
    }

    .menu-auth-inputs {
      display: grid;
      gap: 8px;
      margin-bottom: 8px;
    }

    .page-wrap {
      max-width: 1100px;
      margin: 12px auto 0;
    }

    .artist-hero {
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);
      gap: 22px;
      align-items: stretch;
    }

    .hero-card,
    .panel-card,
    .track-card {
      background:
        linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.015)),
        radial-gradient(circle at top, rgba(212,175,55,0.09), transparent 60%),
        linear-gradient(180deg, rgba(24,24,24,0.88) 0%, rgba(17,17,17,0.94) 100%);
      border: 1px solid var(--border-gold);
      border-radius: 30px;
      box-shadow:
        0 30px 80px rgba(0,0,0,0.42),
        0 0 35px rgba(212,175,55,0.07),
        inset 0 1px 0 rgba(255,255,255,0.05);
    }

    .hero-photo-card {
      padding: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100%;
    }

    .artist-photo {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 26px;
      object-fit: cover;
      display: block;
      background: #101010;
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow:
        0 20px 35px rgba(0,0,0,0.28),
        0 0 0 1px rgba(212,175,55,0.08);
    }

    .artist-photo-fallback {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 30% 20%, rgba(255,255,255,0.12), transparent 30%),
        linear-gradient(180deg, #2a210d 0%, #a98325 100%);
      color: #fff;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 76px;
      font-weight: 700;
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow:
        0 20px 35px rgba(0,0,0,0.28),
        0 0 0 1px rgba(212,175,55,0.08);
    }

    .hero-info-card {
      padding: 28px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .section-kicker {
      font-family: 'Space Grotesk', sans-serif;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-size: 12px;
      color: var(--muted);
      opacity: 0.82;
      margin-bottom: 10px;
    }

    .artist-name {
      font-size: clamp(34px, 5vw, 54px);
      line-height: 1;
      margin-bottom: 12px;
      text-shadow: 0 2px 14px rgba(0,0,0,0.3);
      word-break: break-word;
    }

    .artist-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 18px;
    }

    .meta-pill {
      display: inline-flex;
      align-items: center;
      min-height: 38px;
      padding: 0 14px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.08);
      background:
        linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.02)),
        rgba(255,255,255,0.02);
      color: #e7e7e7;
      font-size: 13px;
      letter-spacing: 0.2px;
    }

    .artist-bio {
      color: #ddd;
      font-size: 15px;
      line-height: 1.8;
      white-space: pre-wrap;
      word-break: break-word;
      margin-bottom: 18px;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .gold-btn,
    .metal-btn,
    .ghost-btn {
      min-height: 52px;
      border-radius: 999px;
      padding: 0 24px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.14s ease, filter 0.14s ease;
    }

    .gold-btn:hover,
    .metal-btn:hover,
    .ghost-btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.03);
    }

    .gold-btn {
      color: #231700;
      font-weight: 700;
      font-size: 15px;
      background:
        linear-gradient(180deg, #fff5c9 0%, #f4d77a 20%, #d4af37 52%, #b98816 75%, #7c5a11 100%);
      border: 1px solid rgba(255, 230, 150, 0.38);
      box-shadow:
        inset 0 2px 0 rgba(255,255,255,0.45),
        inset 0 -2px 4px rgba(90,50,0,0.28),
        0 12px 26px rgba(212,175,55,0.22),
        0 0 0 1px rgba(212,175,55,0.08);
    }

    .metal-btn {
      border: 1px solid rgba(255,255,255,0.16);
      background:
        linear-gradient(180deg, #fbfbfb 0%, #d6d6d6 16%, #b6b6b6 35%, #8b8b8b 52%, #d2d2d2 72%, #f4f4f4 100%);
      color: #151515;
      font-weight: 600;
      font-size: 14px;
      text-shadow: 0 1px 0 rgba(255,255,255,0.45);
      box-shadow:
        inset 0 2px 0 rgba(255,255,255,0.72),
        inset 0 -2px 3px rgba(0,0,0,0.18),
        0 10px 22px rgba(0,0,0,0.25);
    }

    .ghost-btn {
      border: 1px solid rgba(255,255,255,0.08);
      background:
        linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.015)),
        rgba(255,255,255,0.02);
      color: #f4f4f4;
      font-weight: 600;
      font-size: 14px;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.04),
        0 10px 24px rgba(0,0,0,0.2);
    }

    .stack {
      margin-top: 22px;
      display: grid;
      gap: 18px;
    }

    .panel-card {
      padding: 24px;
    }

    .panel-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 18px;
    }

    .panel-title {
      font-size: clamp(22px, 3vw, 30px);
    }

    .panel-note {
      color: #cfcfcf;
      line-height: 1.7;
      font-size: 15px;
    }

    .status-box,
    .empty-box {
      padding: 18px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.06);
      background:
        linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.015)),
        rgba(255,255,255,0.02);
      color: #ddd;
      line-height: 1.7;
    }

    .status-box.error {
      color: var(--danger);
    }

    .tracks-grid {
      display: grid;
      gap: 18px;
    }

    .track-card {
      padding: 20px;
    }

    .track-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 16px;
    }

    .track-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 23px;
      line-height: 1.15;
      margin-bottom: 6px;
      word-break: break-word;
    }

    .track-subtitle {
      color: #cfcfcf;
      font-size: 14px;
    }

    .track-status {
      display: inline-flex;
      align-items: center;
      min-height: 34px;
      padding: 0 12px;
      border-radius: 999px;
      border: 1px solid rgba(212,175,55,0.18);
      background: rgba(212,175,55,0.08);
      color: #f5df97;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1.1px;
      white-space: nowrap;
    }

    .track-player {
      display: grid;
      gap: 14px;
    }

    .player-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .player-btn {
      width: 52px;
      height: 52px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.12);
      background:
        linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.03)),
        linear-gradient(180deg, rgba(15,15,15,0.95), rgba(10,10,10,0.98));
      color: #f5f5f5;
      font-size: 18px;
      cursor: pointer;

  <script>
    const supabaseClient = window.supabase.createClient(
      "https://rgoutegbcpjytplqcwze.supabase.co",
      "sb_publishable_255qyDKS77nMU0pbedfa_A_3hdgtEHh"
    );

    const menuBtn = document.getElementById("menuBtn");
    const sideMenu = document.getElementById("sideMenu");
    const sideMenuOverlay = document.getElementById("sideMenuOverlay");
    const closeMenuBtn = document.getElementById("closeMenuBtn");

    const menuLoginBtn = document.getElementById("menuLoginBtn");
    const menuSignupBtn = document.getElementById("menuSignupBtn");
    const menuLogoutBtn = document.getElementById("menuLogoutBtn");
    const menuCreateProfileLink = document.getElementById("menuCreateProfileLink");
    const menuEditProfileLink = document.getElementById("menuEditProfileLink");
    const menuSubmitTrackLink = document.getElementById("menuSubmitTrackLink");
    const menuSubmitTrackLabel = document.getElementById("menuSubmitTrackLabel");
    const menuArtistPageLink = document.getElementById("menuArtistPageLink");

    const menuAuthPanel = document.getElementById("menuAuthPanel");
    const menuAuthTitle = document.getElementById("menuAuthTitle");
    const menuEmail = document.getElementById("menuEmail");
    const menuPassword = document.getElementById("menuPassword");
    const menuSignupSubmitBtn = document.getElementById("menuSignupSubmitBtn");
    const menuLoginSubmitBtn = document.getElementById("menuLoginSubmitBtn");
    const menuAuthMessage = document.getElementById("menuAuthMessage");

    const showLoginBtn = document.getElementById("showLoginBtn");
    const headerAvatarBtn = document.getElementById("headerAvatarBtn");
    const headerAvatarImage = document.getElementById("headerAvatarImage");
    const headerAvatarFallback = document.getElementById("headerAvatarFallback");
    const accountMenu = document.getElementById("accountMenu");

    const authBox = document.getElementById("authBox");
    const authMessageEl = document.getElementById("authMessage");
    const email = document.getElementById("email");
    const password = document.getElementById("password");
    const signupBtn = document.getElementById("signup");
    const loginBtn = document.getElementById("login");
    const logoutBtn = document.getElementById("logout");

    const artistPhoto = document.getElementById("artistPhoto");
    const artistPhotoFallback = document.getElementById("artistPhotoFallback");
    const artistNameEl = document.getElementById("artistName");
    const artistMeta = document.getElementById("artistMeta");
    const artistBio = document.getElementById("artistBio");
    const socialLinkBtn = document.getElementById("socialLinkBtn");
    const editProfileBtn = document.getElementById("editProfileBtn");
    const submitTrackBtn = document.getElementById("submitTrackBtn");

    const artistStatus = document.getElementById("artistStatus");
    const tracksWrap = document.getElementById("tracksWrap");
    const noTracksBox = document.getElementById("noTracksBox");

    let currentMenuAuthMode = "login";
    let currentProfileData = null;
    let currentTrackData = null;
    let viewedArtistUserId = null;
    let currentUserId = null;
    let currentAudio = null;
    let currentAudioButton = null;
    let currentProgressBar = null;
    let currentTimeLabel = null;

    function getArtistUserIdFromUrl() {
      const params = new URLSearchParams(window.location.search);
      return params.get("user_id");
    }

    function setAuthMessage(msg, error = false, target = authMessageEl) {
      if (msg === "Auth session missing!") msg = "";
      target.textContent = msg || "";
      target.style.color = error ? "#ff8a8a" : "#cfcfcf";
    }

    function setArtistStatus(message = "", isError = false) {
      if (!message) {
        artistStatus.classList.add("hidden");
        artistStatus.textContent = "";
        artistStatus.classList.remove("error");
        return;
      }

      artistStatus.classList.remove("hidden");
      artistStatus.textContent = message;
      artistStatus.classList.toggle("error", isError);
    }

    function openSideMenu() {
      sideMenu.classList.add("open");
      sideMenuOverlay.classList.add("open");
      menuBtn.classList.add("active");
      menuBtn.setAttribute("aria-expanded", "true");
      sideMenu.setAttribute("aria-hidden", "false");
      document.body.classList.add("menu-open");
    }

    function closeSideMenu() {
      sideMenu.classList.remove("open");
      sideMenuOverlay.classList.remove("open");
      menuBtn.classList.remove("active");
      menuBtn.setAttribute("aria-expanded", "false");
      sideMenu.setAttribute("aria-hidden", "true");
      document.body.classList.remove("menu-open");
      menuAuthPanel.classList.add("hidden");
      setAuthMessage("", false, menuAuthMessage);
    }

    function openMenuAuthPanel(mode = "login") {
      currentMenuAuthMode = mode;
      menuAuthPanel.classList.remove("hidden");
      menuAuthTitle.textContent = mode === "signup" ? "Sign up" : "Log in";
      setAuthMessage("", false, menuAuthMessage);
      setTimeout(() => menuEmail.focus(), 0);
    }

    function closeHeaderPanels() {
      authBox.classList.add("hidden");
      accountMenu.classList.add("hidden");
    }

    function clearLoginFields() {
      email.value = "";
      password.value = "";
      menuEmail.value = "";
      menuPassword.value = "";
    }

    function setHeaderAvatar(photoUrl, artistName) {
      if (photoUrl) {
        headerAvatarImage.src = photoUrl;
        headerAvatarImage.classList.remove("hidden");
        headerAvatarFallback.classList.add("hidden");
      } else {
        headerAvatarImage.classList.add("hidden");
        headerAvatarFallback.classList.remove("hidden");
        headerAvatarFallback.textContent = (artistName || "A").charAt(0).toUpperCase();
      }
    }

    function applyMenuState(user, profile, track) {
      const isLoggedIn = Boolean(user);
      const hasProfile = Boolean(profile);
      const hasTrack = Boolean(track);

      menuLoginBtn.classList.toggle("hidden", isLoggedIn);
      menuSignupBtn.classList.toggle("hidden", isLoggedIn);
      menuLogoutBtn.classList.toggle("hidden", !isLoggedIn);

      menuCreateProfileLink.classList.toggle("hidden", !isLoggedIn || hasProfile);
      menuEditProfileLink.classList.toggle("hidden", !isLoggedIn || !hasProfile);
      menuArtistPageLink.classList.toggle("hidden", !isLoggedIn || !hasProfile);
      menuSubmitTrackLink.classList.toggle("hidden", !isLoggedIn || !hasProfile);

      if (hasProfile && profile?.user_id) {
        menuArtistPageLink.href = `artist.html?user_id=${encodeURIComponent(profile.user_id)}`;
      } else {
        menuArtistPageLink.href = "#";
      }

      menuSubmitTrackLabel.textContent = hasTrack ? "Edit Your Track" : "Submit Your Track";
    }

    function setLoggedOutHeader() {
      closeHeaderPanels();
      showLoginBtn.classList.remove("hidden");
      headerAvatarBtn.classList.add("hidden");
      headerAvatarImage.classList.add("hidden");
      headerAvatarFallback.classList.add("hidden");
      headerAvatarImage.src = "";
      currentUserId = null;
      currentProfileData = null;
      currentTrackData = null;
      applyMenuState(null, null, null);
    }

    function setLoggedInHeader() {
      authBox.classList.add("hidden");
      menuAuthPanel.classList.add("hidden");
      showLoginBtn.classList.add("hidden");
      headerAvatarBtn.classList.remove("hidden");
    }

    async function loginWithCredentials(emailValue, passwordValue, messageTarget) {
      if (!emailValue || !passwordValue) {
        setAuthMessage("Please enter email and password.", true, messageTarget);
        return false;
      }

      setAuthMessage("", false, messageTarget);

      const { error } = await supabaseClient.auth.signInWithPassword({
        email: emailValue,
        password: passwordValue
      });

      if (error) {
        setAuthMessage(error.message, true, messageTarget);
        return false;
      }

      clearLoginFields();
      return true;
    }

    async function signupWithCredentials(emailValue, passwordValue, messageTarget) {
      if (!emailValue || !passwordValue) {
        setAuthMessage("Please enter email and password.", true, messageTarget);
        return false;
      }

      setAuthMessage("", false, messageTarget);

      const { error } = await supabaseClient.auth.signUp({
        email: emailValue,
        password: passwordValue
      });

      if (error) {
        setAuthMessage(error.message, true, messageTarget);
        return false;
      }

      setAuthMessage("Account created. Check your email.", false, messageTarget);
      return true;
    }

    async function handleLogin() {
      loginBtn.disabled = true;
      signupBtn.disabled = true;

      try {
        const ok = await loginWithCredentials(email.value.trim(), password.value.trim(), authMessageEl);
        if (!ok) return;
        authBox.classList.add("hidden");
      } catch (err) {
        console.error(err);
        setAuthMessage("Login failed. Try again.", true, authMessageEl);
      } finally {
        loginBtn.disabled = false;
        signupBtn.disabled = false;
      }
    }

    async function handleSignup() {
      loginBtn.disabled = true;
      signupBtn.disabled = true;

      try {
        await signupWithCredentials(email.value.trim(), password.value.trim(), authMessageEl);
      } catch (err) {
        console.error(err);
        setAuthMessage("Sign up failed. Try again.", true, authMessageEl);
      } finally {
        loginBtn.disabled = false;
        signupBtn.disabled = false;
      }
    }

    async function handleMenuLogin() {
      menuLoginSubmitBtn.disabled = true;
      menuSignupSubmitBtn.disabled = true;

      try {
        const ok = await loginWithCredentials(menuEmail.value.trim(), menuPassword.value.trim(), menuAuthMessage);
        if (!ok) return;
        closeSideMenu();
      } catch (err) {
        console.error(err);
        setAuthMessage("Login failed. Try again.", true, menuAuthMessage);
      } finally {
        menuLoginSubmitBtn.disabled = false;
        menuSignupSubmitBtn.disabled = false;
      }
    }

    async function handleMenuSignup() {
      menuLoginSubmitBtn.disabled = true;
      menuSignupSubmitBtn.disabled = true;

      try {
        await signupWithCredentials(menuEmail.value.trim(), menuPassword.value.trim(), menuAuthMessage);
      } catch (err) {
        console.error(err);
        setAuthMessage("Sign up failed. Try again.", true, menuAuthMessage);
      } finally {
        menuLoginSubmitBtn.disabled = false;
        menuSignupSubmitBtn.disabled = false;
      }
    }

    async function handleLogout() {
      logoutBtn.disabled = true;
      menuLogoutBtn.disabled = true;

      try {
        const { error } = await supabaseClient.auth.signOut();
        if (error) {
          setAuthMessage(error.message, true, authMessageEl);
          return;
        }

        clearLoginFields();
      } catch (err) {
        console.error(err);
        setAuthMessage("Logout failed. Try again.", true, authMessageEl);
      } finally {
        logoutBtn.disabled = false;
        menuLogoutBtn.disabled = false;
      }
    }

    async function loadCurrentUserState() {
      const { data, error } = await supabaseClient.auth.getSession();
      const user = error ? null : data?.session?.user || null;

      if (!user) {
        setLoggedOutHeader();
        return;
      }

      currentUserId = user.id;

      const profilePromise = supabaseClient
        .from("profiles")
        .select("user_id, artist_name, photo_url, bio, nationality, date_of_birth, social_link, wants_promotions, accepted_terms")
        .eq("user_id", user.id)
        .maybeSingle();

      const trackPromise = supabaseClient
        .from("tracks")
        .select("id, user_id, title, status, created_at")
        .eq("user_id", user.id)
        .order("created_at", { ascending: false })
        .limit(1)
        .maybeSingle();

      const [{ data: profileData }, { data: trackData }] = await Promise.all([profilePromise, trackPromise]);

      currentProfileData = profileData || null;
      currentTrackData = trackData || null;

      setLoggedInHeader();
      setHeaderAvatar(currentProfileData?.photo_url || "", currentProfileData?.artist_name || "A");
      applyMenuState(user, currentProfileData, currentTrackData);
    }

    function formatDate(dateString) {
      if (!dateString) return "";
      const date = new Date(dateString);
      if (Number.isNaN(date.getTime())) return "";
      return date.toLocaleDateString("en-GB", {
        day: "2-digit",
        month: "short",
        year: "numeric"
      });
    }

    function formatTime(seconds) {
      const safe = Math.max(0, Math.floor(seconds || 0));
      const mins = Math.floor(safe / 60);
      const secs = safe % 60;
      return `${mins}:${secs.toString().padStart(2, "0")}`;
    }

    function stopCurrentAudio() {
      if (currentAudio) {
        currentAudio.pause();
        currentAudio.currentTime = 0;
      }

      if (currentAudioButton) {
        currentAudioButton.textContent = "▶";
      }

      if (currentProgressBar) {
        currentProgressBar.style.width = "0%";
      }

      if (currentTimeLabel) {
        currentTimeLabel.textContent = "0:00";
      }

      currentAudio = null;
      currentAudioButton = null;
      currentProgressBar = null;
      currentTimeLabel = null;
    }

    function renderArtistProfile(profile, isOwnPage, hasOwnTrack) {
      const displayName = profile?.artist_name || "Unknown Artist";
      artistNameEl.textContent = displayName;

      if (profile?.photo_url) {
        artistPhoto.src = profile.photo_url;
        artistPhoto.classList.remove("hidden");
        artistPhotoFallback.classList.add("hidden");
      } else {
        artistPhoto.classList.add("hidden");
        artistPhotoFallback.classList.remove("hidden");
        artistPhotoFallback.textContent = displayName.charAt(0).toUpperCase();
      }

      artistMeta.innerHTML = "";
      const metaItems = [];

      if (profile?.nationality) {
        metaItems.push(profile.nationality);
      }

      if (profile?.date_of_birth) {
        metaItems.push(`Born ${formatDate(profile.date_of_birth)}`);
      }

      if (metaItems.length) {
        artistMeta.classList.remove("hidden");
        metaItems.forEach(text => {
          const pill = document.createElement("div");
          pill.className = "meta-pill";
          pill.textContent = text;
          artistMeta.appendChild(pill);
        });
      } else {
        artistMeta.classList.add("hidden");
      }

      if (profile?.bio) {
        artistBio.textContent = profile.bio;
        artistBio.classList.remove("hidden");
      } else {
        artistBio.classList.add("hidden");
        artistBio.textContent = "";
      }

      if (profile?.social_link) {
        socialLinkBtn.href = profile.social_link;
        socialLinkBtn.classList.remove("hidden");
      } else {
        socialLinkBtn.classList.add("hidden");
        socialLinkBtn.href = "#";
      }

      editProfileBtn.classList.toggle("hidden", !isOwnPage || !currentProfileData);

      if (isOwnPage && currentProfileData) {
        submitTrackBtn.classList.remove("hidden");
        submitTrackBtn.textContent = hasOwnTrack ? "Edit Your Track" : "Submit Your Track";
        submitTrackBtn.href = "submit-track.html";
      } else {
        submitTrackBtn.classList.add("hidden");
      }
    }

    function buildTrackCard(track) {
      const card = document.createElement("article");
      card.className = "track-card";

      const createdAtLabel = formatDate(track.created_at);

      card.innerHTML = `
        <div class="track-top">
          <div>
            <div class="track-title">${escapeHtml(track.title || "Untitled Track")}</div>
            <div class="track-subtitle">${escapeHtml(track.artist || "Artist")}</div>
          </div>
          <div class="track-status">Approved</div>
        </div>

        <div class="track-player">
          <div class="player-row">
            <button class="player-btn" type="button" aria-label="Play preview">▶</button>
            <div class="progress-wrap">
              <div class="progress-bar"></div>
            </div>
            <div class="player-time">0:00</div>
          </div>

          <div class="track-meta-row">
            <div class="mini-pill">Preview length: 60 sec</div>
            ${createdAtLabel ? `<div class="mini-pill">Submitted: ${escapeHtml(createdAtLabel)}</div>` : ""}
          </div>
        </div>
      `;

      const playBtn = card.querySelector(".player-btn");
      const progressBar = card.querySelector(".progress-bar");
      const timeLabel = card.querySelector(".player-time");

      const audio = new Audio(track.file_url);
      audio.preload = "metadata";

      function updateUi() {
        const capped = Math.min(audio.currentTime || 0, 60);
        const percent = Math.min((capped / 60) * 100, 100);
        progressBar.style.width = `${percent}%`;
        timeLabel.textContent = formatTime(capped);
      }

      audio.addEventListener("timeupdate", () => {
        if (audio.currentTime >= 60) {
          audio.pause();
          audio.currentTime = 0;
          progressBar.style.width = "0%";
          timeLabel.textContent = "0:00";
          playBtn.textContent = "▶";

          if (currentAudio === audio) {
            currentAudio = null;
            currentAudioButton = null;
            currentProgressBar = null;
            currentTimeLabel = null;
          }
          return;
        }

        updateUi();
      });

      audio.addEventListener("ended", () => {
        progressBar.style.width = "0%";
        timeLabel.textContent = "0:00";
        playBtn.textContent = "▶";

        if (currentAudio === audio) {
          currentAudio = null;
          currentAudioButton = null;
          currentProgressBar = null;
          currentTimeLabel = null;
        }
      });

      audio.addEventListener("pause", () => {
        if (audio.currentTime < 60) {
          playBtn.textContent = "▶";
        }
      });

      playBtn.addEventListener("click", async () => {
        try {
          if (currentAudio && currentAudio !== audio) {
            stopCurrentAudio();
          }

          if (audio.paused) {
            currentAudio = audio;
            currentAudioButton = playBtn;
            currentProgressBar = progressBar;
            currentTimeLabel = timeLabel;

            await audio.play();
            playBtn.textContent = "❚❚";
            updateUi();
          } else {
            audio.pause();
            playBtn.textContent = "▶";
          }
        } catch (err) {
          console.error(err);
          setArtistStatus("Preview could not be played.", true);
        }
      });

      return card;
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    async function loadViewedArtistPage() {
      viewedArtistUserId = getArtistUserIdFromUrl();

      if (!viewedArtistUserId) {
        artistNameEl.textContent = "Artist not found";
        noTracksBox.classList.add("hidden");
        tracksWrap.classList.add("hidden");
        setArtistStatus("No artist user_id was provided in the URL.", true);
        return;
      }

      setArtistStatus("");
      tracksWrap.classList.add("hidden");
      noTracksBox.classList.add("hidden");
      tracksWrap.innerHTML = "";

      const { data: profile, error: profileError } = await supabaseClient
        .from("profiles")
        .select("user_id, artist_name, photo_url, bio, social_link, nationality, date_of_birth")
        .eq("user_id", viewedArtistUserId)
        .maybeSingle();

      if (profileError) {
        artistNameEl.textContent = "Artist not found";
        setArtistStatus("Could not load artist profile: " + profileError.message, true);
        return;
      }

      if (!profile) {
        artistNameEl.textContent = "Artist not found";
        setArtistStatus("This artist profile does not exist.", true);
        return;
      }

      const isOwnPage = Boolean(currentUserId && currentUserId === viewedArtistUserId);
      const hasOwnTrack = Boolean(currentTrackData);
      renderArtistProfile(profile, isOwnPage, hasOwnTrack);

      const { data: approvedTracks, error: tracksError } = await supabaseClient
        .from("tracks")
        .select("id, title, artist, file_url, created_at, status, user_id")
        .eq("user_id", viewedArtistUserId)
        .eq("status", "approved")
        .order("created_at", { ascending: false });

      if (tracksError) {
        setArtistStatus("Could not load approved track: " + tracksError.message, true);
        return;
      }

      if (!approvedTracks || approvedTracks.length === 0) {
        noTracksBox.classList.remove("hidden");
        tracksWrap.classList.add("hidden");
        return;
      }

      tracksWrap.innerHTML = "";
      approvedTracks.forEach(track => {
        tracksWrap.appendChild(buildTrackCard(track));
      });

      tracksWrap.classList.remove("hidden");
      noTracksBox.classList.add("hidden");
    }

    async function refreshWholePage() {
      await loadCurrentUserState();
      await loadViewedArtistPage();
    }

    showLoginBtn.onclick = () => {
      accountMenu.classList.add("hidden");
      closeSideMenu();
      authBox.classList.toggle("hidden");
      setAuthMessage("");
      if (!authBox.classList.contains("hidden")) {
        setTimeout(() => email.focus(), 0);
      }
    };

    headerAvatarBtn.onclick = () => {
      authBox.classList.add("hidden");
      closeSideMenu();
      accountMenu.classList.toggle("hidden");
    };

    menuBtn.onclick = () => {
      authBox.classList.add("hidden");
      accountMenu.classList.add("hidden");
      if (sideMenu.classList.contains("open")) {
        closeSideMenu();
      } else {
        openSideMenu();
      }
    };

    closeMenuBtn.onclick = closeSideMenu;
    sideMenuOverlay.onclick = closeSideMenu;

    menuLoginBtn.onclick = () => {
      authBox.classList.add("hidden");
      accountMenu.classList.add("hidden");
      openMenuAuthPanel("login");
    };

    menuSignupBtn.onclick = () => {
      authBox.classList.add("hidden");
      accountMenu.classList.add("hidden");
      openMenuAuthPanel("signup");
    };

    menuLogoutBtn.onclick = async () => {
      closeSideMenu();
      await handleLogout();
    };

    loginBtn.onclick = handleLogin;
    signupBtn.onclick = handleSignup;
    logoutBtn.onclick = handleLogout;
    menuLoginSubmitBtn.onclick = handleMenuLogin;
    menuSignupSubmitBtn.onclick = handleMenuSignup;

    email.addEventListener("keydown", (e) => {
      if (e.key === "Enter") handleLogin();
    });

    password.addEventListener("keydown", (e) => {
      if (e.key === "Enter") handleLogin();
    });

    menuEmail.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        if (currentMenuAuthMode === "signup") {
          handleMenuSignup();
        } else {
          handleMenuLogin();
        }
      }
    });

    menuPassword.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        if (currentMenuAuthMode === "signup") {
          handleMenuSignup();
        } else {
          handleMenuLogin();
        }
      }
    });

    document.addEventListener("click", (e) => {
      const insideHeaderRight = e.target.closest(".header-right");
      const insideAuthBox = e.target.closest("#authBox");
      const insideSideMenu = e.target.closest("#sideMenu");
      const isLoginButton = e.target.closest("#showLoginBtn");
      const isAvatarButton = e.target.closest("#headerAvatarBtn");
      const isMenuButton = e.target.closest("#menuBtn");

      if (!insideHeaderRight && !insideAuthBox && !isLoginButton && !isAvatarButton) {
        authBox.classList.add("hidden");
        accountMenu.classList.add("hidden");
      }

      if (!insideSideMenu && !isMenuButton) {
        closeSideMenu();
      }
    });

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        authBox.classList.add("hidden");
        accountMenu.classList.add("hidden");
        closeSideMenu();
      }
    });

    supabaseClient.auth.onAuthStateChange(() => {
      refreshWholePage().catch(err => {
        console.error(err);
        setArtistStatus("The page could not be refreshed correctly.", true);
      });
    });

    async function initPage() {
      setArtistStatus("");
      await refreshWholePage();
    }

    initPage().catch(err => {
      console.error("initPage error:", err);
      setArtistStatus("The page could not be loaded correctly.", true);
    });
  </script>
</body>
</html>
