<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- PWA -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#000000" />
  <meta name="mobile-web-app-capable" content="yes" />

  <!-- iOS -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="60 Seconds" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <title>Login — 60 Seconds FM</title>

  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/login.css">
</head>
<body>
  <aside class="desktop-side-nav" aria-label="Desktop navigation">
    <div class="desktop-side-nav-panel">
      <nav class="desktop-side-links">
        <a class="desktop-nav-link" href="index.html" aria-label="Radio">
          <span class="desktop-nav-icon" aria-hidden="true">
            <img src="/icons/radio.png" alt="" />
          </span>
          <span class="desktop-nav-label">Radio</span>
        </a>

        <a id="desktopProfileLink" class="desktop-nav-link hidden" href="join.html" aria-label="Profile">
          <span class="desktop-nav-icon" aria-hidden="true">
            <img src="/icons/profile.png" alt="" />
          </span>
          <span class="desktop-nav-label">Profile</span>
        </a>

        <a id="desktopNotificationsLink" class="desktop-nav-link hidden" href="notifications.html" aria-label="Notifications">
          <span class="desktop-nav-icon" aria-hidden="true">
            <img src="/icons/notifications.png" alt="" />
          </span>
          <span class="desktop-nav-label">Notifications</span>
        </a>

        <a id="desktopTrackLink" class="desktop-nav-link hidden" href="submit-track.html" aria-label="Tune">
          <span class="desktop-nav-icon" aria-hidden="true">
            <img src="/icons/track.png" alt="" />
          </span>
          <span class="desktop-nav-label">Tune</span>
        </a>
      </nav>

      <div class="desktop-side-bottom">
        <a class="desktop-nav-link active" href="login.html" aria-label="Login">
          <span class="desktop-nav-icon" aria-hidden="true">
            <img src="/icons/login.png" alt="" />
          </span>
          <span class="desktop-nav-label">Login</span>
        </a>
      </div>
    </div>
  </aside>

  <div class="mobile-bottom-nav-wrap">
    <nav class="mobile-bottom-nav" aria-label="Mobile navigation">
      <a class="mobile-nav-link" href="index.html" aria-label="Radio">
        <span class="mobile-nav-icon" aria-hidden="true">
          <img src="/icons/radio.png" alt="" />
        </span>
        <span class="mobile-nav-label">Radio</span>
      </a>

      <a id="mobileProfileLink" class="mobile-nav-link hidden" href="join.html" aria-label="Profile">
        <span class="mobile-nav-icon" aria-hidden="true">
          <img src="/icons/profile.png" alt="" />
        </span>
        <span class="mobile-nav-label">Profile</span>
      </a>

      <a id="mobileNotificationsLink" class="mobile-nav-link hidden" href="notifications.html" aria-label="Notifications">
        <span class="mobile-nav-icon" aria-hidden="true">
          <img src="/icons/notifications.png" alt="" />
        </span>
        <span class="mobile-nav-label">Notifications</span>
      </a>

      <a id="mobileTrackLink" class="mobile-nav-link hidden" href="submit-track.html" aria-label="Tune">
        <span class="mobile-nav-icon" aria-hidden="true">
          <img src="/icons/track.png" alt="" />
        </span>
        <span class="mobile-nav-label">Tune</span>
      </a>

      <a class="mobile-nav-link active" href="login.html" aria-label="Login">
        <span class="mobile-nav-icon" aria-hidden="true">
          <img src="/icons/login.png" alt="" />
        </span>
        <span class="mobile-nav-label">Login</span>
      </a>
    </nav>
  </div>

  <div class="header-wrap">
    <header class="header-bar">
      <div class="header-left">
        <div id="currencyBadge" class="currency-badge hidden" aria-label="Seconds balance">
          <img src="coin.png" alt="" class="currency-badge-icon" />
          <span id="currencyValue" class="currency-badge-value">0</span>
        </div>
      </div>

      <div class="header-center">
        <a href="index.html" class="header-logo-link" aria-label="60 Seconds FM home">
          <img src="logo.png" alt="60 Seconds FM" class="header-logo" />
        </a>
      </div>

      <div class="header-right"></div>
    </header>
  </div>

  <div class="site-shell">
    <main class="auth-page">
      <section class="auth-card" aria-labelledby="loginTitle">
        <div id="authKicker" class="auth-kicker">Member Access</div>
        <h1 id="loginTitle" class="auth-title">Login</h1>
        <p id="authSubtitle" class="auth-subtitle">
          Sign in to manage your profile, upload your tune, and access your 60 Seconds FM account.
        </p>

        <form method="post" id="loginForm" class="auth-form" method="post" novalidate>
          <div class="field-group">
            <label class="field-label" for="email">Email</label>
            <input
              id="email"
              name="email"
              class="field-input"
              type="email"
              inputmode="email"
              autocomplete="email"
              placeholder="you@example.com"
              required
            />
          </div>

          <div class="field-group">
            <label class="field-label" for="password">Password</label>
            <input
              id="password"
              name="password"
              class="field-input"
              type="password"
              autocomplete="current-password"
              placeholder="Enter your password"
              required
            />
          </div>

          <div id="feedback" class="auth-feedback" aria-live="polite"></div>

          <button id="loginButton" class="auth-button" type="submit">
            Login
          </button>
        </form>

        <div class="auth-social-divider" aria-hidden="true">
          <span>or continue with</span>
        </div>

        <div class="auth-social-grid" aria-label="Social login options">
          <button id="googleAuthButton" class="auth-social-button" type="button" data-provider="google">
            <span class="auth-social-icon" aria-hidden="true">G</span>
            <span class="auth-social-label">Continue with Google</span>
          </button>
        </div>

        <div class="auth-links">
          <div id="authSecondaryText" class="auth-secondary">No account yet?</div>
          <button id="authModeToggle" class="auth-link" type="button">Sign up</button>
          <a class="auth-link" href="index.html">Back to Radio</a>
        </div>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/login.js"></script>
  <script src="assets/js/radio-mini-player.js"></script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js');
      });
    }
  </script>
</body>
</html>
