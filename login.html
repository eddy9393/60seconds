<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — 60 Seconds FM</title>

  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/login.css">
</head>
<body>
  <script>
/**
 * nav-component.js
 * Injecteert de desktop- en mobiele navigatie in elke pagina.
 * Staat als eerste <script> in <body>, vóór app.js.
 *
 * Wil je een item toevoegen/verwijderen/hernoemen?
 * Pas alleen NAV_ITEMS hieronder aan — verder niets.
 */

(function () {

  // ─── Navigatie-items ────────────────────────────────────────────────────────
  const NAV_ITEMS = [
    {
      id:    'Radio',
      href:  'index.html',
      label: 'Radio',
      icon:  'radio.png',
    },
    {
      id:     'Profile',
      href:   'join.html',
      label:  'Profile',
      icon:   'profile.png',
      hidden: true,
    },
    {
      id:     'Notifications',
      href:   'notifications.html',
      label:  'Notifications',
      icon:   'nonotifications.png',
      hidden: true,
    },
    {
      id:     'Liked',
      href:   'liked.html',
      label:  'Liked',
      icon:   'like.png',
      hidden: true,
    },
    {
      id:          'Stats',
      href:        'statistics.html',
      label:       'Statistics',
      icon:        'stats.png',
      hidden:      true,
      desktopOnly: true,
    },
    {
      id:          'Track',
      href:        'submit-track.html',
      label:       'Tune',
      icon:        'track.png',
      hidden:      true,
      desktopOnly: true,
    },
    // ── Onderin de desktop-zijbalk ───────────────────────────────────────────
    {
      id:       'Login',
      href:     'login.html',
      label:    'Login',
      icon:     'login.png',
      position: 'bottom',
    },
    {
      id:       'Logout',
      label:    'Logout',
      icon:     'logout.png',
      hidden:   true,
      type:     'button',
      position: 'bottom',
    },
  ];

  // ─── Helpers ────────────────────────────────────────────────────────────────

  const currentPage = (window.location.pathname.split('/').pop() || 'index.html').toLowerCase();

  function isActive(href) {
    return href && href.toLowerCase() === currentPage;
  }

  function iconMask(iconFile) {
    return `<span class="nav-icon-mask" style="--icon-url: url('/icons/${iconFile}');"></span>`;
  }

  // ─── Desktop item ───────────────────────────────────────────────────────────

  function desktopItem(item) {
    const active = isActive(item.href) ? ' active' : '';
    const hidden = item.hidden ? ' hidden' : '';
    const id     = item.id ? ` id="desktop${item.id}${item.type === 'button' ? 'Btn' : 'Link'}"` : '';
    const inner  = `
          <span class="desktop-nav-icon" aria-hidden="true">${iconMask(item.icon)}</span>
          <span class="desktop-nav-label">${item.label}</span>`;

    if (item.type === 'button') {
      return `<button${id} class="desktop-nav-button${hidden}" type="button" aria-label="${item.label}">${inner}
        </button>`;
    }
    return `<a${id} class="desktop-nav-link${active}${hidden}" href="${item.href}" aria-label="${item.label}">${inner}
        </a>`;
  }

  // ─── Mobiel item ────────────────────────────────────────────────────────────

  function mobileItem(item) {
    const active = isActive(item.href) ? ' active' : '';
    const hidden = item.hidden ? ' hidden' : '';
    const id     = item.id ? ` id="mobile${item.id}Link"` : '';

    return `<a${id} class="mobile-nav-link${active}${hidden}" href="${item.href}" aria-label="${item.label}">
        <span class="mobile-nav-icon" aria-hidden="true">${iconMask(item.icon)}</span>
        <span class="mobile-nav-label">${item.label}</span>
      </a>`;
  }

  // ─── HTML opbouwen ──────────────────────────────────────────────────────────

  const mainItems   = NAV_ITEMS.filter(i => i.position !== 'bottom');
  const bottomItems = NAV_ITEMS.filter(i => i.position === 'bottom');

  // Mobiel: geen desktopOnly items, geen buttons — login wel meenemen
  const mobileItems = [
    ...NAV_ITEMS.filter(i => i.position !== 'bottom' && !i.desktopOnly && i.type !== 'button'),
    ...NAV_ITEMS.filter(i => i.id === 'Login'),
  ];

  const desktopHTML = `<aside class="desktop-side-nav" aria-label="Desktop navigation">
    <div class="desktop-side-nav-panel">
      <nav class="desktop-side-links">
        ${mainItems.map(desktopItem).join('
        ')}
      </nav>
      <div class="desktop-side-bottom">
        ${bottomItems.map(desktopItem).join('
        ')}
      </div>
    </div>
  </aside>`;

  const mobileHTML = `<div class="mobile-bottom-nav-wrap">
    <nav class="mobile-bottom-nav" aria-label="Mobile navigation">
      ${mobileItems.map(mobileItem).join('
      ')}
    </nav>
  </div>`;

  // ─── Injecteren via currentScript (werkt synchroon, geen document.write) ───
  // currentScript verwijst naar dit <script> element terwijl het wordt geparsed.
  // insertAdjacentHTML('beforebegin') plaatst de nav-HTML vlak vóór het script-element,
  // zodat de DOM-elementen bestaan voordat app.js ze opzoekt via getElementById.

  var self = document.currentScript;
  if (self) {
    self.insertAdjacentHTML('beforebegin', desktopHTML + mobileHTML);
  } else {
    // Fallback voor oude browsers: toevoegen aan het begin van <body>
    document.body.insertAdjacentHTML('afterbegin', desktopHTML + mobileHTML);
  }

})();

  </script>

  <div class="header-wrap">
    <header class="header-bar">
      <div class="header-left">
        <div id="currencyBadge" class="currency-badge hidden" aria-label="Seconds balance">
          <img src="coin.png" alt="" class="currency-badge-icon" />
          <span id="currencyValue" class="currency-badge-value">0</span>
        </div>
      </div>

      <div class="header-center">
        <a href="index.html" class="header-logo-link" aria-label="60 Seconds FM home">
          <img src="logo.png" alt="60 Seconds FM" class="header-logo" />
        </a>
      </div>

      <div class="header-right"></div>
    </header>
  </div>

  <div class="site-shell">
    <main class="auth-page">
      <section class="auth-card" aria-labelledby="loginTitle">
        <div id="authKicker" class="auth-kicker">Member Access</div>
        <h1 id="loginTitle" class="auth-title">Login</h1>
        <p id="authSubtitle" class="auth-subtitle">
          Sign in to manage your profile, upload your tune, and access your 60 Seconds FM account.
        </p>

        <form method="post" id="loginForm" class="auth-form" method="post" novalidate>
          <div class="field-group">
            <label class="field-label" for="email">Email</label>
            <input
              id="email"
              name="email"
              class="field-input"
              type="email"
              inputmode="email"
              autocomplete="email"
              placeholder="you@example.com"
              required
            />
          </div>

          <div class="field-group">
            <label class="field-label" for="password">Password</label>
            <input
              id="password"
              name="password"
              class="field-input"
              type="password"
              autocomplete="current-password"
              placeholder="Enter your password"
              required
            />
          </div>

          <div id="feedback" class="auth-feedback" aria-live="polite"></div>

          <button id="loginButton" class="auth-button" type="submit">
            Login
          </button>
        </form>

        <div class="auth-social-divider" aria-hidden="true">
          <span>or continue with</span>
        </div>

        <div class="auth-social-grid" aria-label="Social login options">
          <button id="googleAuthButton" class="auth-social-button" type="button" data-provider="google">
            <span class="auth-social-icon" aria-hidden="true">G</span>
            <span class="auth-social-label">Continue with Google</span>
          </button>
        </div>

        <div class="auth-links">
          <div id="authSecondaryText" class="auth-secondary">No account yet?</div>
          <button id="authModeToggle" class="auth-link" type="button">Sign up</button>
          <a class="auth-link" href="index.html">Back to Radio</a>
        </div>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/login.js"></script>
  <script src="assets/js/radio-mini-player.js"></script>
</body>
</html>
