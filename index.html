<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>60seconds.fm</title>

  <style>
    body {
      margin: 0;
      background: #0b0b0b;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 30px 20px;
    }

    h1 {
      color: gold;
      margin-bottom: 10px;
    }

    .card {
      background: #151515;
      border-radius: 20px;
      padding: 24px;
      max-width: 560px;
      margin: 20px auto;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 10px;
      border-radius: 10px;
      border: none;
      box-sizing: border-box;
    }

    button {
      padding: 12px 18px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      margin: 5px;
      font-weight: bold;
    }

    .gold {
      background: gold;
      color: black;
    }

    .outline {
      background: transparent;
      border: 1px solid gold;
      color: gold;
    }

    #status {
      margin-top: 15px;
      min-height: 20px;
      color: #ddd;
      white-space: pre-wrap;
      word-break: break-word;
    }

    #debug {
      font-size: 12px;
      color: #888;
      margin-top: 5px;
      min-height: 16px;
    }

    .hidden {
      display: none;
    }

    .nav-link {
      display: inline-block;
      margin-top: 10px;
      color: gold;
      text-decoration: none;
      border: 1px solid rgba(255, 215, 0, 0.4);
      padding: 10px 16px;
      border-radius: 999px;
    }

    .progress {
      height: 8px;
      background: #333;
      border-radius: 999px;
      overflow: hidden;
      margin: 14px 0;
    }

    .fill {
      height: 100%;
      width: 0%;
      background: gold;
    }

    .small {
      font-size: 13px;
      color: #999;
    }

    .artist-link {
      color: gold;
      text-decoration: none;
      border-bottom: 1px solid rgba(255, 215, 0, 0.35);
    }

    .artist-link:hover {
      opacity: 0.85;
    }
  </style>
</head>
<body>

  <h1>60seconds.fm</h1>
  <a class="nav-link" href="join.html">Join 60seconds</a>
  <a class="nav-link" href="admin.html">Admin</a>

  <div class="card">
    <div id="authBox">
      <h2>Sign up / Log in</h2>
      <input id="email" type="email" placeholder="Email" />
      <input id="password" type="password" placeholder="Password" />

      <button id="signup" class="gold" type="button">Sign up</button>
      <button id="login" class="outline" type="button">Log in</button>
    </div>

    <div id="userBox" class="hidden">
      <p id="userText"></p>
      <button id="logout" class="gold" type="button">Log out</button>
    </div>

    <div id="status">Ready</div>
    <div id="debug"></div>
  </div>

  <div class="card">
    <button id="start" class="gold" type="button">Start Radio</button>

    <div id="player" class="hidden">
      <h2 id="title">-</h2>
      <p id="artistWrap"><span id="artist">-</span></p>
      <p id="sourceLabel" class="small"></p>

      <div class="progress">
        <div class="fill" id="progress"></div>
      </div>

      <button id="skip" type="button">Skip</button>
      <br /><br />
      <input id="volume" type="range" min="0" max="1" step="0.01" value="0.8" />
    </div>
  </div>

  <audio id="audio"></audio>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const statusEl = document.getElementById("status");
    const debugEl = document.getElementById("debug");

    function setStatus(msg, error = false) {
      statusEl.textContent = msg;
      statusEl.style.color = error ? "#ff8a8a" : "#ddd";
      console.log(msg);
    }

    function setDebug(msg) {
      debugEl.textContent = msg;
      console.log("DEBUG:", msg);
    }

    if (!window.supabase) {
      setStatus("Supabase not loaded", true);
      throw new Error("Supabase missing");
    }

    const supabaseClient = window.supabase.createClient(
      "https://rgoutegbcpjytplqcwze.supabase.co",
      "sb_publishable_255qyDKS77nMU0pbedfa_A_3hdgtEHh"
    );

    setDebug("Supabase ready");

    // AUTH
    const email = document.getElementById("email");
    const password = document.getElementById("password");
    const signupBtn = document.getElementById("signup");
    const loginBtn = document.getElementById("login");
    const logoutBtn = document.getElementById("logout");
    const authBox = document.getElementById("authBox");
    const userBox = document.getElementById("userBox");
    const userText = document.getElementById("userText");

    async function updateUser() {
      const { data, error } = await supabaseClient.auth.getUser();

      if (error) {
        setStatus(error.message, true);
        return;
      }

      if (data.user) {
        authBox.classList.add("hidden");
        userBox.classList.remove("hidden");
        userText.textContent = "Logged in as " + data.user.email;
      } else {
        authBox.classList.remove("hidden");
        userBox.classList.add("hidden");
      }
    }

    signupBtn.onclick = async () => {
      const emailValue = email.value.trim();
      const passwordValue = password.value.trim();

      if (!emailValue || !passwordValue) {
        setStatus("Please enter email and password.", true);
        return;
      }

      setStatus("Creating account...");

      const { error } = await supabaseClient.auth.signUp({
        email: emailValue,
        password: passwordValue
      });

      if (error) {
        setStatus(error.message, true);
      } else {
        setStatus("Account created. Check your email.");
        updateUser();
      }
    };

    loginBtn.onclick = async () => {
      const emailValue = email.value.trim();
      const passwordValue = password.value.trim();

      if (!emailValue || !passwordValue) {
        setStatus("Please enter email and password.", true);
        return;
      }

      setStatus("Logging in...");

      const { error } = await supabaseClient.auth.signInWithPassword({
        email: emailValue,
        password: passwordValue
      });

      if (error) {
        setStatus(error.message, true);
      } else {
        setStatus("Logged in!");
        updateUser();
      }
    };

    logoutBtn.onclick = async () => {
      await supabaseClient.auth.signOut();
      setStatus("Logged out");
      updateUser();
    };

    updateUser();

    // RADIO
    const fallbackTracks = [
      { title: "Is It Me", artist: "Eddy Donato", file_url: "track1.mp3", source: "Local fallback", user_id: null },
      { title: "ff in me vibe", artist: "EARV", file_url: "track2.mp3", source: "Local fallback", user_id: null },
      { title: "Hitte In De Toko", artist: "EARV", file_url: "track3.mp3", source: "Local fallback", user_id: null }
    ];

    let tracks = [];
    let current = -1;

    const audio = document.getElementById("audio");
    const startBtn = document.getElementById("start");
    const player = document.getElementById("player");
    const titleEl = document.getElementById("title");
    const artistWrapEl = document.getElementById("artistWrap");
    const sourceLabelEl = document.getElementById("sourceLabel");
    const skipBtn = document.getElementById("skip");
    const volume = document.getElementById("volume");
    const progressFill = document.getElementById("progress");

    async function loadTracksFromSupabase() {
      setDebug("Loading approved tracks from Supabase...");

      const { data, error } = await supabaseClient
        .from("tracks")
        .select("id, title, artist, file_url, user_id, status, created_at")
        .eq("status", "approved")
        .order("created_at", { ascending: false });

      if (error) {
        setDebug("Supabase read failed, using fallback");
        console.error(error);
        tracks = fallbackTracks;
        return;
      }

      if (!data || data.length === 0) {
        setDebug("No approved tracks found, using fallback");
        tracks = fallbackTracks;
        return;
      }

      tracks = data.map(track => ({
        title: track.title,
        artist: track.artist,
        file_url: track.file_url,
        user_id: track.user_id || null,
        source: "Supabase approved"
      }));

      setDebug(`Loaded ${tracks.length} approved track(s) from Supabase`);
    }

    function renderArtist(track) {
      if (track.user_id) {
        artistWrapEl.innerHTML = `
          <a class="artist-link" href="artist.html?user_id=${encodeURIComponent(track.user_id)}">
            ${escapeHtml(track.artist)}
          </a>
        `;
      } else {
        artistWrapEl.innerHTML = `<span id="artist">${escapeHtml(track.artist)}</span>`;
      }
    }

    function nextTrack() {
      if (!tracks.length) {
        setStatus("No tracks available yet.", true);
        return;
      }

      let next;
      do {
        next = Math.floor(Math.random() * tracks.length);
      } while (tracks.length > 1 && next === current);

      current = next;
      const t = tracks[current];

      titleEl.textContent = t.title;
      renderArtist(t);
      sourceLabelEl.textContent = t.source || "";
      audio.src = t.file_url;
      audio.currentTime = 0;
      progressFill.style.width = "0%";

      audio.play().catch(err => {
        console.log("Audio play blocked:", err);
      });
    }

    startBtn.onclick = async () => {
      startBtn.disabled = true;
      startBtn.textContent = "Loading...";

      await loadTracksFromSupabase();

      player.classList.remove("hidden");
      nextTrack();

      startBtn.textContent = "Start Radio";
      startBtn.disabled = false;
    };

    skipBtn.onclick = nextTrack;

    audio.addEventListener("timeupdate", () => {
      const max = 60;
      const t = Math.min(audio.currentTime, max);
      progressFill.style.width = (t / max * 100) + "%";

      if (audio.currentTime >= max) {
        nextTrack();
      }
    });

    audio.addEventListener("ended", () => {
      nextTrack();
    });

    volume.oninput = e => {
      audio.volume = e.target.value;
    };

    audio.volume = 0.8;

    function escapeHtml(str) {
      return String(str || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }
  </script>
</body>
</html>
