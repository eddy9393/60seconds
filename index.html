<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>60seconds.fm</title>

<style>
:root {
  --bg: #0b0b0b;
  --panel: #151515;
  --panel-2: #1b1b1b;
  --text: #f5f1e8;
  --muted: #b9b0a0;
  --gold: #caa55b;
  --line: rgba(202, 165, 91, 0.22);
}

body {
  margin: 0;
  background: #0b0b0b;
  color: var(--text);
  font-family: Georgia, serif;
}

.container {
  width: min(1100px, calc(100% - 32px));
  margin: 0 auto;
}

.nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 24px 0;
}

.brand {
  color: var(--gold);
  font-size: 26px;
  font-weight: bold;
}

.nav-btn {
  text-decoration: none;
  color: var(--gold);
  border: 1px solid var(--line);
  padding: 10px 16px;
  border-radius: 999px;
}

.hero {
  text-align: center;
  margin-top: 40px;
}

.hero h1 {
  color: var(--gold);
  font-size: 50px;
}

.radio {
  margin: 60px auto;
  max-width: 500px;
  background: var(--panel);
  border-radius: 24px;
  padding: 30px;
  text-align: center;
}

.hidden {
  display: none;
}

.start-btn {
  background: var(--gold);
  border: none;
  padding: 16px 24px;
  font-weight: bold;
  cursor: pointer;
  border-radius: 999px;
}

.track-title {
  font-size: 26px;
}

.artist {
  color: var(--gold);
}

.controls button {
  margin: 10px;
  padding: 10px 20px;
  cursor: pointer;
}

.progress {
  height: 8px;
  background: #333;
  margin: 10px 0;
}

.progress-fill {
  height: 100%;
  width: 0%;
  background: gold;
}

.volume {
  width: 100%;
}
</style>
</head>

<body>

<div class="container">

<div class="nav">
  <div class="brand">60seconds.fm</div>
  <a href="join.html" class="nav-btn">Join 60seconds</a>
</div>

<div class="hero">
  <h1>Discover music in 60 seconds</h1>
</div>

<div class="radio">

  <div id="startScreen">
    <p>Ready to discover new music?</p>
    <button class="start-btn" id="startBtn">Start Radio</button>
  </div>

  <div id="player" class="hidden">
    <div class="track-title" id="trackTitle"></div>
    <div class="artist" id="artist"></div>

    <div id="time">0:00 / 1:00</div>

    <div class="progress">
      <div class="progress-fill" id="progressFill"></div>
    </div>

    <div class="controls">
      <button id="likeBtn">♡ Like</button>
      <button id="skipBtn">Skip ⏭</button>
    </div>

    <input type="range" id="volume" class="volume" min="0" max="1" step="0.01" value="0.8">
  </div>

</div>

</div>

<audio id="audio"></audio>

<script>
const MAX = 60;

const tracks = [
  { title: "Is It Me", artist: "Eddy Donato", file: "track1.mp3" },
  { title: "ff in me vibe", artist: "EARV", file: "track2.mp3" },
  { title: "Hitte In De Toko", artist: "EARV", file: "track3.mp3" }
];

let current = -1;

const audio = document.getElementById("audio");
const startBtn = document.getElementById("startBtn");
const startScreen = document.getElementById("startScreen");
const player = document.getElementById("player");

const title = document.getElementById("trackTitle");
const artist = document.getElementById("artist");
const progress = document.getElementById("progressFill");
const time = document.getElementById("time");
const volume = document.getElementById("volume");

function rand() {
  let i;
  do {
    i = Math.floor(Math.random() * tracks.length);
  } while (i === current);
  return i;
}

function load() {
  current = rand();
  const t = tracks[current];
  title.textContent = t.title;
  artist.textContent = t.artist;
  audio.src = t.file;
  audio.load();
}

function next() {
  load();
}

startBtn.onclick = () => {
  startScreen.classList.add("hidden");
  player.classList.remove("hidden");
  load();
};

audio.onloadedmetadata = () => {
  audio.currentTime = 0;
  audio.play();
};

audio.ontimeupdate = () => {
  let t = Math.min(audio.currentTime, MAX);
  progress.style.width = (t / MAX * 100) + "%";
  time.textContent = Math.floor(t/60)+":"+(Math.floor(t%60)).toString().padStart(2,"0")+" / 1:00";

  if (audio.currentTime >= MAX) next();
};

audio.onended = next;

document.getElementById("skipBtn").onclick = next;

volume.oninput = e => {
  audio.volume = e.target.value;
};

audio.volume = 0.8;
</script>

</body>
