<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>60seconds.fm</title>

<style>
body {
  margin: 0;
  background: #0b0b0b;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

.container {
  max-width: 800px;
  margin: auto;
  padding: 20px;
}

h1 {
  color: gold;
}

.card {
  background: #151515;
  padding: 25px;
  border-radius: 20px;
  margin-top: 20px;
}

button {
  padding: 12px 20px;
  border-radius: 999px;
  border: none;
  cursor: pointer;
  margin: 5px;
}

.gold {
  background: gold;
  color: black;
  font-weight: bold;
}

.outline {
  border: 1px solid gold;
  background: transparent;
  color: gold;
}

input {
  width: 100%;
  padding: 10px;
  margin-bottom: 10px;
  border-radius: 10px;
  border: none;
}

.progress {
  height: 8px;
  background: #333;
  margin: 10px 0;
}

.fill {
  height: 100%;
  width: 0%;
  background: gold;
}
</style>
</head>

<body>

<div class="container">

<h1>60seconds.fm</h1>

<!-- AUTH -->
<div class="card">
  <div id="loggedOut">
    <h3>Join 60seconds</h3>
    <input id="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">

    <button class="gold" id="signup">Sign up</button>
    <button class="outline" id="login">Log in</button>
  </div>

  <div id="loggedIn" style="display:none;">
    <p id="user"></p>
    <button class="gold" id="logout">Log out</button>
  </div>

  <p id="status"></p>
</div>

<!-- RADIO -->
<div class="card">

  <div id="startScreen">
    <button class="gold" id="start">Start Radio</button>
  </div>

  <div id="player" style="display:none;">
    <h2 id="title"></h2>
    <p id="artist"></p>

    <div class="progress">
      <div class="fill" id="progress"></div>
    </div>

    <button id="skip">Skip</button>

    <br><br>
    <input type="range" id="volume" min="0" max="1" step="0.01">
  </div>

</div>

</div>

<audio id="audio"></audio>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
// 🔑 SUPABASE (JOUW GEGEVENS)
const supabase = window.supabase.createClient(
  "https://rgoutegbcpjytplqcwze.supabase.co",
  "sb_publishable_255qyDKS77nMU0pbedfa_A_3hdgtEHh"
);

// AUTH ELEMENTS
const email = document.getElementById("email");
const password = document.getElementById("password");
const status = document.getElementById("status");

const loggedOut = document.getElementById("loggedOut");
const loggedIn = document.getElementById("loggedIn");
const userText = document.getElementById("user");

// AUTH STATE
async function updateUser() {
  const { data } = await supabase.auth.getUser();

  if (data.user) {
    loggedOut.style.display = "none";
    loggedIn.style.display = "block";
    userText.textContent = "Logged in as " + data.user.email;
  } else {
    loggedOut.style.display = "block";
    loggedIn.style.display = "none";
  }
}

// SIGN UP
document.getElementById("signup").onclick = async () => {
  const { error } = await supabase.auth.signUp({
    email: email.value,
    password: password.value
  });

  status.textContent = error ? error.message : "Check your email to confirm!";
};

// LOGIN
document.getElementById("login").onclick = async () => {
  const { error } = await supabase.auth.signInWithPassword({
    email: email.value,
    password: password.value
  });

  status.textContent = error ? error.message : "Logged in!";
  updateUser();
};

// LOGOUT
document.getElementById("logout").onclick = async () => {
  await supabase.auth.signOut();
  updateUser();
};

updateUser();

// RADIO
const tracks = [
  { title: "Is It Me", artist: "Eddy Donato", file: "track1.mp3" },
  { title: "ff in me vibe", artist: "EARV", file: "track2.mp3" },
  { title: "Hitte In De Toko", artist: "EARV", file: "track3.mp3" }
];

let current = -1;
const audio = document.getElementById("audio");

function nextTrack() {
  current = Math.floor(Math.random() * tracks.length);
  const t = tracks[current];

  document.getElementById("title").textContent = t.title;
  document.getElementById("artist").textContent = t.artist;

  audio.src = t.file;
  audio.play();
}

document.getElementById("start").onclick = () => {
  document.getElementById("startScreen").style.display = "none";
  document.getElementById("player").style.display = "block";
  nextTrack();
};

document.getElementById("skip").onclick = nextTrack;

audio.ontimeupdate = () => {
  const max = 60;
  const t = Math.min(audio.currentTime, max);
  document.getElementById("progress").style.width = (t/max*100)+"%";

  if (audio.currentTime >= max) nextTrack();
};

document.getElementById("volume").oninput = e => {
  audio.volume = e.target.value;
};

audio.volume = 0.8;
</script>

</body>
</html>
