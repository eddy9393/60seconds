<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>60 Seconds FM</title>

  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --gold: #d4af37;
      --gold-2: #f4d77a;
      --gold-dark: #8f6b13;
      --text: #f5f5f5;
      --muted: #a8a8a8;
      --top-btn-height: 52px;

      --fs-label: 12px;
      --fs-body: 14px;
      --fs-artist: 18px;
      --fs-stat-label: 12px;
      --fs-stat-value: clamp(26px, 4vw, 34px);
      --fs-track-title: clamp(30px, 5vw, 48px);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(180deg, rgba(7, 7, 7, 0.48) 0%, rgba(7, 7, 7, 0.72) 45%, rgba(7, 7, 7, 0.82) 100%),
        radial-gradient(circle at top, rgba(212, 175, 55, 0.14), transparent 30%),
        url("bg-mobile-final-1080x1920.webp");
      background-size: cover, auto, cover;
      background-position: center top, center top, center center;
      background-repeat: no-repeat, no-repeat, no-repeat;
      background-attachment: fixed, scroll, fixed;
      color: var(--text);
      font-family: 'Manrope', sans-serif;
      text-align: center;
      padding: 0 18px 44px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body.menu-open {
      overflow: hidden;
    }

    h1, h2, h3 {
      font-family: 'Space Grotesk', sans-serif;
    }

    .hidden {
      display: none !important;
    }

    .site-shell {
      max-width: 1180px;
      margin: 0 auto;
      padding-top: 8px;
    }

    .header-wrap {
      position: sticky;
      top: 0;
      z-index: 80;
      width: 100%;
      background: linear-gradient(180deg, rgba(0,0,0,0.74), rgba(0,0,0,0.42) 70%, rgba(0,0,0,0));
      backdrop-filter: blur(6px);
    }

    .header-bar {
      width: 100%;
      min-height: 74px;
      display: grid;
      grid-template-columns: 60px 1fr 60px;
      align-items: center;
      gap: 10px;
      padding: 8px 16px 4px;
      position: relative;
    }

    .header-left,
    .header-center,
    .header-right {
      display: flex;
      align-items: center;
      min-width: 0;
    }

    .header-left {
      justify-content: flex-start;
    }

    .header-center {
      justify-content: center;
      pointer-events: none;
    }

    .header-center > * {
      pointer-events: auto;
    }

    .header-right {
      justify-content: flex-end;
      position: relative;
    }

    .header-logo-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
    }

    .header-logo {
      display: block;
      width: min(288px, 45vw);
      height: auto;
      filter:
        drop-shadow(0 8px 18px rgba(0, 0, 0, 0.35))
        drop-shadow(0 0 20px rgba(212, 175, 55, 0.08));
    }

    .header-icon-btn {
      width: 42px;
      height: 42px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.14);
      background:
        linear-gradient(180deg, rgba(255,255,255,0.12), rgba(255,255,255,0.04)),
        linear-gradient(180deg, rgba(10,10,10,0.86), rgba(10,10,10,0.92));
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.08),
        0 10px 22px rgba(0,0,0,0.24);
      backdrop-filter: blur(4px);
      transition: transform 0.14s ease, box-shadow 0.14s ease, filter 0.14s ease;
      padding: 0;
    }

    .header-icon-btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.03);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.10),
        0 14px 24px rgba(0,0,0,0.28);
    }

    .menu-icon {
      position: relative;
      width: 20px;
      height: 16px;
      transition: transform 0.2s ease;
    }

    .menu-icon span {
      position: absolute;
      left: 0;
      width: 20px;
      height: 3px;
      border-radius: 999px;
      background: #f5f5f5;
      box-shadow: 0 1px 8px rgba(0,0,0,0.26);
      transition: transform 0.18s ease, opacity 0.18s ease, top 0.18s ease;
    }

    .menu-icon span:nth-child(1) { top: 0; }
    .menu-icon span:nth-child(2) { top: 6px; }
    .menu-icon span:nth-child(3) { top: 12px; }

    .header-icon-btn.active .menu-icon span:nth-child(1) {
      top: 6px;
      transform: rotate(45deg);
    }

    .header-icon-btn.active .menu-icon span:nth-child(2) {
      opacity: 0;
    }

    .header-icon-btn.active .menu-icon span:nth-child(3) {
      top: 6px;
      transform: rotate(-45deg);
    }

    .person-icon {
      position: relative;
      width: 22px;
      height: 22px;
    }

    .person-icon::before,
    .person-icon::after {
      content: "";
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      border: 2.2px solid #f5f5f5;
      box-sizing: border-box;
    }

    .person-icon::before {
      top: 0;
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }

    .person-icon::after {
      bottom: -1px;
      width: 21px;
      height: 11px;
      border-top-left-radius: 16px;
      border-top-right-radius: 16px;
      border-bottom: 0;
    }

    .header-avatar-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      padding: 0;
      overflow: hidden;
      border: 2px solid rgba(212,175,55,0.55);
      background: #111;
      box-shadow:
        0 10px 22px rgba(0,0,0,0.24),
        0 0 0 3px rgba(212,175,55,0.08);
      cursor: pointer;
    }

    .header-avatar-btn img,
    .header-avatar-btn .header-avatar-fallback {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      display: block;
      object-fit: cover;
    }

    .header-avatar-fallback {
      display: flex !important;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #3a2d0d, #a98325);
      color: #fff;
      font-weight: 700;
      font-size: 15px;
      font-family: 'Space Grotesk', sans-serif;
    }

    .account-menu {
      position: absolute;
      top: 52px;
      right: 0;
      min-width: 210px;
      padding: 10px;
      border-radius: 18px;
      background:
        linear-gradient(180deg, rgba(20,20,20,0.96), rgba(10,10,10,0.98));
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow:
        0 18px 40px rgba(0,0,0,0.38),
        inset 0 1px 0 rgba(255,255,255,0.04);
      backdrop-filter: blur(8px);
      z-index: 90;
    }

    .account-menu-actions {
      display: grid;
      gap: 8px;
    }

    .account-menu-link,
    .account-menu button {
      width: 100%;
      text-decoration: none;
      text-align: center;
    }

    .auth-box.compact-auth {
      position: absolute;
      top: 52px;
      right: 0;
      width: 250px;
      text-align: left;
      margin: 0;
      padding: 10px;
      border-radius: 18px;
      background:
        linear-gradient(180deg, rgba(20,20,20,0.96), rgba(10,10,10,0.98));
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow:
        0 18px 40px rgba(0,0,0,0.38),
        inset 0 1px 0 rgba(255,255,255,0.04);
      backdrop-filter: blur(8px);
      z-index: 90;
    }

    .compact-auth h3 {
      margin: 0 0 10px;
      color: var(--gold);
      font-size: 13px;
      font-weight: 700;
      text-align: center;
      font-family: 'Space Grotesk', sans-serif;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .compact-auth .auth-inputs {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      margin-bottom: 8px;
    }

    .compact-auth input {
      width: 100%;
      padding: 10px 11px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.08);
      background: linear-gradient(180deg, rgba(16,16,16,0.92) 0%, rgba(12,12,12,0.96) 100%);
      color: white;
      font-size: 13px;
      outline: none;
      min-height: 40px;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.04),
        0 6px 16px rgba(0,0,0,0.18);
      font-family: 'Manrope', sans-serif;
    }

    .compact-auth input:focus {
      border-color: rgba(212,175,55,0.38);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.04),
        0 0 0 3px rgba(212,175,55,0.08);
    }

    .compact-auth .auth-row {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
    }

    .compact-auth .metal-btn {
      width: 100%;
      padding: 11px 14px;
      font-size: 13px;
    }

    .compact-auth .auth-message {
      min-height: 16px;
      margin-top: 8px;
      font-size: 11px;
      color: #cfcfcf;
      text-align: center;
    }

    .side-menu-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(2px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s ease;
      z-index: 55;
    }

    .side-menu-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .side-menu {
      position: fixed;
      top: 0;
      left: 0;
      width: min(360px, 86vw);
      height: 100vh;
      padding: 22px 18px 24px;
      background:
        linear-gradient(180deg, rgba(20,20,20,0.98), rgba(10,10,10,0.98));
      border-right: 1px solid rgba(255,255,255,0.08);
      box-shadow:
        20px 0 50px rgba(0,0,0,0.45),
        inset 0 1px 0 rgba(255,255,255,0.04);
      backdrop-filter: blur(12px);
      transform: translateX(-104%);
      transition: transform 0.24s ease;
      z-index: 60;
      text-align: left;
      overflow-y: auto;
    }

    .side-menu.open {
      transform: translateX(0);
    }

    .side-menu-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 18px;
    }

    .side-menu-brand {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .side-menu-kicker {
      font-family: 'Space Grotesk', sans-serif;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-size: 11px;
      color: var(--muted);
      opacity: 0.8;
    }

    .side-menu-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 22px;
      color: #fff;
    }

    .side-menu-close {
      width: 42px;
      height: 42px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.14);
      background:
        linear-gradient(180deg, rgba(255,255,255,0.12), rgba(255,255,255,0.04)),
        linear-gradient(180deg, rgba(10,10,10,0.86), rgba(10,10,10,0.92));
      color: #fff;
      cursor: pointer;
      font-size: 20px;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.08),
        0 10px 22px rgba(0,0,0,0.24);
    }

    .side-menu-links {
      display: grid;
      gap: 10px;
    }

    .menu-link,
    .menu-action-btn {
      width: 100%;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 54px;
      padding: 0 16px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.06);
      background:
        linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.015)),
        rgba(255,255,255,0.02);
      color: #f4f4f4;
      text-decoration: none;
      font-size: 15px;
      font-weight: 500;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.03),
        0 10px 20px rgba(0,0,0,0.14);
      transition: transform 0.14s ease, border-color 0.14s ease, background 0.14s ease;
      font-family: 'Manrope', sans-serif;
    }

    .menu-action-btn {
      cursor: pointer;
    }

    .menu-link:hover,
    .menu-action-btn:hover {
      transform: translateX(2px);
      border-color: rgba(212,175,55,0.22);
      background:
        linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.018)),
        rgba(255,255,255,0.03);
    }

    .menu-link-icon {
      width: 30px;
      height: 30px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #231700;
      background:
        linear-gradient(180deg, #fff5c9 0%, #f4d77a 20%, #d4af37 52%, #b98816 75%, #7c5a11 100%);
      box-shadow:
        inset 0 2px 0 rgba(255,255,255,0.45),
        inset 0 -2px 4px rgba(90,50,0,0.28),
        0 8px 18px rgba(212,175,55,0.14);
      font-size: 14px;
      font-weight: 700;
      flex: 0 0 auto;
      color: #111;
    }

    .menu-link-icon svg {
      width: 16px;
      height: 16px;
      display: block;
    }

    .side-menu-divider {
      height: 1px;
      margin: 8px 0 6px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
    }

    .menu-auth-panel {
      margin-top: 8px;
      padding: 12px;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,0.08);
      background:
        linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.015)),
        rgba(255,255,255,0.02);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.03),
        0 10px 20px rgba(0,0,0,0.14);
    }

    .menu-auth-title {
      margin: 0 0 10px;
      color: var(--gold);
      font-size: 12px;
      font-weight: 700;
      text-align: center;
      font-family: 'Space Grotesk', sans-serif;
      text-transform: uppercase;
      letter-spacing: 1.6px;
    }

    .menu-auth-inputs {
      display: grid;
      gap: 8px;
      margin-bottom: 8px;
    }

    .menu-auth-inputs input {
      width: 100%;
      padding: 10px 11px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.08);
      background: linear-gradient(180deg, rgba(16,16,16,0.92) 0%, rgba(12,12,12,0.96) 100%);
      color: white;
      font-size: 13px;
      outline: none;
      min-height: 40px;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.04),
        0 6px 16px rgba(0,0,0,0.18);
      font-family: 'Manrope', sans-serif;
    }

    .menu-auth-inputs input:focus {
      border-color: rgba(212,175,55,0.38);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.04),
        0 0 0 3px rgba(212,175,55,0.08);
    }

    .menu-auth-actions {
      display: grid;
      gap: 8px;
    }

    .menu-auth-actions .metal-btn {
      width: 100%;
      padding: 11px 14px;
      font-size: 13px;
    }

    .menu-auth-message {
      min-height: 16px;
      margin-top: 8px;
      font-size: 11px;
      color: #cfcfcf;
      text-align: center;
    }

    .submit-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: var(--top-btn-height);
      padding: 0 28px;
      border-radius: 999px;
      text-decoration: none;
      color: #231700;
      font-weight: 600;
      font-size: 15px;
      letter-spacing: 0.2px;
      background:
        linear-gradient(180deg, #fff5c9 0%, #f4d77a 20%, #d4af37 52%, #b98816 75%, #7c5a11 100%);
      border: 1px solid rgba(255, 230, 150, 0.38);
      box-shadow:
        inset 0 2px 0 rgba(255,255,255,0.45),
        inset 0 -2px 4px rgba(90,50,0,0.28),
        0 12px 26px rgba(212,175,55,0.22),
        0 0 0 1px rgba(212,175,55,0.08);
      transition: transform 0.16s ease, box-shadow 0.16s ease, filter 0.16s ease;
      white-space: nowrap;
      text-shadow: 0 1px 0 rgba(255,255,255,0.22);
      backdrop-filter: blur(2px);
      font-family: 'Manrope', sans-serif;
    }

    .submit-link:hover {
      transform: translateY(-1px);
      filter: brightness(1.03);
    }

    .metal-btn {
      border: 1px solid rgba(255,255,255,0.16);
      background:
        linear-gradient(180deg, #fbfbfb 0%, #d6d6d6 16%, #b6b6b6 35%, #8b8b8b 52%, #d2d2d2 72%, #f4f4f4 100%);
      color: #151515;
      padding: 13px 18px;
      border-radius: 999px;
      cursor: pointer;
      font-weight: 500;
      font-size: 14px;
      text-shadow: 0 1px 0 rgba(255,255,255,0.45);
      box-shadow:
        inset 0 2px 0 rgba(255,255,255,0.72),
        inset 0 -2px 3px rgba(0,0,0,0.18),
        0 10px 22px rgba(0,0,0,0.25);
      transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
      backdrop-filter: blur(2px);
      font-family: 'Manrope', sans-serif;
    }

    .metal-btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.02);
    }

    .metal-btn:disabled {
      opacity: 0.7;
      cursor: default;
      transform: none;
    }

    .metal-btn .icon {
      color: #6a560c;
      margin-right: 7px;
      font-size: 15px;
    }

    .liked {
      background:
        linear-gradient(180deg, #fff6cb 0%, #e9c75f 24%, #d4af37 52%, #b98714 76%, #826113 100%);
      color: #111;
      border-color: rgba(255,220,120,0.35);
    }

    .liked .icon {
      color: #111;
    }

    .radio-stage {
      position: relative;
      max-width: 760px;
      margin: 8px auto 0;
    }

    .radio-shell {
      position: relative;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.015)),
        radial-gradient(circle at top, rgba(212,175,55,0.12), transparent 55%),
        linear-gradient(180deg, rgba(24,24,24,0.88) 0%, rgba(17,17,17,0.94) 100%);
      border: 1px solid rgba(212,175,55,0.18);
      border-radius: 30px;
      padding: 28px;
      box-shadow:
        0 30px 80px rgba(0,0,0,0.42),
        0 0 35px rgba(212,175,55,0.10),
        inset 0 1px 0 rgba(255,255,255,0.05);
      backdrop-filter: blur(6px);
      transition: opacity 0.35s ease, filter 0.35s ease, transform 0.35s ease;
    }

    .radio-shell.pre-live {
      opacity: 0.42;
      filter: blur(0.2px) saturate(0.86);
      transform: scale(0.992);
    }

    .start-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
      z-index: 5;
    }

    .overlay-content {
      text-align: center;
      padding: 24px;
    }

    .overlay-label,
    .now-playing {
      font-family: 'Space Grotesk', sans-serif;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-size: var(--fs-label);
      opacity: 0.78;
    }

    .overlay-label {
      color: rgba(255,255,255,0.88);
      margin-bottom: 16px;
      text-shadow: 0 1px 8px rgba(0,0,0,0.4);
    }

    .start-btn {
      min-width: 190px;
    }

    .now-playing {
      color: var(--muted);
      margin-bottom: 14px;
    }

    .track-meta-row {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin: 0 auto 18px;
      max-width: 100%;
    }

    .now-playing-avatar-link {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      overflow: hidden;
      flex: 0 0 56px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      border: 1px solid rgba(212,175,55,0.26);
      background: rgba(255,255,255,0.03);
      box-shadow:
        0 10px 24px rgba(0,0,0,0.24),
        0 0 0 1px rgba(212,175,55,0.05);
      transition: transform 0.14s ease, filter 0.14s ease, border-color 0.14s ease;
    }

    .now-playing-avatar-link:hover {
      transform: translateY(-1px);
      filter: brightness(1.03);
      border-color: rgba(212,175,55,0.42);
    }

    .now-playing-avatar-image,
    .now-playing-avatar-fallback {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .now-playing-avatar-fallback {
      display: flex !important;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #3a2d0d, #a98325);
      color: #fff;
      font-weight: 700;
      font-size: 20px;
      font-family: 'Space Grotesk', sans-serif;
    }

    .track-meta-text {
      min-width: 0;
      text-align: left;
      max-width: min(520px, 70vw);
    }

    .track-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(24px, 4vw, 38px);
      line-height: 1.08;
      margin: 0 0 6px;
      font-weight: 600;
      letter-spacing: 0.2px;

        .order("created_at", { ascending: false })

    async function refreshAuthUI() {
      try {
        const { data, error } = await supabaseClient.auth.getSession();

        if (error) {
          setLoggedOutView();
          return null;
        }

        const user = data?.session?.user || null;

        if (user) {
          setLoggedInView();

          const profile = await loadMyProfile(user.id);
          const track = await loadMyTrack(user.id);

          applyMenuState(user, profile, track);
          return user;
        } else {
          setLoggedOutView();
          return null;
        }
      } catch (err) {
        console.error("refreshAuthUI error:", err);
        setLoggedOutView();
        return null;
      }
    }

    async function loadTrackStats() {
      const { count: submittedCount } = await supabaseClient
        .from("tracks")
        .select("*", { count: "exact", head: true });

      const { count: approvedCount } = await supabaseClient
        .from("tracks")
        .select("*", { count: "exact", head: true })
        .eq("status", "approved");

      submittedCountEl.textContent = (submittedCount || 0).toLocaleString();

      const { data } = await supabaseClient.auth.getSession();
      const user = data?.session?.user || null;

      if (!user) {
        playsCardEl.classList.add("hidden");
        return;
      }

      const { count: myApproved } = await supabaseClient
        .from("tracks")
        .select("*", { count: "exact", head: true })
        .eq("user_id", user.id)
        .eq("status", "approved");

      if (!myApproved || myApproved === 0) {
        playsCardEl.classList.add("hidden");
        return;
      }

      playsCardEl.classList.remove("hidden");

      const perDay = approvedCount && approvedCount > 0
        ? Math.floor(1440 / approvedCount)
        : 0;

      playsPerDayEl.textContent = perDay.toLocaleString();
    }

    async function loadMyTotalPlays() {
      const { data } = await supabaseClient.auth.getSession();
      const user = data?.session?.user || null;

      if (!user) {
        myPlaysCardEl.classList.add("hidden");
        return;
      }

      const { data: myTracks, error } = await supabaseClient
        .from("tracks")
        .select("play_count")
        .eq("user_id", user.id);

      if (error || !myTracks || myTracks.length === 0) {
        myPlaysCardEl.classList.add("hidden");
        return;
      }

      let total = 0;
      myTracks.forEach(track => {
        total += track.play_count || 0;
      });

      myPlaysCardEl.classList.remove("hidden");
      myTotalPlaysEl.textContent = total.toLocaleString();
    }

    async function loginWithCredentials(emailValue, passwordValue, messageTarget) {
      if (!emailValue || !passwordValue) {
        setAuthMessage("Please enter email and password.", true, messageTarget);
        return false;
      }

      setAuthMessage("", false, messageTarget);

      const { error } = await supabaseClient.auth.signInWithPassword({
        email: emailValue,
        password: passwordValue
      });

      if (error) {
        setAuthMessage(error.message, true, messageTarget);
        return false;
      }

      listenerIdentity = null;
      clearLoginFields();
      setAuthMessage("", false, messageTarget);
      return true;
    }

    async function signupWithCredentials(emailValue, passwordValue, messageTarget) {
      if (!emailValue || !passwordValue) {
        setAuthMessage("Please enter email and password.", true, messageTarget);
        return false;
      }

      setAuthMessage("", false, messageTarget);

      const { error } = await supabaseClient.auth.signUp({
        email: emailValue,
        password: passwordValue
      });

      if (error) {
        setAuthMessage(error.message, true, messageTarget);
        return false;
      }

      setAuthMessage("Account created. Check your email.", false, messageTarget);
      return true;
    }

    async function loadTracksFromSupabase() {
      const { data, error } = await supabaseClient
        .from("tracks")
        .select("id, title, artist, file_url, user_id, play_count, status, created_at")
        .eq("status", "approved")
        .order("created_at", { ascending: false });

      if (error) {
        console.error("loadTracksFromSupabase error:", error);
        tracks = [];
        return;
      }

      tracks = (data || []).map(track => ({
        id: track.id,
        title: track.title,
        artist: track.artist,
        file_url: track.file_url,
        user_id: track.user_id || null,
        play_count: track.play_count || 0
      }));
    }

    function escapeHtml(str) {
      return String(str || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function renderArtist(track) {
      if (track.user_id) {
        artistWrapEl.innerHTML = `
          <a class="artist-link" href="artist.html?user_id=${encodeURIComponent(track.user_id)}">
            ${escapeHtml(track.artist)}
          </a>
        `;
      } else {
        artistWrapEl.innerHTML = `<span>${escapeHtml(track.artist)}</span>`;
      }
    }

    function clearNowPlayingArtistPhoto(track) {
      nowPlayingArtistImage.src = "";
      nowPlayingArtistImage.classList.add("hidden");
      nowPlayingArtistFallback.classList.add("hidden");

      if (track?.user_id) {
        nowPlayingArtistLink.href = `artist.html?user_id=${encodeURIComponent(track.user_id)}`;
        nowPlayingArtistLink.classList.remove("hidden");
        nowPlayingArtistFallback.classList.remove("hidden");
        nowPlayingArtistFallback.textContent = (track.artist || "A").charAt(0).toUpperCase();
      } else {
        nowPlayingArtistLink.href = "#";
        nowPlayingArtistLink.classList.add("hidden");
      }
    }

    async function fetchArtistProfile(userId) {
      if (!userId) return null;
      if (artistProfileCache.has(userId)) return artistProfileCache.get(userId);

      const { data, error } = await supabaseClient
        .from("profiles")
        .select("user_id, artist_name, photo_url")
        .eq("user_id", userId)
        .maybeSingle();

      if (error) {
        console.error("fetchArtistProfile error:", error);
        return null;
      }

      if (data) {
        artistProfileCache.set(userId, data);
      }

      return data || null;
    }

    async function renderNowPlayingArtistPhoto(track) {
      const requestId = ++currentTrackProfileRequestId;
      clearNowPlayingArtistPhoto(track);

      if (!track?.user_id) return;

      const profile = await fetchArtistProfile(track.user_id);

      if (requestId !== currentTrackProfileRequestId) return;
      if (!profile) return;

      nowPlayingArtistLink.href = `artist.html?user_id=${encodeURIComponent(track.user_id)}`;
      nowPlayingArtistLink.classList.remove("hidden");

      if (profile.photo_url) {
        nowPlayingArtistImage.src = profile.photo_url;
        nowPlayingArtistImage.classList.remove("hidden");
        nowPlayingArtistFallback.classList.add("hidden");
      } else {
        nowPlayingArtistImage.classList.add("hidden");
        nowPlayingArtistFallback.classList.remove("hidden");
        nowPlayingArtistFallback.textContent = (profile.artist_name || track.artist || "A").charAt(0).toUpperCase();
      }
    }

    function resetLike() {
      liked = false;
      likeBtn.innerHTML = `<span class="icon">♥</span>Like`;
      likeBtn.classList.remove("liked");
    }

    function setTrackUI(track) {
      titleEl.textContent = track.title || "Untitled";
      renderArtist(track);
      renderNowPlayingArtistPhoto(track).catch(err => console.error("renderNowPlayingArtistPhoto error:", err));
      resetLike();
    }

    function incrementPlayCount(track) {
      if (!track || !track.id) return;

      supabaseClient
        .from("tracks")
        .update({
          play_count: (track.play_count || 0) + 1
        })
        .eq("id", track.id)
        .then(() => {
          track.play_count = (track.play_count || 0) + 1;
        })
        .catch(err => console.error("incrementPlayCount error:", err));
    }

    function chooseNextTrackIndex() {
      if (!tracks.length) return -1;

      let next;
      do {
        next = Math.floor(Math.random() * tracks.length);
      } while (tracks.length > 1 && next === current);

      return next;
    }

    function playTrackAt(index, startSeconds = 0, countPlay = true) {
      if (index < 0 || !tracks[index]) return;

      current = index;
      const track = tracks[index];

      setTrackUI(track);
      audio.src = track.file_url;
      progressFill.style.width = "0%";
      elapsedTimeEl.textContent = formatTime(startSeconds);

      audio.onloadedmetadata = () => {
        const safeStart = Math.max(0, Math.min(startSeconds, 59));

        try {
          audio.currentTime = safeStart;
        } catch (e) {
          console.error("set currentTime error:", e);
        }

        const playPromise = audio.play();
        if (playPromise) {
          playPromise.catch(err => {
            console.log("audio play blocked:", err);
          });
        }
      };

      if (countPlay) {
        incrementPlayCount(track);
      }
    }

    function nextTrack(startSeconds = 0, countPlay = true) {
      if (!tracks.length) {
        titleEl.textContent = "No live tracks yet";
        artistWrapEl.innerHTML = `<span>Check back soon</span>`;
        clearNowPlayingArtistPhoto(null);
        progressFill.style.width = "0%";
        elapsedTimeEl.textContent = "0:00";
        return;
      }

      const nextIndex = chooseNextTrackIndex();
      playTrackAt(nextIndex, startSeconds, countPlay);
    }

    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60).toString().padStart(2, "0");
      return `${mins}:${secs}`;
    }

    async function getListenerIdentity() {
      const { data } = await supabaseClient.auth.getSession();
      const user = data?.session?.user || null;

      if (user?.id) return user.id;

      let anonId = localStorage.getItem("listener_id");
      if (!anonId) {
        anonId = crypto.randomUUID();
        localStorage.setItem("listener_id", anonId);
      }
      return anonId;
    }

    async function registerListener() {
      try {
        if (!isLiveActivated) return;

        if (!listenerIdentity) {
          listenerIdentity = await getListenerIdentity();
        }

        const { error } = await supabaseClient
          .from("listeners")
          .upsert(
            [{
              user_id: listenerIdentity,
              last_seen: new Date().toISOString()
            }],
            { onConflict: "user_id" }
          );

        if (error) {
          console.error("registerListener error:", error);
        }
      } catch (err) {
        console.error("registerListener crash:", err);
      }
    }

    async function updateListeners() {
      try {
        const fiveMinutesAgo = new Date(Date.now() - 5 * 60 * 1000).toISOString();

        const { count, error } = await supabaseClient
          .from("listeners")
          .select("*", { count: "exact", head: true })
          .gt("last_seen", fiveMinutesAgo);

        if (!error && count !== null) {
          listenersCountEl.textContent = `${count.toLocaleString()} Listeners`;
        } else if (error) {
          console.error("updateListeners error:", error);
        }
      } catch (err) {
        console.error("updateListeners crash:", err);
      }
    }

    async function bootstrapLiveRadio() {
      await loadTracksFromSupabase();

      if (!tracks.length) {
        titleEl.textContent = "No live tracks yet";
        artistWrapEl.innerHTML = `<span>Check back soon</span>`;
        clearNowPlayingArtistPhoto(null);
        await updateListeners();
        return;
      }

      audio.volume = Number(volume.value);
      audio.muted = true;
      updateVolumeButtonState();

      const randomLiveOffset = Math.floor(Math.random() * 60);
      nextTrack(randomLiveOffset, false);
      liveBooted = true;

      await updateListeners();
    }

    async function ensureBackgroundPlayback() {
      if (!liveBooted || !audio.src) return;

      if (audio.paused) {
        audio.muted = true;
        updateVolumeButtonState();
        audio.play().catch(() => {});
      }
    }

    startBtn.onclick = async () => {
      isLiveActivated = true;
      listenerIdentity = null;

      await registerListener();
      await updateListeners();
      await loadTrackStats();
      await loadMyTotalPlays();

      radioShell.classList.remove("pre-live");
      startOverlay.classList.add("hidden");

      if (!audio.src && tracks.length) {
        nextTrack(Math.floor(Math.random() * 60), false);
      }

      if (Number(volume.value) > 0) {
        audio.muted = false;
      }

      updateVolumeButtonState();

      audio.play().catch(err => {
        console.error("Start Radio play error:", err);
      });
    };

    skipBtn.onclick = () => nextTrack(0, true);

    likeBtn.onclick = () => {
      liked = !liked;

      if (liked) {
        likeBtn.innerHTML = `<span class="icon">♥</span>Liked`;
        likeBtn.classList.add("liked");
      } else {
        likeBtn.innerHTML = `<span class="icon">♥</span>Like`;
        likeBtn.classList.remove("liked");
      }
    };

    audio.addEventListener("timeupdate", () => {
      const max = 60;
      const t = Math.min(audio.currentTime || 0, max);
      progressFill.style.width = `${(t / max) * 100}%`;
      elapsedTimeEl.textContent = formatTime(t);

      if (audio.currentTime >= max) {
        nextTrack(0, true);
      }
    });

    audio.addEventListener("ended", () => {
      nextTrack(0, true);
    });

    volume.addEventListener("input", (e) => {
      const v = Number(e.target.value);
      audio.volume = v;
      audio.muted = v === 0 || !isLiveActivated;
      updateVolumeButtonState();
    });

    document.addEventListener("visibilitychange", () => {
      if (!document.hidden && isLiveActivated) {
        registerListener().catch(() => {});
      }
      updateListeners().catch(() => {});
      ensureBackgroundPlayback();
    });

    window.addEventListener("focus", () => {
      if (isLiveActivated) {
        registerListener().catch(() => {});
      }
      updateListeners().catch(() => {});
      ensureBackgroundPlayback();
    });

    setInterval(() => {
      if (isLiveActivated && !document.hidden) {
        registerListener();
      }
    }, 15000);

    setInterval(() => {
      updateListeners();
    }, 10000);

    setInterval(async () => {
      await loadTracksFromSupabase();
      await ensureBackgroundPlayback();
    }, 30000);

    async function initPage() {
      setLoggedOutView();
      updateVolumeButtonState();
      await refreshAuthDependentUI();
      await bootstrapLiveRadio();
    }

    initPage().catch(err => {
      console.error("initPage error:", err);
    });
  </script>
