<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>60 Seconds FM</title>

<style>
:root{
  --gold:#d4af37;
  --gold-2:#f4d77a;
  --gold-dark:#8f6b13;
  --text:#f5f5f5;
}

/* ===== BACKGROUND ===== */
body{
  margin:0;
  min-height:100vh;
  font-family:Arial,sans-serif;
  color:var(--text);
  text-align:center;
  padding:18px 18px 44px;

  background:
    linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.85)),
    url("bg-desktop-correct.webp");

  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
  background-attachment:fixed;
}

/* MOBILE BG */
@media (max-width:768px){
  body{
    background:
      linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.9)),
      url("bg-mobile-final-1080x1920.webp");

    background-attachment:scroll;
  }
}

.hidden{display:none!important}

/* ===== LOGO ===== */
.brand-logo{
  width:min(720px,94vw);
  margin-bottom:6px;
}

/* ===== BUTTON ROW ===== */
.top-actions{
  display:flex;
  justify-content:center;
  gap:12px;
  margin-bottom:6px;
  flex-wrap:wrap;
}

/* GOLD BUTTON */
.submit-link{
  padding:14px 28px;
  border-radius:999px;
  font-weight:900;
  text-decoration:none;
  color:#231700;

  background:
    linear-gradient(180deg,#fff5c9,#f4d77a,#d4af37,#b98816,#7c5a11);

  box-shadow:
    inset 0 2px 0 rgba(255,255,255,0.4),
    0 10px 25px rgba(212,175,55,0.3);
}

/* SILVER BUTTON */
.metal-btn{
  padding:13px 18px;
  border-radius:999px;
  border:none;
  cursor:pointer;
  font-weight:800;

  background:
    linear-gradient(180deg,#fff,#d6d6d6,#999,#dcdcdc);

  color:#111;

  box-shadow:
    inset 0 2px 0 rgba(255,255,255,0.7),
    0 10px 20px rgba(0,0,0,0.4);
}

/* ===== RADIO CARD (UPGRADED) ===== */
.radio-shell{
  max-width:760px;
  margin:0 auto;

  padding:30px;
  border-radius:30px;

  background:
    linear-gradient(180deg,rgba(255,255,255,0.04),rgba(0,0,0,0.8)),
    radial-gradient(circle at top, rgba(212,175,55,0.25), transparent 60%);

  border:1px solid rgba(212,175,55,0.25);

  box-shadow:
    0 40px 120px rgba(0,0,0,0.6),
    0 0 60px rgba(212,175,55,0.15),
    inset 0 1px 0 rgba(255,255,255,0.05);
}

.radio-shell.pre-live{
  opacity:.45;
  filter:blur(.3px);
}

/* TEXT */
.track-title{
  font-size:42px;
  margin:0;
  font-weight:800;
}

/* PROGRESS */
.progress{
  height:10px;
  background:#222;
  border-radius:999px;
  overflow:hidden;
  margin-top:10px;
}

.fill{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,var(--gold-dark),var(--gold),var(--gold-2));
}

/* ===== SMALL FIX ===== */
.overlay-label{
  letter-spacing:2px;
  margin-bottom:16px;
}

</style>
</head>

<body>

<img src="logo.png" class="brand-logo"/>

<div class="top-actions">
  <a id="submitTrackBtn" class="submit-link hidden" href="join.html">Submit your track</a>
  <button id="showLoginBtn" class="metal-btn">Log in</button>
</div>

<!-- AUTH -->
<div id="authBox" class="hidden">
  <input id="email" placeholder="Email"/>
  <input id="password" type="password" placeholder="Password"/>
  <button id="login" class="metal-btn">Login</button>
  <button id="signup" class="metal-btn">Sign up</button>
</div>

<div id="userBox" class="hidden">
  <button id="logout" class="metal-btn">Log out</button>
</div>

<!-- RADIO -->
<div class="radio-shell pre-live" id="radioShell">

  <div id="startOverlay">
    <div class="overlay-label">LIVE RADIO</div>
    <button id="start" class="metal-btn">Start Radio</button>
  </div>

  <h2 id="title" class="track-title">Loading...</h2>

  <div class="progress">
    <div id="progress" class="fill"></div>
  </div>

  <button id="skip" class="metal-btn">Skip</button>

</div>

<audio id="audio" autoplay playsinline></audio>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const supabase = window.supabase.createClient(
  "https://rgoutegbcpjytplqcwze.supabase.co",
  "sb_publishable_255qyDKS77nMU0pbedfa_A_3hdgtEHh"
);

const audio = document.getElementById("audio");
const titleEl = document.getElementById("title");
const progress = document.getElementById("progress");

let tracks=[];

// ===== AUTH FIXED =====
async function updateUser(){
  const {data}=await supabase.auth.getSession();
  const user=data?.session?.user;

  if(user){
    userBox.classList.remove("hidden");
    submitTrackBtn.classList.remove("hidden");
    showLoginBtn.classList.add("hidden");
  }else{
    userBox.classList.add("hidden");
    submitTrackBtn.classList.add("hidden");
    showLoginBtn.classList.remove("hidden");
  }
}

showLoginBtn.onclick=()=>authBox.classList.toggle("hidden");

login.onclick=async()=>{
  await supabase.auth.signInWithPassword({
    email:email.value,
    password:password.value
  });
  updateUser();
};

signup.onclick=async()=>{
  await supabase.auth.signUp({
    email:email.value,
    password:password.value
  });
};

logout.onclick=async()=>{
  await supabase.auth.signOut();
  updateUser();
};

// ===== RADIO =====
async function loadTracks(){
  const {data}=await supabase
    .from("tracks")
    .select("*")
    .eq("status","approved");

  tracks=data||[];
}

function nextTrack(){
  if(!tracks.length)return;

  const t=tracks[Math.floor(Math.random()*tracks.length)];

  titleEl.textContent=t.title;
  audio.src=t.file_url;

  audio.onloadedmetadata=()=>{
    audio.currentTime=Math.random()*60;
    audio.play();
  };
}

start.onclick=()=>{
  radioShell.classList.remove("pre-live");
  startOverlay.style.display="none";
  audio.muted=false;
  nextTrack();
};

skip.onclick=nextTrack;

audio.addEventListener("timeupdate",()=>{
  const t=Math.min(audio.currentTime,60);
  progress.style.width=(t/60*100)+"%";

  if(audio.currentTime>=60)nextTrack();
});

// INIT
updateUser();
loadTracks();
</script>

</body>
</html>
