<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>60seconds.fm</title>

  <style>
    body {
      margin: 0;
      background: #0b0b0b;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 30px 20px;
    }

    h1 {
      color: gold;
    }

    .card {
      background: #151515;
      border-radius: 20px;
      padding: 24px;
      max-width: 500px;
      margin: 20px auto;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 10px;
      border-radius: 10px;
      border: none;
    }

    button {
      padding: 12px 18px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      margin: 5px;
      font-weight: bold;
    }

    .gold {
      background: gold;
      color: black;
    }

    .outline {
      background: transparent;
      border: 1px solid gold;
      color: gold;
    }

    #status {
      margin-top: 15px;
      min-height: 20px;
      color: #ddd;
    }

    #debug {
      font-size: 12px;
      color: #888;
      margin-top: 5px;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>

<h1>60seconds.fm</h1>

<div class="card">
  <div id="authBox">
    <input id="email" type="email" placeholder="Email" />
    <input id="password" type="password" placeholder="Password" />

    <button id="signup" class="gold">Sign up</button>
    <button id="login" class="outline">Log in</button>
  </div>

  <div id="userBox" class="hidden">
    <p id="userText"></p>
    <button id="logout" class="gold">Log out</button>
  </div>

  <div id="status">Ready</div>
  <div id="debug"></div>
</div>

<div class="card">
  <button id="start">Start Radio</button>
  <div id="player" class="hidden">
    <h2 id="title"></h2>
    <p id="artist"></p>

    <button id="skip">Skip</button><br><br>
    <input id="volume" type="range" min="0" max="1" step="0.01" value="0.8" />
  </div>
</div>

<audio id="audio"></audio>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
console.log("SCRIPT STARTED");

const statusEl = document.getElementById("status");
const debugEl = document.getElementById("debug");

function setStatus(msg, error = false) {
  statusEl.textContent = msg;
  statusEl.style.color = error ? "red" : "#ddd";
  console.log(msg);
}

function setDebug(msg) {
  debugEl.textContent = msg;
  console.log("DEBUG:", msg);
}

if (!window.supabase) {
  setStatus("Supabase not loaded", true);
  throw new Error("Supabase missing");
}

// 👇 FIX: andere naam gebruiken
const supabaseClient = window.supabase.createClient(
  "https://rgoutegbcpjytplqcwze.supabase.co",
  "sb_publishable_255qyDKS77nMU0pbedfa_A_3hdgtEHh"
);

setDebug("Supabase ready");

// ELEMENTS
const email = document.getElementById("email");
const password = document.getElementById("password");

const signupBtn = document.getElementById("signup");
const loginBtn = document.getElementById("login");
const logoutBtn = document.getElementById("logout");

const authBox = document.getElementById("authBox");
const userBox = document.getElementById("userBox");
const userText = document.getElementById("userText");

// AUTH
signupBtn.onclick = async () => {
  alert("CLICK WORKS");

  setDebug("Signup clicked");

  const { data, error } = await supabaseClient.auth.signUp({
    email: email.value,
    password: password.value
  });

  if (error) {
    setStatus(error.message, true);
  } else {
    setStatus("Account created! Check your email.");
    updateUser();
  }
};

loginBtn.onclick = async () => {
  setDebug("Login clicked");

  const { error } = await supabaseClient.auth.signInWithPassword({
    email: email.value,
    password: password.value
  });

  if (error) {
    setStatus(error.message, true);
  } else {
    setStatus("Logged in!");
    updateUser();
  }
};

logoutBtn.onclick = async () => {
  await supabaseClient.auth.signOut();
  setStatus("Logged out");
  updateUser();
};

async function updateUser() {
  const { data } = await supabaseClient.auth.getUser();

  if (data.user) {
    authBox.classList.add("hidden");
    userBox.classList.remove("hidden");
    userText.textContent = data.user.email;
  } else {
    authBox.classList.remove("hidden");
    userBox.classList.add("hidden");
  }
}

updateUser();

// RADIO
const tracks = [
  { title: "Is It Me", artist: "Eddy Donato", file: "track1.mp3" },
  { title: "ff in me vibe", artist: "EARV", file: "track2.mp3" },
  { title: "Hitte In De Toko", artist: "EARV", file: "track3.mp3" }
];

let current = -1;
const audio = document.getElementById("audio");

const startBtn = document.getElementById("start");
const player = document.getElementById("player");

const titleEl = document.getElementById("title");
const artistEl = document.getElementById("artist");

const skipBtn = document.getElementById("skip");
const volume = document.getElementById("volume");

function nextTrack() {
  current = Math.floor(Math.random() * tracks.length);
  const t = tracks[current];

  titleEl.textContent = t.title;
  artistEl.textContent = t.artist;

  audio.src = t.file;
  audio.currentTime = 0;
  audio.play();
}

startBtn.onclick = () => {
  player.classList.remove("hidden");
  nextTrack();
};

skipBtn.onclick = nextTrack;

audio.addEventListener("timeupdate", () => {
  if (audio.currentTime >= 60) {
    nextTrack();
  }
});

volume.oninput = e => {
  audio.volume = e.target.value;
};
</script>

</body>
</html>
