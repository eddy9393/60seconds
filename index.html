<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>60 Seconds FM</title>
<link rel="stylesheet" href="assets/css/index.css">
</head>
<body>

<div class="main-container">

  <section class="featured-section">
    <div class="featured-card">

      <div class="featured-left">
        <img src="assets/images/default-profile.png" class="featured-avatar">
      </div>

      <div class="featured-right">
        <h2 class="featured-name">Artist Name</h2>
        <p class="featured-role">Producer · Rapper</p>

        <div class="featured-meta">
          <span>Location</span>
          <span>Genre</span>
        </div>

        <div class="featured-stats">
          <span>12.4K Followers</span>
          <span>86K Streams</span>
          <span>⭐ 4.8</span>
        </div>

        <button class="featured-btn">View profile</button>
      </div>

    </div>
  </section>

  <section class="grid-section">
    <div class="card-grid">

      <div class="artist-card">
        <img src="assets/images/default-profile.png">
        <h3>Artist</h3>
        <button>View profile</button>
      </div>

      <div class="artist-card">
        <img src="assets/images/default-profile.png">
        <h3>Artist</h3>
        <button>View profile</button>
      </div>

      <div class="artist-card">
        <img src="assets/images/default-profile.png">
        <h3>Artist</h3>
        <button>View profile</button>
      </div>

    </div>
  </section>

</div>

</body>
</html>
