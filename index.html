<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>60 Seconds FM</title>

  <style>
    :root {
      --gold: #d4af37;
      --gold-2: #f4d77a;
      --gold-dark: #8f6b13;
      --text: #f5f5f5;
      --muted: #a8a8a8;
      --top-btn-height: 52px;
    }

    body {
      margin: 0;
      background:
        radial-gradient(circle at top, rgba(212,175,55,0.10), transparent 28%),
        linear-gradient(180deg,#080808,#0d0d0d);
      color: var(--text);
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 24px 18px 44px;
    }

    .hidden { display: none !important; }

    /* LOGO */
    .brand-logo {
      width: min(700px, 92vw);
      margin-bottom: 20px;
    }

    /* TOP */
    .top-actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    .submit-link {
      display: flex;
      align-items: center;
      justify-content: center;
      height: var(--top-btn-height);
      padding: 0 28px;
      border-radius: 999px;
      background: linear-gradient(135deg,var(--gold-2),var(--gold));
      color: #111;
      font-weight: 800;
      text-decoration: none;
    }

    .metal-btn {
      height: var(--top-btn-height);
      padding: 0 20px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      font-weight: 700;
      background: linear-gradient(#444,#111);
      color: white;
    }

    /* AUTH */
    .auth-box {
      margin-top: 10px;
    }

    .auth-inputs {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-bottom: 8px;
    }

    .auth-inputs input {
      padding: 10px;
      border-radius: 10px;
      border: none;
      background: #111;
      color: white;
    }

    .user-box {
      display: flex;
      gap: 10px;
      justify-content: center;
      align-items: center;
    }

    /* RADIO */
    .radio-shell {
      margin-top: 30px;
      padding: 20px;
      border-radius: 20px;
      background: #111;
    }

    .track-title {
      font-size: 32px;
    }

    .progress {
      height: 8px;
      background: #333;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 10px;
    }

    .fill {
      height: 100%;
      width: 0%;
      background: var(--gold);
    }

    .player-actions {
      margin-top: 10px;
    }

  </style>
</head>

<body>

  <!-- LOGO -->
  <img src="logo.png" class="brand-logo"/>

  <!-- BUTTONS -->
  <div class="top-actions">
    <a id="submitTrackBtn" class="submit-link hidden" href="join.html">Submit your track</a>

    <button id="showLoginBtn" class="metal-btn">Log in</button>
  </div>

  <!-- LOGIN -->
  <div id="authBox" class="auth-box hidden">
    <div class="auth-inputs">
      <input id="email" placeholder="Email"/>
      <input id="password" placeholder="Password" type="password"/>
    </div>
    <button id="login" class="metal-btn">Login</button>
    <button id="signup" class="metal-btn">Sign up</button>
  </div>

  <!-- USER -->
  <div id="userBox" class="user-box hidden">
    <span>Logged in</span>
    <button id="logout" class="metal-btn">Log out</button>
  </div>

  <!-- RADIO -->
  <div class="radio-shell">
    <h2 id="title" class="track-title">Loading...</h2>

    <div class="progress">
      <div id="progress" class="fill"></div>
    </div>

    <div class="player-actions">
      <button id="start" class="metal-btn">Start Radio</button>
      <button id="skip" class="metal-btn">Skip</button>
    </div>
  </div>

  <audio id="audio"></audio>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const supabase = window.supabase.createClient(
      "https://rgoutegbcpjytplqcwze.supabase.co",
      "sb_publishable_255qyDKS77nMU0pbedfa_A_3hdgtEHh"
    );

    const email = document.getElementById("email");
    const password = document.getElementById("password");

    const authBox = document.getElementById("authBox");
    const showLoginBtn = document.getElementById("showLoginBtn");
    const userBox = document.getElementById("userBox");
    const submitBtn = document.getElementById("submitTrackBtn");

    const audio = document.getElementById("audio");
    const titleEl = document.getElementById("title");

    let tracks = [];

    // AUTH
    showLoginBtn.onclick = () => {
      authBox.classList.toggle("hidden");
    };

    document.getElementById("login").onclick = async () => {
      const { error } = await supabase.auth.signInWithPassword({
        email: email.value,
        password: password.value
      });

      if (!error) {
        updateUser();
      } else {
        alert(error.message);
      }
    };

    document.getElementById("signup").onclick = async () => {
      const { error } = await supabase.auth.signUp({
        email: email.value,
        password: password.value
      });

      if (!error) alert("Check your email");
      else alert(error.message);
    };

    document.getElementById("logout").onclick = async () => {
      await supabase.auth.signOut();
      updateUser();
    };

    async function updateUser() {
      const { data } = await supabase.auth.getUser();

      if (data.user) {
        userBox.classList.remove("hidden");
        submitBtn.classList.remove("hidden");
        showLoginBtn.classList.add("hidden");
        authBox.classList.add("hidden");
      } else {
        userBox.classList.add("hidden");
        submitBtn.classList.add("hidden");
        showLoginBtn.classList.remove("hidden");
      }
    }

    // RADIO
    async function loadTracks() {
      const { data } = await supabase
        .from("tracks")
        .select("*")
        .eq("status","approved");

      tracks = data || [];
    }

    function nextTrack() {
      if (!tracks.length) return;

      const t = tracks[Math.floor(Math.random()*tracks.length)];
      titleEl.textContent = t.title;
      audio.src = t.file_url;

      audio.onloadedmetadata = () => {
        audio.currentTime = Math.random()*60;
        audio.play();
      };
    }

    document.getElementById("start").onclick = () => {
      audio.muted = false;
      nextTrack();
    };

    document.getElementById("skip").onclick = nextTrack;

    audio.addEventListener("timeupdate", () => {
      const t = Math.min(audio.currentTime,60);
      document.getElementById("progress").style.width = (t/60*100)+"%";

      if (audio.currentTime >= 60) nextTrack();
    });

    // INIT
    updateUser();
    loadTracks();
  </script>

</body>
</html>
