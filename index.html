<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>60seconds.fm</title>
  <style>
    body {
      margin: 0;
      background: #0b0b0b;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 30px 20px;
    }

    .container {
      max-width: 820px;
      margin: 0 auto;
    }

    h1 {
      color: gold;
      margin-bottom: 10px;
    }

    .card {
      background: #151515;
      border-radius: 20px;
      padding: 24px;
      margin-top: 20px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin-bottom: 12px;
      border: none;
      border-radius: 10px;
    }

    button {
      padding: 12px 18px;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      margin: 6px;
      font-weight: bold;
    }

    .gold {
      background: gold;
      color: black;
    }

    .outline {
      background: transparent;
      color: gold;
      border: 1px solid gold;
    }

    #status {
      margin-top: 16px;
      min-height: 24px;
      color: #ddd;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .progress {
      height: 8px;
      background: #333;
      border-radius: 999px;
      overflow: hidden;
      margin: 14px 0;
    }

    .fill {
      height: 100%;
      width: 0%;
      background: gold;
    }

    .hidden {
      display: none;
    }

    .nav-link {
      display: inline-block;
      margin-top: 10px;
      color: gold;
      text-decoration: none;
      border: 1px solid rgba(255, 215, 0, 0.4);
      padding: 10px 16px;
      border-radius: 999px;
    }

    #debug {
      margin-top: 10px;
      font-size: 13px;
      color: #999;
      min-height: 18px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>60seconds.fm</h1>
    <a class="nav-link" href="join.html">Join 60seconds</a>

    <div class="card">
      <div id="loggedOut">
        <h2>Sign up / Log in</h2>
        <input id="email" type="email" placeholder="Email" />
        <input id="password" type="password" placeholder="Password" />
        <button id="signupBtn" class="gold" type="button">Sign up</button>
        <button id="loginBtn" class="outline" type="button">Log in</button>
      </div>

      <div id="loggedIn" class="hidden">
        <p id="userText"></p>
        <button id="logoutBtn" class="gold" type="button">Log out</button>
      </div>

      <div id="status">Ready</div>
      <div id="debug"></div>
    </div>

    <div class="card">
      <div id="startScreen">
        <button id="startBtn" class="gold" type="button">Start Radio</button>
      </div>

      <div id="player" class="hidden">
        <h2 id="title">-</h2>
        <p id="artist">-</p>

        <div class="progress">
          <div class="fill" id="progressFill"></div>
        </div>

        <button id="skipBtn" type="button">Skip</button>

        <div style="margin-top:16px;">
          <input id="volumeSlider" type="range" min="0" max="1" step="0.01" value="0.8" />
        </div>
      </div>
    </div>
  </div>

  <audio id="audio"></audio>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const statusEl = document.getElementById("status");
    const debugEl = document.getElementById("debug");

    function setStatus(message, isError = false) {
      statusEl.textContent = message;
      statusEl.style.color = isError ? "#ff8a8a" : "#ddd";
      console.log(message);
    }

    function setDebug(message) {
      debugEl.textContent = message;
      console.log("DEBUG:", message);
    }

    setDebug("Script started");

    if (!window.supabase) {
      setStatus("Supabase library failed to load.", true);
      throw new Error("Supabase missing");
    }

    const supabase = window.supabase.createClient(
      "https://rgoutegbcpjytplqcwze.supabase.co",
      "sb_publishable_255qyDKS77nMU0pbedfa_A_3hdgtEHh"
    );

    setDebug("Supabase client created");

    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const signupBtn = document.getElementById("signupBtn");
    const loginBtn = document.getElementById("loginBtn");
    const logoutBtn = document.getElementById("logoutBtn");
    const loggedOut = document.getElementById("loggedOut");
    const loggedIn = document.getElementById("loggedIn");
    const userText = document.getElementById("userText");

    async function updateUser() {
      setDebug("Checking user session...");

      try {
        const { data, error } = await supabase.auth.getUser();

        if (error) {
          setStatus("User check error: " + error.message, true);
          return;
        }

        if (data.user) {
          loggedOut.classList.add("hidden");
          loggedIn.classList.remove("hidden");
          userText.textContent = "Logged in as " + data.user.email;
          setStatus("You are logged in.");
        } else {
          loggedOut.classList.remove("hidden");
          loggedIn.classList.add("hidden");
          userText.textContent = "";
          setStatus("Not logged in.");
        }
      } catch (err) {
        setStatus("Unexpected user check error: " + err.message, true);
      }
    }

    signupBtn.addEventListener("click", async () => {
      const email = emailInput.value.trim();
      const password = passwordInput.value.trim();

      if (!email || !password) {
        setStatus("Please enter email and password.", true);
        return;
      }

      setStatus("Creating account...");
      setDebug("Running signUp");

      try {
        const { data, error } = await supabase.auth.signUp({
          email,
          password
        });

        if (error) {
          setStatus("Signup error: " + error.message, true);
          return;
        }

        setStatus("Account created. Check your email to confirm.");
        console.log("SIGNUP DATA:", data);
        await updateUser();
      } catch (err) {
        setStatus("Signup failed: " + err.message, true);
      }
    });

    loginBtn.addEventListener("click", async () => {
      const email = emailInput.value.trim();
      const password = passwordInput.value.trim();

      if (!email || !password) {
        setStatus("Please enter email and password.", true);
        return;
      }

      setStatus("Logging in...");
      setDebug("Running signInWithPassword");

      try {
        const { error } = await supabase.auth.signInWithPassword({
          email,
          password
        });

        if (error) {
          setStatus("Login error: " + error.message, true);
          return;
        }

        setStatus("Logged in successfully.");
        await updateUser();
      } catch (err) {
        setStatus("Login failed: " + err.message, true);
      }
    });

    logoutBtn.addEventListener("click", async () => {
      setStatus("Logging out...");

      try {
        const { error } = await supabase.auth.signOut();

        if (error) {
          setStatus("Logout error: " + error.message, true);
          return;
        }

        setStatus("Logged out.");
        await updateUser();
      } catch (err) {
        setStatus("Logout failed: " + err.message, true);
      }
    });

    const tracks = [
      { title: "Is It Me", artist: "Eddy Donato", file: "track1.mp3" },
      { title: "ff in me vibe", artist: "EARV", file: "track2.mp3" },
      { title: "Hitte In De Toko", artist: "EARV", file: "track3.mp3" }
    ];

    let currentTrackIndex = -1;
    const audio = document.getElementById("audio");
    const startBtn = document.getElementById("startBtn");
    const startScreen = document.getElementById("startScreen");
    const player = document.getElementById("player");
    const titleEl = document.getElementById("title");
    const artistEl = document.getElementById("artist");
    const progressFill = document.getElementById("progressFill");
    const skipBtn = document.getElementById("skipBtn");
    const volumeSlider = document.getElementById("volumeSlider");

    function nextTrack() {
      let next;
      do {
        next = Math.floor(Math.random() * tracks.length);
      } while (tracks.length > 1 && next === currentTrackIndex);

      currentTrackIndex = next;
      const track = tracks[currentTrackIndex];

      titleEl.textContent = track.title;
      artistEl.textContent = track.artist;
      audio.src = track.file;
      audio.currentTime = 0;
      audio.play().catch(err => {
        console.log("Audio play blocked:", err);
      });
    }

    startBtn.addEventListener("click", () => {
      startScreen.classList.add("hidden");
      player.classList.remove("hidden");
      nextTrack();
    });

    skipBtn.addEventListener("click", () => {
      nextTrack();
    });

    audio.addEventListener("timeupdate", () => {
      const max = 60;
      const t = Math.min(audio.currentTime, max);
      progressFill.style.width = (t / max * 100) + "%";

      if (audio.currentTime >= max) {
        nextTrack();
      }
    });

    volumeSlider.addEventListener("input", (e) => {
      audio.volume = Number(e.target.value);
    });

    audio.volume = 0.8;

    updateUser();
  </script>
</body>
</html>
