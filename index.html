<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>60seconds.fm</title>

  <style>
    body {
      margin: 0;
      background: #0b0b0b;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 30px 20px;
    }

    h1 {
      color: gold;
      margin-bottom: 10px;
    }

    .topbar {
      max-width: 900px;
      margin: 0 auto 10px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
    }

    .brand-wrap {
      text-align: left;
    }

    .brand-wrap a {
      display: inline-block;
      margin-top: 10px;
      color: gold;
      text-decoration: none;
      border: 1px solid rgba(255, 215, 0, 0.4);
      padding: 10px 16px;
      border-radius: 999px;
    }

    .auth-mini {
      background: #151515;
      border-radius: 16px;
      padding: 14px;
      width: 280px;
      text-align: left;
    }

    .auth-mini h3 {
      margin: 0 0 10px;
      color: gold;
      font-size: 16px;
    }

    .auth-mini input {
      width: 100%;
      padding: 10px;
      margin-bottom: 8px;
      border-radius: 10px;
      border: none;
      box-sizing: border-box;
      font-size: 14px;
    }

    .auth-mini button {
      padding: 10px 14px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      margin: 4px 4px 0 0;
      font-weight: bold;
      font-size: 13px;
    }

    .gold {
      background: gold;
      color: black;
    }

    .outline {
      background: transparent;
      border: 1px solid gold;
      color: gold;
    }

    .card {
      background: #151515;
      border-radius: 20px;
      padding: 24px;
      max-width: 560px;
      margin: 20px auto;
    }

    #status {
      margin-top: 10px;
      min-height: 20px;
      color: #ddd;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 14px;
    }

    #debug {
      font-size: 12px;
      color: #888;
      margin-top: 5px;
      min-height: 16px;
    }

    .hidden {
      display: none;
    }

    .progress {
      height: 8px;
      background: #333;
      border-radius: 999px;
      overflow: hidden;
      margin: 14px 0;
    }

    .fill {
      height: 100%;
      width: 0%;
      background: gold;
    }

    .artist-link {
      color: gold;
      text-decoration: none;
      border-bottom: 1px solid rgba(255, 215, 0, 0.35);
    }

    .artist-link:hover {
      opacity: 0.85;
    }

    .listeners {
      margin-top: 10px;
      color: #cfcfcf;
      font-size: 14px;
    }

    .player-actions {
      margin-top: 10px;
    }

    .player-actions button {
      padding: 12px 18px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      margin: 5px;
      font-weight: bold;
    }

    .volume-wrap {
      margin-top: 18px;
    }

    .volume-wrap label {
      display: block;
      margin-bottom: 8px;
      color: #aaa;
      font-size: 14px;
    }

    .volume-wrap input {
      width: 100%;
      margin: 0;
    }

    @media (max-width: 760px) {
      .topbar {
        flex-direction: column;
        align-items: stretch;
      }

      .auth-mini {
        width: auto;
      }

      .brand-wrap {
        text-align: center;
      }
    }
  </style>
</head>
<body>

  <div class="topbar">
    <div class="brand-wrap">
      <h1>60seconds.fm</h1>
      <a href="join.html">Join 60seconds</a>
    </div>

    <div class="auth-mini">
      <div id="authBox">
        <h3>Log in</h3>
        <input id="email" type="email" placeholder="Email" />
        <input id="password" type="password" placeholder="Password" />
        <button id="signup" class="gold" type="button">Sign up</button>
        <button id="login" class="outline" type="button">Log in</button>
      </div>

      <div id="userBox" class="hidden">
        <div id="userText" style="margin-bottom:8px;font-size:14px;"></div>
        <button id="logout" class="gold" type="button">Log out</button>
      </div>

      <div id="status">Ready</div>
      <div id="debug"></div>
    </div>
  </div>

  <div class="card">
    <button id="start" class="gold" type="button">Start Radio</button>

    <div id="player" class="hidden">
      <h2 id="title">-</h2>
      <p id="artistWrap"><span id="artist">-</span></p>

      <div class="listeners" id="listenersCount">1,284 listening now</div>

      <div class="progress">
        <div class="fill" id="progress"></div>
      </div>

      <div class="player-actions">
        <button id="likeBtn" class="outline" type="button">♡ Like</button>
        <button id="skip" type="button">Skip</button>
      </div>

      <div class="volume-wrap">
        <label for="volume">Volume</label>
        <input id="volume" type="range" min="0" max="1" step="0.01" value="0.8" />
      </div>
    </div>
  </div>

  <audio id="audio"></audio>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const statusEl = document.getElementById("status");
    const debugEl = document.getElementById("debug");

    function setStatus(msg, error = false) {
      statusEl.textContent = msg;
      statusEl.style.color = error ? "#ff8a8a" : "#ddd";
      console.log(msg);
    }

    function setDebug(msg) {
      debugEl.textContent = msg;
      console.log("DEBUG:", msg);
    }

    if (!window.supabase) {
      setStatus("Supabase not loaded", true);
      throw new Error("Supabase missing");
    }

    const supabaseClient = window.supabase.createClient(
      "https://rgoutegbcpjytplqcwze.supabase.co",
      "sb_publishable_255qyDKS77nMU0pbedfa_A_3hdgtEHh"
    );

    // AUTH
    const email = document.getElementById("email");
    const password = document.getElementById("password");
    const signupBtn = document.getElementById("signup");
    const loginBtn = document.getElementById("login");
    const logoutBtn = document.getElementById("logout");
    const authBox = document.getElementById("authBox");
    const userBox = document.getElementById("userBox");
    const userText = document.getElementById("userText");

    async function updateUser() {
      const { data, error } = await supabaseClient.auth.getUser();

      if (error) {
        setStatus(error.message, true);
        return;
      }

      if (data.user) {
        authBox.classList.add("hidden");
        userBox.classList.remove("hidden");
        userText.textContent = "Logged in as " + data.user.email;
      } else {
        authBox.classList.remove("hidden");
        userBox.classList.add("hidden");
      }
    }

    signupBtn.onclick = async () => {
      const emailValue = email.value.trim();
      const passwordValue = password.value.trim();

      if (!emailValue || !passwordValue) {
        setStatus("Please enter email and password.", true);
        return;
      }

      setStatus("Creating account...");

      const { error } = await supabaseClient.auth.signUp({
        email: emailValue,
        password: passwordValue
      });

      if (error) {
        setStatus(error.message, true);
      } else {
        setStatus("Account created. Check your email.");
        updateUser();
      }
    };

    loginBtn.onclick = async () => {
      const emailValue = email.value.trim();
      const passwordValue = password.value.trim();

      if (!emailValue || !passwordValue) {
        setStatus("Please enter email and password.", true);
        return;
      }

      setStatus("Logging in...");

      const { error } = await supabaseClient.auth.signInWithPassword({
        email: emailValue,
        password: passwordValue
      });

      if (error) {
        setStatus(error.message, true);
      } else {
        setStatus("Logged in!");
        updateUser();
      }
    };

    logoutBtn.onclick = async () => {
      await supabaseClient.auth.signOut();
      setStatus("Logged out");
      updateUser();
    };

    updateUser();

    // RADIO
    let tracks = [];
    let current = -1;
    let liked = false;

    const audio = document.getElementById("audio");
    const startBtn = document.getElementById("start");
    const player = document.getElementById("player");
    const titleEl = document.getElementById("title");
    const artistWrapEl = document.getElementById("artistWrap");
    const skipBtn = document.getElementById("skip");
    const likeBtn = document.getElementById("likeBtn");
    const volume = document.getElementById("volume");
    const progressFill = document.getElementById("progress");
    const listenersCountEl = document.getElementById("listenersCount");

    async function loadTracksFromSupabase() {
      setDebug("Loading approved tracks from Supabase...");

      const { data, error } = await supabaseClient
        .from("tracks")
        .select("id, title, artist, file_url, user_id, status, created_at")
        .eq("status", "approved")
        .order("created_at", { ascending: false });

      if (error) {
        setStatus("Could not load tracks.", true);
        console.error(error);
        tracks = [];
        return;
      }

      if (!data || data.length === 0) {
        setStatus("No approved tracks available yet.", true);
        tracks = [];
        return;
      }

      tracks = data.map(track => ({
        title: track.title,
        artist: track.artist,
        file_url: track.file_url,
        user_id: track.user_id || null
      }));

      setDebug(`Loaded ${tracks.length} approved track(s)`);
    }

    function renderArtist(track) {
      if (track.user_id) {
        artistWrapEl.innerHTML = `
          <a class="artist-link" href="artist.html?user_id=${encodeURIComponent(track.user_id)}">
            ${escapeHtml(track.artist)}
          </a>
        `;
      } else {
        artistWrapEl.innerHTML = `<span>${escapeHtml(track.artist)}</span>`;
      }
    }

    function updateListeners() {
      const count = Math.floor(900 + Math.random() * 900);
      listenersCountEl.textContent = count.toLocaleString() + " listening now";
    }

    function resetLike() {
      liked = false;
      likeBtn.textContent = "♡ Like";
      likeBtn.classList.remove("gold");
      likeBtn.classList.add("outline");
    }

    function nextTrack() {
      if (!tracks.length) {
        setStatus("No tracks available yet.", true);
        return;
      }

      let next;
      do {
        next = Math.floor(Math.random() * tracks.length);
      } while (tracks.length > 1 && next === current);

      current = next;
      const t = tracks[current];

      titleEl.textContent = t.title;
      renderArtist(t);
      audio.src = t.file_url;
      audio.currentTime = 0;
      progressFill.style.width = "0%";
      resetLike();
      updateListeners();

      audio.play().catch(err => {
        console.log("Audio play blocked:", err);
      });
    }

    startBtn.onclick = async () => {
      startBtn.disabled = true;
      startBtn.textContent = "Loading...";

      await loadTracksFromSupabase();

      if (!tracks.length) {
        startBtn.disabled = false;
        startBtn.textContent = "Start Radio";
        return;
      }

      startBtn.classList.add("hidden");
      player.classList.remove("hidden");
      nextTrack();
    };

    skipBtn.onclick = nextTrack;

    likeBtn.onclick = () => {
      liked = !liked;
      likeBtn.textContent = liked ? "♥ Liked" : "♡ Like";
      if (liked) {
        likeBtn.classList.remove("outline");
        likeBtn.classList.add("gold");
      } else {
        likeBtn.classList.remove("gold");
        likeBtn.classList.add("outline");
      }
    };

    audio.addEventListener("timeupdate", () => {
      const max = 60;
      const t = Math.min(audio.currentTime, max);
      progressFill.style.width = (t / max * 100) + "%";

      if (audio.currentTime >= max) {
        nextTrack();
      }
    });

    audio.addEventListener("ended", () => {
      nextTrack();
    });

    volume.oninput = e => {
      audio.volume = Number(e.target.value);
    };

    audio.volume = 0.8;

    setInterval(() => {
      if (!player.classList.contains("hidden")) {
        updateListeners();
      }
    }, 10000);

    function escapeHtml(str) {
      return String(str || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }
  </script>
</body>
</html>
