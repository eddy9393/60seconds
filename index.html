<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>60seconds.fm</title>
  <style>
    body {
      margin: 0;
      background: #0b0b0b;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      flex-direction: column;
    }

    h1 {
      color: gold;
      font-size: 48px;
      margin-bottom: 12px;
    }

    p {
      opacity: 0.8;
      font-size: 20px;
    }

    .card {
      margin-top: 30px;
      background: #151515;
      border: 1px solid #2a2a2a;
      border-radius: 20px;
      padding: 30px;
      text-align: center;
      width: 320px;
      box-shadow: 0 0 30px rgba(255, 215, 0, 0.12);
    }

    button {
      margin: 10px 8px 0;
      padding: 12px 18px;
      border: none;
      border-radius: 12px;
      background: gold;
      color: black;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>60seconds.fm</h1>
  <p>Discover music in 60 seconds.</p>

  <div class="card">
    <h2>Track Name</h2>
    <p>Artist Name</p>
    <button>❤️ Like</button>
    <button>⏭ Skip</button>
    <p>12,398 drops</p>
    <p>220 plays</p>
  </div>
</body>
</html>
