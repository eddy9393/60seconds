<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>60 Seconds FM</title>

<style>
body {
  margin:0;
  background:#0b0b0b;
  color:white;
  font-family:Arial;
  text-align:center;
}

.brand-title {
  font-size:64px;
  font-weight:900;
  background:linear-gradient(gold,#8f6b13);
  -webkit-background-clip:text;
  color:transparent;
}

.submit-btn {
  margin-top:20px;
  padding:14px 24px;
  border-radius:999px;
  background:gold;
  color:black;
  text-decoration:none;
  font-weight:bold;
  display:inline-block;
}

.radio {
  max-width:600px;
  margin:40px auto;
  padding:30px;
  background:#151515;
  border-radius:20px;
  opacity:.4;
  transition:.3s;
}

.radio.active {
  opacity:1;
}

button {
  padding:12px 18px;
  border-radius:999px;
  border:none;
  margin:5px;
  cursor:pointer;
}

.gold {
  background:gold;
  color:black;
}

.progress {
  height:8px;
  background:#333;
  border-radius:999px;
  margin:10px 0;
}

.fill {
  height:100%;
  width:0%;
  background:gold;
}

.hidden {
  display:none;
}
</style>
</head>

<body>

<a href="/">
  <div class="brand-title">60 Seconds FM</div>
</a>

<p>Let’s make every minute count</p>

<a href="join.html" class="submit-btn">Submit your track</a>

<div id="authCollapsed">
  <button id="showLogin">Login</button>
</div>

<div id="authBox" class="hidden">
  <input id="email" placeholder="Email">
  <input id="password" placeholder="Password">
  <button id="signup">Sign up</button>
  <button id="login">Log in</button>
</div>

<div id="userBox" class="hidden">
  <img id="avatar" width="50" style="border-radius:50%">
  <button id="logout">Logout</button>
</div>

<div class="radio" id="radio">
  <button id="start">Start Radio</button>

  <div id="player" class="hidden">
    <h2 id="title"></h2>
    <div id="artist"></div>

    <div>
      <span id="time">0:00</span> / 1:00
    </div>

    <div class="progress">
      <div class="fill" id="progress"></div>
    </div>

    <button id="like">Like</button>
    <button id="skip">Skip</button>

    <input id="volume" type="range" min="0" max="1" step="0.01" value="0.8">

    <div id="listeners">0 Listeners</div>
  </div>
</div>

<div>
  <div>Submitted Tracks: <span id="submitted"></span></div>
  <div id="playsWrap">Estimated Plays: <span id="plays"></span></div>
  <div id="myPlaysWrap" class="hidden">Your Plays: <span id="myPlays"></span></div>
</div>

<audio id="audio" autoplay></audio>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const supabase = window.supabase.createClient(
  "https://rgoutegbcpjytplqcwze.supabase.co",
  "sb_publishable_255qyDKS77nMU0pbedfa_A_3hdgtEHh"
);

// AUTH
const showLogin = document.getElementById("showLogin");
const authBox = document.getElementById("authBox");
const authCollapsed = document.getElementById("authCollapsed");
const userBox = document.getElementById("userBox");
const avatar = document.getElementById("avatar");

showLogin.onclick = ()=>{
  authCollapsed.classList.add("hidden");
  authBox.classList.remove("hidden");
};

async function updateUser(){
  const {data} = await supabase.auth.getUser();
  if(data.user){
    authBox.classList.add("hidden");
    userBox.classList.remove("hidden");

    const {data:profile} = await supabase
      .from("profiles")
      .select("*")
      .eq("user_id",data.user.id)
      .single();

    if(profile?.photo_url) avatar.src = profile.photo_url;
  }
}

document.getElementById("signup").onclick=async()=>{
  await supabase.auth.signUp({
    email:email.value,
    password:password.value
  });
};

document.getElementById("login").onclick=async()=>{
  await supabase.auth.signInWithPassword({
    email:email.value,
    password:password.value
  });
  updateUser();
};

document.getElementById("logout").onclick=async()=>{
  await supabase.auth.signOut();
  location.reload();
};

updateUser();

// RADIO
let tracks=[];
let current=-1;
let listenerId=null;

const audio=document.getElementById("audio");
const radio=document.getElementById("radio");

async function loadTracks(){
  const {data}=await supabase
    .from("tracks")
    .select("*")
    .eq("status","approved");

  tracks=data||[];
}

async function nextTrack(){
  if(!tracks.length)return;

  current=Math.floor(Math.random()*tracks.length);
  const t=tracks[current];

  title.textContent=t.title;
  artist.textContent=t.artist;

  audio.src=t.file_url;
  audio.play().catch(()=>{});

  supabase.from("tracks")
    .update({play_count:(t.play_count||0)+1})
    .eq("id",t.id);
}

document.getElementById("start").onclick=async()=>{
  radio.classList.add("active");
  document.getElementById("start").classList.add("hidden");
  document.getElementById("player").classList.remove("hidden");

  await loadTracks();
  await nextTrack();

  registerListener();
  updateListeners();
  loadStats();
  loadMyPlays();
};

document.getElementById("skip").onclick=nextTrack;

// VOLUME FIX
volume.addEventListener("input",(e)=>{
  const v=Number(e.target.value);
  audio.volume=v;
  audio.muted=v===0;
});

// LISTENERS
async function registerListener(){
  if(!listenerId){
    listenerId=crypto.randomUUID();
  }

  await supabase.from("listeners").upsert({
    user_id:listenerId,
    last_seen:new Date()
  });
}

async function updateListeners(){
  const {count}=await supabase
    .from("listeners")
    .select("*",{count:"exact",head:true});

  listeners.textContent=count+" Listeners";
}

setInterval(updateListeners,10000);
setInterval(registerListener,15000);

// TIME
audio.ontimeupdate=()=>{
  const t=Math.min(audio.currentTime,60);
  progress.style.width=(t/60*100)+"%";

  const m=Math.floor(t/60);
  const s=Math.floor(t%60).toString().padStart(2,"0");
  time.textContent=m+":"+s;

  if(t>=60) nextTrack();
};

// STATS
async function loadStats(){
  const {count:total}=await supabase.from("tracks").select("*",{count:"exact",head:true});
  const {count:approved}=await supabase.from("tracks").select("*",{count:"exact",head:true}).eq("status","approved");

  submitted.textContent=total;

  const {data:user}=await supabase.auth.getUser();

  if(!user.user){
    playsWrap.style.display="none";
    return;
  }

  const {count:mine}=await supabase.from("tracks")
    .select("*",{count:"exact",head:true})
    .eq("user_id",user.user.id)
    .eq("status","approved");

  if(!mine){
    playsWrap.style.display="none";
    return;
  }

  plays.textContent=Math.floor(1440/approved);
}

// MY PLAYS
async function loadMyPlays(){
  const {data:user}=await supabase.auth.getUser();
  if(!user.user)return;

  const {data}=await supabase
    .from("tracks")
    .select("play_count")
    .eq("user_id",user.user.id);

  let total=0;
  data.forEach(t=> total+=t.play_count||0);

  myPlaysWrap.classList.remove("hidden");
  myPlays.textContent=total;
}
</script>

</body>
</html>
