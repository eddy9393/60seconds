<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>60 Seconds Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/admin.css" />
</head>
<body>
  <div class="shell">
    <header class="hero">
      <div class="hero-kicker">60 Seconds admin</div>
      <img class="hero-logo" src="logo.png" alt="60 Seconds logo" />
      <h1 class="hero-title">Admin</h1>
      
      
    </header>

    <div id="lockedBox" class="locked hidden">
      <h2>Access denied</h2>
      <p>Please log in with the admin account.</p>
    </div>

    <div id="loadingBox" class="loading">
      <h2>Loading</h2>
      <p id="loadingText">Checking admin access...</p>
    </div>

    <main id="adminApp" class="hidden">
      <section class="section section-priority">
        <div class="section-heading">
          <div>
            <div class="section-overline">Priority</div>
            <h2 class="section-title">Approve pending tunes</h2>
          </div>
        </div>
        <div id="status"></div>
        <div id="debug"></div>
        <div id="trackList"></div>
      </section>

      <section class="section section-metrics">
        <div class="section-heading">
          <div>
            <div class="section-overline">Overview</div>
            <h2 class="section-title">Traffic & platform overview</h2>
          </div>
        </div>
        <ul id="metricList" class="metric-list"></ul>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    const ADMIN_EMAIL = 'kroonstadt.earvin@gmail.com';
    const supabaseClient = window.SSFMApp.getSupabaseClient();

    const loadingBoxEl = document.getElementById('loadingBox');
    const loadingTextEl = document.getElementById('loadingText');
    const lockedBoxEl = document.getElementById('lockedBox');
    const adminAppEl = document.getElementById('adminApp');
    const statusEl = document.getElementById('status');
    const debugEl = document.getElementById('debug');
    const trackListEl = document.getElementById('trackList');
    const metricListEl = document.getElementById('metricList');

    let currentUser = null;
    let hasInitialized = false;
    let isApproving = false;

    function escapeHtml(value) {
      return window.SSFMApp.escapeHtml(value);
    }

    function setStatus(message, isError = false) {
      statusEl.textContent = message || '';
      statusEl.style.color = isError ? 'var(--danger)' : 'var(--muted)';
    }

    function setDebug(message) {
      debugEl.textContent = message || '';
    }

    function showLoading(message) {
      loadingTextEl.textContent = message || 'Loading...';
      loadingBoxEl.classList.remove('hidden');
      lockedBoxEl.classList.add('hidden');
      adminAppEl.classList.add('hidden');
    }

    function showLocked() {
      loadingBoxEl.classList.add('hidden');
      lockedBoxEl.classList.remove('hidden');
      adminAppEl.classList.add('hidden');
    }

    function showAdmin() {
      loadingBoxEl.classList.add('hidden');
      lockedBoxEl.classList.add('hidden');
      adminAppEl.classList.remove('hidden');
    }

    function isAdminUser(user) {
      return Boolean(user && user.email && user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase());
    }

    async function getSessionUser() {
      const { data, error } = await supabaseClient.auth.getSession();
      if (error) {
        setDebug('getSession error: ' + error.message);
        return null;
      }
      return data?.session?.user || null;
    }

    async function validateUser() {
      const { data, error } = await supabaseClient.auth.getUser();
      if (error) {
        setDebug('getUser error: ' + error.message);
        return null;
      }
      return data?.user || null;
    }

    async function checkAdminAccess() {
      let user = await getSessionUser();
      if (!user) user = await validateUser();
      currentUser = user;

      if (!user || !isAdminUser(user)) {
        showLocked();
        return false;
      }

      showAdmin();
      return true;
    }

    function renderPendingTracks(tracks) {
      trackListEl.innerHTML = '';

      if (!tracks.length) {
        trackListEl.innerHTML = '<div class="empty">No pending tracks right now.</div>';
        setStatus('No pending tunes waiting for approval.');
        return;
      }

      setStatus(`${tracks.length} pending tune(s) waiting for approval.`);

      tracks.forEach((track) => {
        const createdAt = track.created_at ? new Date(track.created_at).toLocaleString() : 'Unknown';
        const article = document.createElement('article');
        article.className = 'track-item';
        article.innerHTML = `
          <div class="track-head">
            <div>
              <h3 class="track-title">${escapeHtml(track.title || 'Untitled')}</h3>
              <p class="track-meta">Artist: ${escapeHtml(track.artist || 'Unknown')}</p>
              <p class="track-id">ID: ${escapeHtml(track.id)} · Submitted: ${escapeHtml(createdAt)}</p>
            </div>
            <div class="track-status">pending</div>
          </div>
          <audio controls preload="none" src="${escapeHtml(track.file_url || '')}"></audio>
          <button class="approve-btn" data-action="approve" data-id="${escapeHtml(track.id)}">Approve tune</button>
        `;
        trackListEl.appendChild(article);
      });

      document.querySelectorAll('[data-action="approve"]').forEach((button) => {
        button.addEventListener('click', async () => {
          if (isApproving) return;
          await approveTrack(button.getAttribute('data-id'), button);
        });
      });
    }

    async function loadPendingTracks() {
      const { data, error } = await supabaseClient
        .from('tracks')
        .select('id, title, artist, file_url, created_at, status')
        .eq('status', 'pending')
        .order('created_at', { ascending: false });

      if (error) {
        setStatus('Could not load pending tracks: ' + error.message, true);
        return;
      }

      renderPendingTracks(data || []);
    }

    async function approveTrack(trackId, buttonEl) {
      if (!trackId) return;
      isApproving = true;
      const originalLabel = buttonEl.textContent;
      buttonEl.disabled = true;
      buttonEl.textContent = 'Approving...';

      const { error } = await supabaseClient
        .from('tracks')
        .update({ status: 'approved' })
        .eq('id', trackId);

      if (error) {
        setStatus('Approve failed: ' + error.message, true);
        buttonEl.disabled = false;
        buttonEl.textContent = originalLabel;
        isApproving = false;
        return;
      }

      setStatus('Tune approved.');
      await Promise.all([loadPendingTracks(), loadMetrics()]);
      isApproving = false;
    }

    function renderMetrics(snapshot) {
      const rows = [
        {
          label: 'Unique visitors today',
          help: 'Distinct visitor keys seen across the website today.',
          value: snapshot.unique_visitors_today ?? 0
        },
        {
          label: 'Unique visitors (7 days)',
          help: 'Distinct visitors seen in the last 7 days.',
          value: snapshot.unique_visitors_7d ?? 0
        },
        {
          label: 'Unique visitors (30 days)',
          help: 'Distinct visitors seen in the last 30 days.',
          value: snapshot.unique_visitors_30d ?? 0
        },
        {
          label: 'Returning visitors (30 days)',
          help: 'Visitors who showed up on more than one day in the last 30 days.',
          value: snapshot.returning_visitors_30d ?? 0
        },
        {
          label: 'Profiles on the platform',
          help: 'All profile rows currently present in the platform.',
          value: snapshot.total_profiles ?? 0
        },
        {
          label: 'Live artist profiles',
          help: 'Profiles with an artist name that can appear publicly.',
          value: snapshot.live_artist_profiles ?? 0
        },
        {
          label: 'Pending tracks',
          help: 'Tunes currently waiting for approval.',
          value: snapshot.pending_tracks ?? 0
        },
        {
          label: 'Approved tracks',
          help: 'Tunes already approved and available to listeners.',
          value: snapshot.approved_tracks ?? 0
        },
        {
          label: 'Total platform likes',
          help: 'All likes stored in track_likes across the platform.',
          value: snapshot.total_platform_likes ?? 0
        },
        {
          label: 'Top page today',
          help: 'Most visited path across today’s tracked sessions.',
          value: snapshot.top_page_today || '—'
        }
      ];

      metricListEl.innerHTML = rows.map((row) => `
        <li class="metric-row">
          <span class="metric-label">${escapeHtml(row.label)}<span class="metric-help">${escapeHtml(row.help)}</span></span>
          <span class="metric-value">${escapeHtml(String(row.value))}</span>
        </li>
      `).join('');
    }

    async function loadMetrics() {
      const { data, error } = await supabaseClient.rpc('get_admin_traffic_snapshot');
      if (error) {
        setDebug('metrics error: ' + error.message);
        metricListEl.innerHTML = '<li class="empty">Could not load admin metrics right now.</li>';
        return;
      }

      renderMetrics(Array.isArray(data) ? (data[0] || {}) : (data || {}));
    }

    async function boot() {
      showLoading('Checking admin access...');
      const ok = await checkAdminAccess();
      if (!ok) return;
      showLoading('Loading admin data...');
      showAdmin();
      await Promise.all([loadPendingTracks(), loadMetrics()]);
    }

    document.addEventListener('DOMContentLoaded', async () => {
      if (hasInitialized) return;
      hasInitialized = true;
      await boot();
    });
  </script>
</body>
</html>
