<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>60seconds Admin</title>

  <style>
    body {
      margin: 0;
      background: #0b0b0b;
      color: white;
      font-family: Arial, sans-serif;
      padding: 30px 20px;
      text-align: center;
    }

    h1 {
      color: gold;
      margin-bottom: 10px;
    }

    .top-links {
      margin-bottom: 20px;
    }

    .top-links a {
      display: inline-block;
      margin: 0 6px;
      color: gold;
      text-decoration: none;
      border: 1px solid rgba(255, 215, 0, 0.4);
      padding: 10px 16px;
      border-radius: 999px;
    }

    .card {
      background: #151515;
      border-radius: 20px;
      padding: 24px;
      max-width: 900px;
      margin: 20px auto;
      text-align: left;
    }

    .track {
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 16px;
      background: rgba(255,255,255,0.02);
    }

    .track h3 {
      margin: 0 0 6px;
      color: gold;
    }

    .track p {
      margin: 6px 0;
      color: #ddd;
    }

    audio {
      width: 100%;
      margin: 12px 0;
    }

    button {
      padding: 12px 18px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      margin-right: 8px;
      font-weight: bold;
    }

    .gold {
      background: gold;
      color: black;
    }

    .danger {
      background: #a83333;
      color: white;
    }

    #status, #debug {
      max-width: 900px;
      margin: 12px auto;
      min-height: 20px;
    }

    #status {
      color: #ddd;
    }

    #debug {
      color: #888;
      font-size: 13px;
    }

    .empty {
      color: #999;
      text-align: center;
      padding: 20px 0;
    }
  </style>
</head>
<body>

  <h1>60seconds Admin</h1>

  <div class="top-links">
    <a href="index.html">Homepage</a>
    <a href="join.html">Join page</a>
  </div>

  <div id="status">Loading pending tracks...</div>
  <div id="debug"></div>

  <div class="card">
    <div id="trackList"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const supabaseClient = window.supabase.createClient(
      "https://rgoutegbcpjytplqcwze.supabase.co",
      "sb_publishable_255qyDKS77nMU0pbedfa_A_3hdgtEHh"
    );

    const statusEl = document.getElementById("status");
    const debugEl = document.getElementById("debug");
    const trackListEl = document.getElementById("trackList");

    function setStatus(msg, isError = false) {
      statusEl.textContent = msg;
      statusEl.style.color = isError ? "#ff8a8a" : "#ddd";
      console.log(msg);
    }

    function setDebug(msg) {
      debugEl.textContent = msg;
      console.log("DEBUG:", msg);
    }

    async function loadPendingTracks() {
      setDebug("Loading pending tracks from Supabase...");

      const { data, error } = await supabaseClient
        .from("tracks")
        .select("id, title, artist, file_url, status, created_at")
        .eq("status", "pending")
        .order("created_at", { ascending: false });

      if (error) {
        setStatus("Error loading tracks: " + error.message, true);
        return;
      }

      renderTracks(data || []);
    }

    function renderTracks(tracks) {
      trackListEl.innerHTML = "";

      if (!tracks.length) {
        trackListEl.innerHTML = `<div class="empty">No pending tracks right now.</div>`;
        setStatus("No pending tracks found.");
        return;
      }

      setStatus(`${tracks.length} pending track(s) found.`);

      tracks.forEach(track => {
        const div = document.createElement("div");
        div.className = "track";
        div.innerHTML = `
          <h3>${escapeHtml(track.title)}</h3>
          <p><strong>Artist:</strong> ${escapeHtml(track.artist)}</p>
          <p><strong>Status:</strong> ${escapeHtml(track.status)}</p>
          <p><strong>ID:</strong> ${escapeHtml(track.id)}</p>
          <audio controls src="${track.file_url}"></audio>
          <div>
            <button class="gold" data-id="${track.id}" data-action="approve">Approve</button>
          </div>
        `;
        trackListEl.appendChild(div);
      });

      wireButtons();
    }

    function wireButtons() {
      const buttons = document.querySelectorAll("button[data-action='approve']");

      buttons.forEach(button => {
        button.addEventListener("click", async () => {
          const id = button.getAttribute("data-id");
          await approveTrack(id);
        });
      });
    }

    async function approveTrack(trackId) {
      setStatus("Approving track...");
      setDebug("Updating status to approved for track " + trackId);

      const { error } = await supabaseClient
        .from("tracks")
        .update({ status: "approved" })
        .eq("id", trackId);

      if (error) {
        setStatus("Approve failed: " + error.message, true);
        return;
      }

      setStatus("Track approved ✅");
      await loadPendingTracks();
    }

    function escapeHtml(str) {
      return String(str)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    loadPendingTracks();
  </script>

</body>
</html>
