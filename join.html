<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Create Artist Profile - 60 Seconds FM</title>

  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --gold: #d4af37;
      --text: #f5f5f5;
      --muted: #a8a8a8;
    }

    body {
      margin: 0;
      background: #0b0b0b;
      color: var(--text);
      font-family: 'Manrope', sans-serif;
      padding: 20px;
    }

    h1 {
      font-family: 'Space Grotesk', sans-serif;
      text-align: center;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: var(--muted);
      max-width: 600px;
      margin: 0 auto 30px;
    }

    .card {
      max-width: 600px;
      margin: 0 auto;
      background: #151515;
      padding: 24px;
      border-radius: 20px;
    }

    input, textarea, select {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 10px;
      border: none;
      background: #1f1f1f;
      color: white;
    }

    textarea {
      min-height: 100px;
    }

    button {
      width: 100%;
      padding: 14px;
      border-radius: 999px;
      border: none;
      background: linear-gradient(180deg, #fff5c9, #d4af37);
      font-weight: bold;
      cursor: pointer;
      margin-top: 12px;
    }

    .checkbox-row {
      display: flex;
      gap: 10px;
      margin-top: 10px;
      align-items: flex-start;
    }

    .checkbox-row input {
      width: auto;
    }

    #status {
      margin-top: 15px;
      text-align: center;
      color: #ccc;
    }
  </style>
</head>

<body>

  <h1>Create Your Artist Profile</h1>

  <div class="subtitle">
    Set up your artist profile to enter the platform. After that, you can submit your track for radio approval.
  </div>

  <div class="card">

    <input id="artistName" placeholder="Artist name" />
    <textarea id="bio" placeholder="Short bio"></textarea>

    <select id="nationality">
      <option value="">Select nationality</option>
      <option>Netherlands</option>
      <option>United States</option>
      <option>United Kingdom</option>
      <option>Germany</option>
      <option>France</option>
      <option>Spain</option>
      <option>Italy</option>
      <option>Canada</option>
      <option>Australia</option>
      <!-- voeg eventueel later volledig landlijst toe -->
    </select>

    <input id="dob" type="date" />

    <input id="social" placeholder="Social / streaming link" />

    <input id="photo" type="file" accept="image/*" />

    <div class="checkbox-row">
      <input id="promo" type="checkbox" />
      <label for="promo">Keep me updated on promotions</label>
    </div>

    <div class="checkbox-row">
      <input id="terms" type="checkbox" />
      <label for="terms">I accept the terms and conditions</label>
    </div>

    <button id="submit">Create Profile</button>

    <div id="status"></div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const supabaseClient = window.supabase.createClient(
      "https://rgoutegbcpjytplqcwze.supabase.co",
      "sb_publishable_255qyDKS77nMU0pbedfa_A_3hdgtEHh"
    );

    const statusEl = document.getElementById("status");

    function setStatus(msg, error = false) {
      statusEl.textContent = msg;
      statusEl.style.color = error ? "#ff8a8a" : "#ccc";
    }

    document.getElementById("submit").onclick = async () => {
      const artistName = document.getElementById("artistName").value.trim();
      const bio = document.getElementById("bio").value.trim();
      const nationality = document.getElementById("nationality").value;
      const dob = document.getElementById("dob").value;
      const social = document.getElementById("social").value;
      const photo = document.getElementById("photo").files[0];
      const promo = document.getElementById("promo").checked;
      const terms = document.getElementById("terms").checked;

      if (!artistName) {
        setStatus("Please enter artist name", true);
        return;
      }

      if (!terms) {
        setStatus("You must accept the terms", true);
        return;
      }

      const { data: userData } = await supabaseClient.auth.getUser();

      if (!userData.user) {
        setStatus("You must be logged in", true);
        return;
      }

      const userId = userData.user.id;

      let photoUrl = null;

      if (photo) {
        const path = `${userId}/${Date.now()}-${photo.name}`;

        await supabaseClient.storage
          .from("artist-photos")
          .upload(path, photo);

        const { data } = supabaseClient.storage
          .from("artist-photos")
          .getPublicUrl(path);

        photoUrl = data.publicUrl;
      }

      const { error } = await supabaseClient
        .from("profiles")
        .upsert([
          {
            user_id: userId,
            artist_name: artistName,
            bio,
            nationality,
            date_of_birth: dob,
            social_link: social,
            photo_url: photoUrl,
            wants_promotions: promo
          }
        ]);

      if (error) {
        setStatus(error.message, true);
        return;
      }

      setStatus("Profile saved successfully 🚀");

      setTimeout(() => {
        window.location.href = "submit-track.html";
      }, 1000);
    };
  </script>

</body>
</html>
