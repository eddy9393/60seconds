<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Join 60seconds</title>

  <style>
    body {
      background: #0b0b0b;
      color: white;
      font-family: Arial;
      text-align: center;
      padding: 40px;
    }

    h1 {
      color: gold;
    }

    .card {
      background: #151515;
      padding: 30px;
      border-radius: 20px;
      max-width: 500px;
      margin: auto;
    }

    input, textarea {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 10px;
      border: none;
    }

    button {
      background: gold;
      border: none;
      padding: 12px 20px;
      border-radius: 999px;
      cursor: pointer;
      font-weight: bold;
    }

    #status {
      margin-top: 15px;
      color: #ccc;
    }
  </style>
</head>
<body>

<h1>Join 60seconds</h1>

<div class="card">
  <input id="title" placeholder="Track title" />
  <input id="artist" placeholder="Artist name" />
  <input id="file" placeholder="Track URL (mp3 link)" />
  
  <button id="submit">Upload Track</button>

  <div id="status">Ready</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const supabaseClient = window.supabase.createClient(
  "https://rgoutegbcpjytplqcwze.supabase.co",
  "sb_publishable_255qyDKS77nMU0pbedfa_A_3hdgtEHh"
);

const status = document.getElementById("status");

document.getElementById("submit").onclick = async () => {
  const title = document.getElementById("title").value;
  const artist = document.getElementById("artist").value;
  const file = document.getElementById("file").value;

  if (!title || !artist || !file) {
    status.innerText = "Fill all fields";
    return;
  }

  status.innerText = "Uploading...";

  const { data: userData } = await supabaseClient.auth.getUser();

  if (!userData.user) {
    status.innerText = "You must be logged in";
    return;
  }

  const { error } = await supabaseClient
    .from("tracks")
    .insert([
      {
        title: title,
        artist: artist,
        file_url: file,
        user_id: userData.user.id
      }
    ]);

  if (error) {
    status.innerText = "Error: " + error.message;
  } else {
    status.innerText = "Track uploaded 🚀";

    document.getElementById("title").value = "";
    document.getElementById("artist").value = "";
    document.getElementById("file").value = "";
  }
};
</script>

</body>
</html>
