<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Create Artist Profile - 60 Seconds FM</title>

  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --gold: #d4af37;
      --gold-2: #f4d77a;
      --gold-dark: #8f6b13;
      --text: #f5f5f5;
      --muted: #a8a8a8;
      --border: rgba(255,255,255,0.08);
      --border-gold: rgba(212,175,55,0.18);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(180deg, rgba(7, 7, 7, 0.48) 0%, rgba(7, 7, 7, 0.72) 45%, rgba(7, 7, 7, 0.82) 100%),
        radial-gradient(circle at top, rgba(212, 175, 55, 0.14), transparent 30%),
        url("bg-mobile-final-1080x1920.webp");
      background-size: cover, auto, cover;
      background-position: center top, center top, center center;
      background-repeat: no-repeat, no-repeat, no-repeat;
      background-attachment: fixed, scroll, fixed;
      color: var(--text);
      font-family: 'Manrope', sans-serif;
      padding: 0 18px 44px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body.menu-open {
      overflow: hidden;
    }

    h1, h2, h3 {
      font-family: 'Space Grotesk', sans-serif;
      margin: 0;
    }

    a {
      color: inherit;
    }

    .hidden {
      display: none !important;
    }

    .site-shell {
      max-width: 1180px;
      margin: 0 auto;
      padding-top: 8px;
    }

    .header-wrap {
      position: sticky;
      top: 0;
      z-index: 80;
      width: 100%;
      background: linear-gradient(180deg, rgba(0,0,0,0.74), rgba(0,0,0,0.42) 70%, rgba(0,0,0,0));
      backdrop-filter: blur(6px);
    }

    .header-bar {
      width: 100%;
      min-height: 74px;
      display: grid;
      grid-template-columns: 60px 1fr 60px;
      align-items: center;
      gap: 10px;
      padding: 8px 16px 4px;
      position: relative;
    }

    .header-left,
    .header-center,
    .header-right {
      display: flex;
      align-items: center;
      min-width: 0;
    }

    .header-left {
      justify-content: flex-start;
    }

    .header-center {
      justify-content: center;
      pointer-events: none;
    }

    .header-center > * {
      pointer-events: auto;
    }

    .header-right {
      justify-content: flex-end;
      position: relative;
    }

    .header-logo-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
    }

    .header-logo {
      display: block;
      width: min(288px, 45vw);
      height: auto;
      filter:
        drop-shadow(0 8px 18px rgba(0, 0, 0, 0.35))
        drop-shadow(0 0 20px rgba(212, 175, 55, 0.08));
    }

    .header-icon-btn {
      width: 42px;
      height: 42px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.14);
      background:
        linear-gradient(180deg, rgba(255,255,255,0.12), rgba(255,255,255,0.04)),
        linear-gradient(180deg, rgba(10,10,10,0.86), rgba(10,10,10,0.92));
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.08),
        0 10px 22px rgba(0,0,0,0.24);
      backdrop-filter: blur(4px);
      transition: transform 0.14s ease, box-shadow 0.14s ease, filter 0.14s ease;
      padding: 0;
    }

    .header-icon-btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.03);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.10),
        0 14px 24px rgba(0,0,0,0.28);
    }

    .menu-icon {
      position: relative;
      width: 20px;
      height: 16px;
      transition: transform 0.2s ease;
    }
