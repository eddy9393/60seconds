<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Join 60seconds</title>

  <style>
    body {
      background: #0b0b0b;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 40px 20px;
      margin: 0;
    }

    h1 {
      color: gold;
      margin-bottom: 10px;
    }

    .card {
      background: #151515;
      padding: 30px;
      border-radius: 20px;
      max-width: 620px;
      margin: 20px auto;
    }

    input, textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin: 10px 0;
      border-radius: 10px;
      border: none;
      font-size: 16px;
    }

    input[type="file"] {
      background: #fff;
      color: #000;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    button {
      background: gold;
      border: none;
      padding: 12px 20px;
      border-radius: 999px;
      cursor: pointer;
      font-weight: bold;
      font-size: 15px;
      margin-top: 8px;
    }

    #status {
      margin-top: 15px;
      color: #ccc;
      min-height: 20px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    #debug {
      margin-top: 8px;
      color: #888;
      font-size: 12px;
      min-height: 16px;
    }

    .link {
      color: gold;
      text-decoration: none;
      display: inline-block;
      margin-top: 12px;
    }

    .note {
      color: #aaa;
      font-size: 14px;
      line-height: 1.5;
      max-width: 620px;
      margin: 0 auto;
    }
  </style>
</head>
<body>

  <h1>Join 60seconds</h1>
  <p class="note">
    Upload your artist profile and one track. Your track will be saved as <strong>pending</strong>
    until it gets approved for the radio.
  </p>

  <div class="card">
    <input id="artistName" placeholder="Artist name" />
    <textarea id="bio" placeholder="Short bio"></textarea>
    <input id="socialLink" placeholder="Social or streaming link" />
    <input id="photoFile" type="file" accept="image/jpeg,image/png,image/webp" />
    <input id="title" placeholder="Track title" />
    <input id="trackFile" type="file" accept=".mp3,audio/mpeg,audio/mp3" />

    <button id="submit">Save Profile + Upload Track</button>

    <div id="status">Ready</div>
    <div id="debug"></div>

    <a class="link" href="index.html">← Back to homepage</a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const supabaseClient = window.supabase.createClient(
      "https://rgoutegbcpjytplqcwze.supabase.co",
      "sb_publishable_255qyDKS77nMU0pbedfa_A_3hdgtEHh"
    );

    const statusEl = document.getElementById("status");
    const debugEl = document.getElementById("debug");

    function setStatus(message, isError = false) {
      statusEl.textContent = message;
      statusEl.style.color = isError ? "#ff8a8a" : "#ccc";
      console.log(message);
    }

    function setDebug(message) {
      debugEl.textContent = message;
      console.log("DEBUG:", message);
    }

    document.getElementById("submit").onclick = async () => {
      const artistName = document.getElementById("artistName").value.trim();
      const bio = document.getElementById("bio").value.trim();
      const socialLink = document.getElementById("socialLink").value.trim();
      const photoFile = document.getElementById("photoFile").files[0];
      const title = document.getElementById("title").value.trim();
      const trackFile = document.getElementById("trackFile").files[0];

      if (!artistName || !title || !photoFile || !trackFile) {
        setStatus("Please fill in artist name, track title, photo and track file.", true);
        return;
      }

      setStatus("Checking login...");
      const { data: userData, error: userError } = await supabaseClient.auth.getUser();

      if (userError) {
        setStatus("Could not check current user: " + userError.message, true);
        return;
      }

      if (!userData.user) {
        setStatus("You must be logged in before uploading.", true);
        return;
      }

      const userId = userData.user.id;

      // Upload profile photo
      setStatus("Uploading artist photo...");
      setDebug("Uploading to artist-photos bucket");

      const photoPath = `${userId}/${Date.now()}-${photoFile.name.replace(/\s+/g, "-")}`;

      const { error: photoUploadError } = await supabaseClient
        .storage
        .from("artist-photos")
        .upload(photoPath, photoFile, {
          cacheControl: "3600",
          upsert: true
        });

      if (photoUploadError) {
        setStatus("Photo upload failed: " + photoUploadError.message, true);
        return;
      }

      const { data: photoUrlData } = supabaseClient
        .storage
        .from("artist-photos")
        .getPublicUrl(photoPath);

      const photoUrl = photoUrlData.publicUrl;

      // Save profile
      setStatus("Saving artist profile...");
      setDebug("Upserting profile");

      const { error: profileError } = await supabaseClient
        .from("profiles")
        .upsert([
          {
            user_id: userId,
            artist_name: artistName,
            bio: bio,
            social_link: socialLink,
            photo_url: photoUrl
          }
        ]);

      if (profileError) {
        setStatus("Saving profile failed: " + profileError.message, true);
        return;
      }

      // Upload track
      setStatus("Uploading track...");
      setDebug("Uploading to tracks bucket");

      const trackPath = `${userId}/${Date.now()}-${trackFile.name.replace(/\s+/g, "-")}`;

      const { error: trackUploadError } = await supabaseClient
        .storage
        .from("tracks")
        .upload(trackPath, trackFile, {
          cacheControl: "3600",
          upsert: false
        });

      if (trackUploadError) {
        setStatus("Track upload failed: " + trackUploadError.message, true);
        return;
      }

      const { data: trackUrlData } = supabaseClient
        .storage
        .from("tracks")
        .getPublicUrl(trackPath);

      const trackUrl = trackUrlData.publicUrl;

      // Save track row
      setStatus("Saving track in database...");
      setDebug("Inserting track row");

      const { error: trackInsertError } = await supabaseClient
        .from("tracks")
        .insert([
          {
            title: title,
            artist: artistName,
            file_url: trackUrl,
            user_id: userId,
            status: "pending"
          }
        ]);

      if (trackInsertError) {
        setStatus("Saving track failed: " + trackInsertError.message, true);
        return;
      }

      setStatus("Profile and track uploaded successfully 🚀");
      setDebug("Done");

      document.getElementById("artistName").value = "";
      document.getElementById("bio").value = "";
      document.getElementById("socialLink").value = "";
      document.getElementById("photoFile").value = "";
      document.getElementById("title").value = "";
      document.getElementById("trackFile").value = "";
    };
  </script>

</body>
</html>
